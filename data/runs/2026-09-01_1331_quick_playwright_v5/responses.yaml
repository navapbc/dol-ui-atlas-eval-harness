- id: v5-Q1
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe daily NOPAY
    certification file generation is handled within the broader Daily Certification
    Extracts job. Here's the complete breakdown.\n\nJob: L2DCWEXR\n\nThis job belongs
    to subsystem CWE1 (Daily Process) and generates the Daily Certification Extracts
    Report using both the PAYVSAM (Loop Pay) and NOPAY backup GDG files. It has a
    Restart Criticality of 1 (highest).\nL2DCWEXR.md\n\nImportant context: The NOPAY
    file is processed together with the LOOPPAY file in a single job — they are not
    generated independently.\n\nStep-by-Step Execution Sequence\nL2DCWEXR Job Steps\n\
    \n#\n\n\t\n\nStep Name\n\n\t\n\nUtility / Program\n\n\t\n\n...\n\n\n1\tRECALDSN\t\
    IEFBR14\t...\n2\tCLEANUP1\tIEFBR14\t...\n3\tCOPYVPAY\tIDCAMS REPRO\t...\n4\tSORTVPAY\t\
    SORT\t...\n5\tCOPYNPAY\tIDCAMS REPRO\t...\n6\tSORTNPAY\tSORT\t...\n7\tCLEANUP2\t\
    IEFBR14\t...\n8\tDLYCWEXR\tDXCBDA2R (COBOL)\t...\n9\tCOPYCWER\tIEBGENER\t...\n\
    View more\nThe 12 Output Files from DXCBDA2R (Step 8)\n\nThe core COBOL program
    categorizes transactions based on the DATECARD processing date and writes them
    to these audit buckets :\nL2DCWEXR.md\n\nADTPRVWK — Previous week's pay period
    transactions\nADTD0629 — Deduction Code 0629 transactions\nADTD0928 — Deduction
    Code 0928 transactions\nADTONEWK — One-week pay cycle transactions\nADTTWOWK —
    Two-week (bi-weekly) pay cycle transactions\nADTCWE14 — Current Week Earnings
    over a 14-day period\nADTNEARN — Newly calculated/adjusted earnings\nADTWEARN
    — Standard weekly earnings\nADTLPAYS — Last/final pay transactions (e.g., terminations)\n\
    VOIDI1FL — Voided/reversed payment transactions\nBYPASSFL — Transactions bypassed
    from standard processing\nDAILYREP — Formatted Daily Audit Report (132-byte records)\n\
    Key Design Points\nConditional gating: Steps 3–6 and 8–9 are skipped if any prior
    step returns a non-zero RC. Steps 1, 2, and 7 run unconditionally.\nL2DCWEXR.md\n\
    Shared access: Both GDG backups are opened in shared mode, so other concurrent
    jobs are not blocked.\nL2DCWEXR.md\nHeader skip: Both IDCAMS REPRO steps skip
    the first record (header/control record) of their respective VSAM backups.\nL2DCWEXR.md\n\
    Record sizes: LOOPPAY = 323 bytes; NOPAY = 281 bytes.\nL2DCWEXR.md\nRestart: The
    JCL header documents restart procedures — most data-preparation steps restart
    from CLEANUP1; the two cleanup steps restart from themselves.\nL2DCWEXR.txt\n\
    A Note on NOPAYSUP\n\nThe knowledge base also documents a separate program called
    NOPAYSUP, which suppresses duplicate certifications between the LOOPPAY and NOPAY
    files. It executes after DXCBDSUP has completed suppression on the LOOPPAY file,
    in a different job context — not within L2DCWEXR itself.\nNOPAYSUP.txt\nNOPAYSUP.txt\n\
    \nWhat would you like to explore next?\n\nHow does DXCBDA2R categorize transactions?\n\
    \nTell me about the NOPAYSUP suppression program\n\nWhat are the restart procedures
    for L2DCWEXR?\n\nWhat upstream jobs produce the NOPAY and LOOPPAY backups?"
- id: v5-Q2
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nGood news — both
    DXCBO98B and job ZUMDA2R1 are well-documented in the knowledge base. However,
    I need to flag a naming correction first.\n\nName Clarification\n\nYour runbook
    says DXCB098B, but the program name in both the JCL source and the COBOL analysis
    document is actually DXCBO98B (letter O, not digit 0). This follows the LOOPS
    DXCB* batch naming convention. Please verify your runbook — the program the knowledge
    base documents is DXCBO98B.\nZUMDA2R1.txt\nDXCBO98B.md\n\nProgram DXCBO98B — NOPAY
    EB → PAYVSAM Converter\n\nThis is a batch COBOL program (Main/Driver module, sequential
    file access, no MQ). It reads 281-byte NOPAY EB records from INFILE and writes
    360-byte PAYVSAM-format EB records to OUTFILE.\nDXCBO98B.md\n\nWhere It Runs in
    Job ZUMDA2R1\n\nThe JCL comment directly above the step reads: *T.M.CONVERT NOPAY
    EB RECORD TO VSAMPAY. It executes at step DXCBO98B, conditioned COND=(0,NE) (skipped
    if any prior step fails).\nZUMDA2R1.txt\n\nINFILE → LAK2LDXP.ZUMDA2R1.MAIL.NOPAYEB.DTL
    (281-byte FB, produced by the earlier INCLEB sort step which filters NOPAY VSAM
    records where Transitional UI Pay is between X'0064' and X'00C7')\nOUTFILE → LAK2LDXP.ZUMDA2R1.MAIL.VSAMPAY.DTL
    (360-byte FB, newly created)\nProcessing Logic (24 Functional Steps)\n\nThe program
    follows a simple open → prime read → loop → summary → close pattern:\n\n1. Open
    Files — Opens NOPAY input (read) and PAYVSAM output (write).\n\n2. Prime Read
    — Reads the first NOPAY record; if EOF immediately, skips to step 23.\n\n3–21.
    Per-Record Conversion Loop — For each record:\n\nTable\n\n#\n\n\t\n\nFunctionality\n\
    \n\t\n\nWhat Happens\n\n\n3\tMap Claimant ID\tNOPAY-SSN → EB-SSN; NOPAY-PC → EB-PC;
    NOPAY-DOC → EB-DOC\n4\tMap Geographic Fields\tZIP (5+4 digits), Responsible Local
    Office, Local Office — all direct transfers\n5\tMap Dates/Times\tCWE Dates 1–4,
    Date Entered System transferred as-is; NOPAY-TIME-OF-ENTRY → EB-TIME-OF-CERT (repurposed
    as certification time)\n6\tMap Terminal/Operator\tEntry Terminal ID → Cert Terminal
    ID; Entry Operator ID → Cert Operator ID\n7\tSet Decert/Check Defaults\tPseudo
    Check #, Actual Check #, Check Amount, Date Paid, Time of Decert → zeroes; Decert
    Terminal ID → spaces; Decert Operator ID → zero; Void Indicator → 0 (active)\n\
    8\tMap WBR/WBA\tWeekly Benefit Rate and Weekly Benefit Amount — direct transfer\n\
    9\tMap Financial Amounts\tClaim Balance, Earnings (CWE1/CWE2), Pension (CWE1/CWE2),
    Other Amount, Gross Amount\n10\tMap Work-Week Fields\tWork-Week Earnings and Work-Week
    Indicators for CWE1 and CWE2\n11\tMap Health/Offset/UI\tHealth Amount, Offset
    Amounts (CWE1/CWE2), Transitional UI Payments (CWE1/CWE2)\n12\tReformat Name\t
    Input: LASTNAME/FIRSTNAME MIDDLENAME → split on /, split on space → reassemble
    as FIRST MIDDLE LAST in EB-FIRST-MIDDLE-LAST-NAME\nView more\n\n22. Loop — Read
    next NOPAY record, increment NUM-INPUT if found, set EOF='Y' if not; repeat steps
    3–21.\n\n23. Display Summary — Always runs (even if input was empty). Prints banner
    \"E.B. records converted to payvsam\" with TOTAL INPUT RECORDS (NUM-INPUT) and
    TOTAL OUTPUT RECORDS (NUM-TOT-OUTPUT).\n\n24. Close Files — Close INFILE then
    OUTFILE.\n\nKey Policy Rules (Hard-Coded Defaults)\nPayment Type Indicator is
    always '3' — no exceptions\nAll decertification fields zeroed/blanked — these
    are new certifications, not decerts\nFinancial Institution Name always blank —
    NOPAY records have no banking info\nCheck Amount, Actual Check #, Pseudo Check
    #, Date Paid all zero — no payment is being issued at conversion time\nImportant
    Context Within ZUMDA2R1\n\nThis program is one step in a larger pipeline. The
    NOPAY EB records it consumes were pre-filtered by the INCLEB SORT step (which
    selects records from the NOPAY VSAM cluster where positions 217–218 have a binary
    value between X'0064' and X'00C7', i.e., Transitional UI Pay values of 100–199).
    The VSAMPAY output from DXCBO98B feeds into downstream mailing/check-generation
    processing in the remaining job steps.\nZUMDA2R1.txt\nZUMDA2R1.md\n\nWhat would
    you like to explore next?\n\nWalk me through the entire ZUMDA2R1 job flow\n\n\
    Show me the complete field mapping with positions\n\nTrace the downstream consumers
    of the VSAMPAY output"
- id: v5-Q3
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe knowledge base
    has no transaction by the name LOJ4S200, and I need to flag a structural issue
    with that identifier before we go further.\n\nCICS Transaction ID Length Issue\n\
    \nStandard CICS transaction IDs are 1–4 characters long. LOJ4S200 is 8 characters,
    which means it cannot be a valid CICS transaction ID. The engineer's note may
    be conflating two different identifiers — possibly a 4-character transaction ID
    and a screen/conversation code. Here are some possibilities to check:\n\nLOJ4
    as the transaction + S200 as something else (a screen number, a segment identifier,
    or a conversation type)?\nThe documented LOOPS CICS transaction IDs in the knowledge
    base include LO4W (Online Payment), LO21 (Voice Payment), LODK, LODQ, and LODR
    (web-based inquiries) — none of which is LOJ4.\nThe conversation ID A200 is documented
    as an Inquiry type, classified as read-only. It's possible someone wrote \"S200\"\
    \ when they meant \"A200.\"\nWhat Is Documented for \"Stimulus\"\n\nThe word \"\
    stimulus\" in the knowledge base refers exclusively to batch mailroom processing,
    not a CICS inquiry transaction :\nDXCB116E.md\nL2DFACLT.md\n\nJob L2DFACLT filters
    journal records for transaction types C010/C030/C060, transforms them into 500-byte
    Stimulus records via program DXCB116E, sorts them, and consolidates via program
    DXCBO29E to produce a STIMULUS GDG output file.\nL2DFACLT.md\nL2DFACLT.md\nThese
    are batch programs, not online CICS screens.\nRecommendations\n\nI cannot confirm
    or describe what LOJ4S200 is or which program handles it — the knowledge base
    has no process, program, screen, or transaction by that name. Before I can help
    further:\n\nCheck the runbook for a typo — could the transaction be LO4W (4 chars,
    Online Payment) and the screen/conversation A200 (Inquiry)?\nIf the intent is
    truly stimulus payment inquiry, the batch job L2DFACLT and its programs (DXCB116E,
    DXCBO29E) are the documented stimulus artifacts — but they're batch, not online
    inquiry.\nThe CSD (CICS System Definition) file — which would map transaction
    IDs to programs — is noted as missing from the knowledge base , so even valid
    transaction-to-program mappings cannot be confirmed from the held source.\ncode_issues_20260...\n\
    Would you like to explore one of these angles further?\n\nCheck LO4W or A200 conversation
    details\n\nReview the batch stimulus processing (L2DFACLT)\n\nLet me verify the
    name in our runbook first"
- id: v5-Q4
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nGreat question —
    this is well-documented in the knowledge base and the answer has an important
    nuance. Here's the full picture:\n\nShort Answer: Derived by Construction, Not
    Enforced at Runtime\n\nThe overview document (00_ca7_daily_overview.md) states
    this directly :\n00_ca7_daily_over...\n\n\"In the held daily programs, the Saturday
    week-ending date (CWE) is produced by construction, not validated at runtime.\"\
    \n\nIn other words: every program that produces a CWE date computes it so it always
    lands on a Saturday — but in the documented programs, no active runtime guard
    rejects a non-Saturday value if one somehow got in.\n\nPrograms That Derive Saturday
    by Construction\n\nHere are the documented mechanisms, each of which you can point
    to:\n\nTable\n\nProgram\n\n\t\n\nMechanism\n\n\t\n\nSource\n\n\nUIMB0018\tUses
    DAYS-TO-PREV-SATURDAY-VALUES day-of-week offset tables to snap any date to the
    prior Saturday\t\nDXCBDSUP\tCalls F6ADDF6 to get DOWSUB (1=Sun … 7=Sat), then
    applies a SUBTRAHEND/ADDVALUE table to step back to the preceding Saturday from
    a Julian day number\t\nDXCBDA2R\tParagraph 1300-GET-PREV-WEEKEND-DATE computes
    the previous weekend date using month-length addends\t\nUIMB0248 / UIMI0248\t\
    Computes REM(INTEGER-OF-DATE, 7) — only triggers weekly report when result = 6
    (Saturday); non-Saturday dates silently skip the weekly report path\t\nUIMI0443\t
    Derives the certification week FROM date by subtracting 6 days from the CWE TO
    date — implicitly assumes CWE is Saturday, producing a Sunday start\t\nQCREC3E\t
    Computes expected CWE by adding 6 days to claim date (Sunday) → Saturday\t\nDXCBD65R\t
    Adds day-of-week offsets to advance to the next Saturday; special policy rule:
    if base year begin date itself falls on Saturday (DOWSUB=7), it advances 7 days
    to the following Saturday rather than using the same day\t\nView more\nThe Commented-Out
    Guard\n\nThe closest thing to a runtime enforcement check was in UIMB0248. The
    BRE analysis describes a \"confirm the week-ending date is a Saturday\" validation
    rule, but the overview document explicitly notes :\n00_ca7_daily_over...\n\n\"\
    the corresponding guard in UIMB0248 source (IF WS-WEEKDAY NOT = 'SATURDAY' ...,
    lines 014650–014670) is commented out.\"\n\nThis means the validation exists in
    the source code but is inactive. UIMB0248 simply branches on the Saturday path
    and silently does nothing for non-Saturday inputs — it doesn't reject them.\n\n\
    What You Can Point An Engineer To\nFor the clearest derivation logic: DXCBDSUP
    — its CERT-SCHEDULE-CHECK paragraph has a full DOWSUB → SUBTRAHEND/ADDVALUE table
    that walks any payment date back to the preceding Saturday, with Julian-day arithmetic
    and leap-year handling.\nDXCBDSUP.md\nDXCBDSUP.md\nFor the \"why no guard?\" context:
    00_ca7_daily_overview.md and the UIMB0248 source — the guard existed but was commented
    out.\n00_ca7_daily_over...\nFor the policy rule: DXCBD65R — explicitly labeled
    as a Policy Rules entry: \"Saturday is Never Used as the Same-Day Week Ending
    Date\".\nDXCBD65R.md\nCoverage Caveat\n\nThis answer is bounded by the programs
    in the knowledge base. Programs, jobs, or streams outside the held slice (e.g.,
    CICS online screens, IVR capture, or money-movement processes) may handle it differently,
    so a universal \"Saturday is always enforced system-wide\" claim cannot be confirmed
    from the knowledge base alone. Within the documented batch programs, Saturday
    is derived by construction in every case, but not validated at runtime in any.\n\
    \nWould you like to explore any of these further?\n\nDeep dive into DXCBDSUP's
    CERT-SCHEDULE-CHECK\n\nExamine UIMB0248's Saturday logic\n\nDXCBD65R base-year
    Saturday policy"
- id: v5-Q5
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe knowledge base
    has limited coverage of the specific \"yearly SOIL on-request control-card run\"\
    \ you're asking about. Here's what is documented and what isn't:\n\nWhat the Knowledge
    Base Says\n\nThe terminology glossary (06_terminology_glossary.md) describes SOIL
    as, among other things, a \"yearly on-request control-card run\".\n06_terminology_gl...\n\
    \ The key phrase is on-request — this indicates it is not on a fixed automated
    CA-7 schedule but is instead manually initiated (DEMANDed) by operations when
    the yearly cycle calls for it. The glossary does not document a specific calendar
    date or schedule trigger.\n\nWhat the B040 Control Card Looks Like\n\nThe B040-DATE-CONTROL-CARD
    structure (from VERFYUI2.cbl.csv) includes annual-period fields that would need
    to be updated for a yearly run :\nVERFYUI2.cbl.csv\nVERFYUI2.cbl.csv\n\nB040-ANNUAL-BEGIN-DATE
    — 9(8), position 49, \"Annual beginning date for yearly processing\"\nB040-ANNUAL-ENDING-DATE
    — 9(8), position 57, \"Annual ending date for yearly processing\"\n\nEvery SOIL
    batch program (DXCRR05E, DXCRR78E, etc.) reads this control card from SYSIN at
    initialization and loads all date fields — daily, weekly, monthly, quarterly,
    and annual — into working storage.\nUIMB0059.md\nUIMI0061.md\nDXCBD134.md\n\n\
    What the Daily SOIL Jobs Document (for Reference)\n\nThe documented daily SOIL
    jobs (ZLPD02U0–ZLPD02U9 for adjustment/balance processing, ZLPD09U0–ZLPD09U9 for
    balance reconciliation) follow a clear prerequisite pattern before execution :\n\
    ZLPD02U0.md\nZLPD02U2.md\nZLPD02U3.md\n\nIDCAMS VERIFY (mandatory, unconditional
    first gate) — verifies three VSAM files: the IMS database data component (e.g.,
    LOPD0002), the index component (LOPX0002), and the business codes reference table
    (VSAM.CODES.CLUSTER), using the VERIFY03 control card from the production control
    library\nAll three must return RC=0 or all downstream SOIL processing is blocked\n\
    IMS databases must be locked with exclusive access; CODES can be shared\nThe DATECARD
    control card with correct date values must be supplied via SYSIN\nWhat Is NOT
    in the Knowledge Base\n\nThe knowledge base does not document:\n\nWhen exactly
    the yearly on-request SOIL run is triggered (e.g., calendar year-end, state fiscal
    year-end, or at Treasury's request)\nThe specific job name or job stream for the
    yearly run (as distinct from the daily ZLPD02U* / ZLPD09U* jobs)\nThe operator
    procedure for preparing and submitting the yearly run — specifically, how the
    B040-ANNUAL-BEGIN-DATE and B040-ANNUAL-ENDING-DATE values are set and who approves
    them\nWhether the yearly run uses the same DXCRR05E/DXCRR78E programs with different
    date-card parameters, or a different program entirely\n\nThese details live in
    the operations runbook and the CA-7 DEMAND procedures, which are outside the held
    documentation.\n\nRecommendation\n\nThis is an area where you'd need to consult
    with the operations team or scheduling SME who manages the CA-7 DEMAND queue and
    the DATECARD maintenance procedures. The pattern for the daily SOIL jobs (VSAM
    VERIFY → exclusive IMS lock → DATECARD via SYSIN → DXCRR05E/DXCRR78E execution)
    is well-documented and likely applies to the yearly run as well, but confirming
    that — and the timing and operator checklist — requires the ops runbook.\n\nWould
    you like to explore a related SOIL topic?\n\nDaily SOIL job flow step-by-step\n\
    \nB040 control card structure detail\n\nDXCRR05E program logic deep dive"
- id: v5-Q6
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nI have all the source-level
    detail I need from NOPAYADD.txt and NOPAYADD.md in the Daily CA-7 space. Let me
    synthesize a comprehensive test suite grounded in the actual program constants
    and logic.\n\nProvenance note: Every constant, field name, field size, delimiter,
    88-level value, and paragraph name below is copied from the retrieved NOPAYADD.txt
    source code (COBOL source, LIBRMASTRALL / CA-7 daily schedule slice). The test
    case expected results are derived from the source logic — specifically from paragraphs
    1100-PROCESS-ADDRESS, 1000-MAIN-PROCESSING, 200-HSKG, 9000-READ, and 300-WRAP-UP
    — and should be confirmed against actual program execution before being treated
    as an acceptance baseline. All sample data is synthetic.\n\nNOPAYADD Test Suite
    — Record Handling\n\nNOPAYADD Test Suite — Record Handling\n\nProgram: NOPAYADD
    (COBOL II Batch, LIBRMASTRALL) Purpose: Reformat the combined address field in
    NOPAY records (splitting at / delimiter) and write reformatted records to the
    output file before the FINALIST process. Sources: NOPAYADD.txt (source), NOPAYADD.md
    (business rules) — Daily CA-7 space Provenance: Expected outputs are derived from
    source paragraphs (1100-PROCESS-ADDRESS, 1000-MAIN-PROCESSING, 300-WRAP-UP). Confirm
    against actual execution.\n\nKey Constants & Field Sizes (from WORKING-STORAGE
    and FD)\n\nItem\n\n\t\n\nSource Definition\n\n\t\n\nNotes\n\n\nHOLD-STREET\tPIC
    X(30)\tMax street length; part of AREA1\nHOLD-CITY\tPIC X(15)\tMax city length;
    part of AREA1\nADDR-LINE1\tPIC X(30)\tOutput address line 1 (street)\nADDR-LINE2\t
    PIC X(30)\tOutput address line 2 (city/state/zip)\nTWO-SPACES\tPIC XX\tSTRING
    delimiter for city trimming\nONE-SPACE\tPIC X\tSTRING delimiter for state trimming;
    also inserted as separator\nNOPAYIN-ADDRESS-SEG01-FORMAT\tPIC X(44)\tCombined
    input address field\nNOPAYIN-STATE\tPIC XX\t2-char state code\nNOPAYIN-ZIP-FIRST-FIVE\t
    PIC 9(5)\tFirst 5 digits of ZIP; part of NOPAYIN-ZIP-PLUS-FOUR\nNOPAYIN-ZIP-LAST-FOUR\t
    PIC 9(4)\tZIP+4 portion — excluded from output\nRECS-WRITTEN\tPIC 9(7) VALUE ZERO\t
    Records-written counter; max 9,999,999\nEND-FLAG / END-OF-FILE\tPIC X / 88-level
    VALUE 'Y'\tEOF sentinel\nNOPAYIN-RECORD-TYPE 88-levels\t'1'=100% offset; '2'=pended
    week; '3'=other payment; '4'=current CWE change; '5'=UI claim is BYE; '6'=WW credit\t
    Not used by NOPAYADD logic, but present in the record\nRECORDING MODE\tF (fixed-length)
    on both FDs\tRecord length: 281 bytes (post-Y2K)\nLow-value cleansing\tINSPECT
    ADDR-LINE1 REPLACING ALL LOW-VALUES BY SPACES (same for LINE2)\tAdded by R. Blumenfeld,
    July 2009\nSummary messages\t'RESULTS OF NOPAYADD EXECUTION FOLLOWS;', 'THE #
    OF RECORDS PROCESSED WAS ', 'END OF REPORT////////////////////////'\tExact strings
    from 300-WRAP-UP\nTC-01: Happy Path — Standard Address with / Delimiter\n\nObjective:
    Verify normal address splitting, city/state/ZIP formatting, and record count.\n\
    \nInput (NOPAYIN-FILE — 1 record):\n\nField\n\n\t\n\nValue\n\n\nNOPAYIN-ADDRESS-SEG01-FORMAT\t\
    '123 MAIN ST/NEWARK ' (44 chars, padded)\nNOPAYIN-STATE\t'NJ'\nNOPAYIN-ZIP-FIRST-FIVE\t\
    07102\nNOPAYIN-ZIP-LAST-FOUR\t1234\nNOPAYIN-RECORD-TYPE\t'1' (ONE-HUNDRED-PERCENT-OFFSET)\n\
    All other fields\tValid synthetic values\n\nExpected Output (NOPAYOUT-FILE — 1
    record):\n\nField\n\n\t\n\nExpected Value\n\n\t\n\nDerivation\n\n\nADDR-LINE1\t\
    '123 MAIN ST ' (30 chars)\tUNSTRING extracts left of / → HOLD-STREET → ADDR-LINE1\n\
    ADDR-LINE2\t'NEWARK NJ 07102 ' (30 chars)\tSTRING: HOLD-CITY delimited by TWO-SPACES
    + ONE-SPACE by SIZE + NOPAYIN-STATE delimited by ONE-SPACE + ONE-SPACE by SIZE
    + NOPAYIN-ZIP-FIRST-FIVE + ONE-SPACE by SIZE\nAll non-address fields\tIdentical
    to input\tMOVE NOPAYIN-RECORD TO NOPAYOUT-RECORD preserves all before reformatting\n\
    \nExpected SYSOUT (from 300-WRAP-UP):\n\n*************************************\n\
    RESULTS OF NOPAYADD EXECUTION FOLLOWS;\n*************************************\n\
    THE # OF RECORDS PROCESSED WAS 0000001\n*************************************\n\
    END OF REPORT////////////////////////\n\nTC-02: Empty Input File\n\nObjective:
    Verify the program handles an empty NOPAYIN-FILE — no records written, counter
    stays at zero, summary still displays.\n\nInput: 0 records in NOPAYIN-FILE.\n\n\
    Expected:\n\nNOPAYOUT-FILE contains 0 records\nEND-FLAG set to 'Y' on the priming
    read in 200-HSKG; 1000-MAIN-PROCESSING loop is never entered\nSYSOUT shows RECS-WRITTEN
    = 0000000\nTHE # OF RECORDS PROCESSED WAS 0000000\n\nTC-03: No / Delimiter in
    Address Field\n\nObjective: Exercise the UNSTRING fallback — when NOPAYIN-ADDRESS-SEG01-FORMAT
    has no /, the entire 44-char field goes into HOLD-STREET (truncated to 30 chars)
    and HOLD-CITY stays at its initialized value (spaces, from INITIALIZE AREA1).\n\
    \nInput:\n\nField\n\n\t\n\nValue\n\n\nNOPAYIN-ADDRESS-SEG01-FORMAT\t'456 ELM AVENUE
    APT 2B SUITE 100XTRA' (44 chars, no /)\nNOPAYIN-STATE\t'NY'\nNOPAYIN-ZIP-FIRST-FIVE\t\
    10001\n\nExpected:\n\nField\n\n\t\n\nExpected Value\n\n\t\n\nRationale\n\n\nADDR-LINE1\t\
    '456 ELM AVENUE APT 2B SUITE 10' (30 chars — truncated)\tUNSTRING puts first 30
    chars into HOLD-STREET (PIC X(30)); chars 31–44 are lost\nADDR-LINE2\t'NY 10001
    ' (30 chars)\tHOLD-CITY is all spaces after INITIALIZE AREA1; STRING starts with
    city delimited by TWO-SPACES (immediate hit — produces nothing), then ONE-SPACE,
    then state, ONE-SPACE, ZIP, ONE-SPACE. Note: Because HOLD-CITY is all spaces,
    the first double-space hit is at position 1 — zero city bytes are emitted. Result
    starts with the first ONE-SPACE, then NY, then space, then 10001, then space\n\
    \n⚠ Edge-case alert: The exact behavior of STRING … HOLD-CITY DELIMITED BY TWO-SPACES
    when HOLD-CITY is all spaces depends on whether the COBOL runtime finds the delimiter
    at position 1 (emitting zero bytes) or at position 2 (emitting one space). Verify
    against actual execution.\n\nTC-04: Address Field Contains Embedded LOW-VALUES
