  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nMunicipality
    (MUNC) code validation in LOOPS is a multi-layered process that spans CICS online
    programs, a VSAM reference file, a DB2 FIPS reference table, and batch reporting.
    The answer below is synthesized from multiple source programs across the CICS
    and Daily CA-7 knowledge spaces.\n\nReference Data Sources for Municipality Codes\n\
    \nTwo primary reference stores are documented:\n\nMUNICIPA — VSAM KSDS file: Keyed
    by local municipality name + tax code. Contains UI code, health code, county,
    FIPS codes, SDA code, local office, and more. Maintained via CICS transactions
    MUNC (browse-only) and MUNX (full maintenance).\nBOBMUNCZ-cbl.html\nDXAMUNCP-cbl.json\n\
    WDPV_E_FIPS_DESCRP — DB2 table: The FIPS Description reference table, holding
    city name, local office, municipality code, FIPS state/county/city codes. Used
    for automated geographic code resolution during claim address processing.\nDXCC116S-cbl.json\n\
    LOH3C015-cbl.json\nOnline Validation: NJ Addresses\n\nFor New Jersey addresses,
    the system attempts to resolve the municipality code automatically when a claimant's
    address is entered or changed. Two documented approaches exist in different programs:\n\
    \nProgram DXCC116S (conversations C015/C016) uses a cascading FIPS lookup :\n\
    DXCC116S-cbl.json\nLOH3C015-cbl.json\n\nCity + Local Office — Search WDPV_E_FIPS_DESCRP
    by city name and claimant's local office.\nRefine with Municipality Code — If
    multiple matches are found (SQLCODE -811), re-search adding the existing municipality
    code as a third criterion.\nCity Name Only — If still no match, search by city
    name alone (no local office filter).\nMunicipality Code Only — If the city is
    not found at all, fall back to searching by municipality code alone.\nError Handling
    — If nothing matches, error message 930 (mailing address) or 1403 (residential
    address) is displayed, and all municipality/FIPS codes are zeroed out.\n\nWhen
    a match is found, the system updates DB01-MUNIC-CODE, FIPS city, county, and state
    codes on the claimant's IMS record and the screen display.\nDXCC116S-cbl.json\n\
    \nException: For Disability Insurance claims (program code 60), FIPS/municipality
    updates are skipped entirely, preserving the existing values.\nDXCC116S-cbl.json\n\
    \nProgram DXCC120S (conversation C020) browses the MUNICIPA VSAM file directly
    :\nDXCC120S-cbl.json\n\nBrowse MUNICIPA using the city name (first 30 characters)
    as the key.\nIf the first matching record's local office matches the claimant's,
    take the municipality code, FIPS city, county, and state codes directly.\nIf the
    local office doesn't match, save the first occurrence and keep reading to find
    a better match.\nIf no match is found on the first attempt, display error code
    930; on the second attempt, zero out all codes; on the third, use the first-occurrence
    values.\n\nProgram LOH3C015 also performs an NJ city lookup against WDPV_E_FIPS_DESCRP
    by city name and claimant local office, with a similar refinement using municipality
    code if duplicates are found.\nLOH3C015-cbl.json\n\nOnline Validation: Out-of-State
    Addresses (DE, NY, PA)\n\nThere is a documented conflict between two programs
    on how out-of-state addresses are handled — this should be reviewed with an SME:\n\
    \nDXCC116S: For DE, NY, or PA addresses, a municipality code must be entered.
    If present, the system maps the state abbreviation to a FIPS state code and searches
    WDPV_E_FIPS_DESCRP by city name + state FIPS code. If no municipality code is
    entered, all codes are zeroed and the user is prompted.\nDXCC116S-cbl.json\nDXCC120S:
    For PA, NY, or DE addresses, municipality and FIPS codes are always set to zero
    — described as \"these states do not use the municipality lookup process\".\n\
    DXCC120S-cbl.json\n\n⚠️ Documented conflict: DXCC116S performs a FIPS lookup for
    DE/NY/PA when a municipality code is provided, while DXCC120S unconditionally
    zeros these codes for the same states. These are different CICS programs (different
    conversations), so they may represent different processing contexts, but this
    discrepancy is worth confirming with an SME.\n\nMunicipality Maintenance Screens
    (MUNC / MUNX)\n\nPrograms DXAMUNCP and BOBMUNCZ (also DXAMUNC2) provide the CICS
    screens for maintaining the MUNICIPA reference file :\nBOBMUNCZ-cbl.html\nDXAMUNCP-cbl.json\n\
    DXAMUNC2-cbl.json\n\nTransaction MUNC: Browse/inquiry only.\nTransaction MUNX:
    Full maintenance (add, change, delete).\nField-level validations on the detail
    screen (documented in BOBMUNCZ, DXAMUNCP, DXAMUNC2):\nMunicipality Maintenance
    Field Validations\n\nField\n\n\t\n\nValidation Rule\n\n\t\n\nError Message\n\n\
    \nLocal Name\tMust be alphabetic\tLOCAL NAME IS NOT ALPHABETIC\nTax Code\tMust
    be numeric\tTAX CODE IS NOT NUMERIC\nFunction Code\tMust be alphabetic\tFUNCTION
    IS NOT ALPHABETIC\nIncorporated City\tMust be alphabetic\tINCORP CITY IS NOT ALPHABETIC\n\
    Health Code\tMust be numeric\tHEALTH CODE IS NOT NUMERIC\nCounty\tMust be alphabetic\t
    COUNTY IS NOT ALPHABETIC\nUI Code\tMust be numeric\tUI CODE IS NOT NUMERIC\nState
    FIPS Code\tMust be numeric\tSTATE CODE IS NOT NUMERIC\nCounty FIPS Code\tMust
    be numeric\tCOUNTY FIPS CODE IS NOT NUMERIC\nMCD FIPS Code\tMust be numeric\t\
    MCD CODE IS NOT NUMERIC\nView more\n\nAuthorization for add/change/delete is restricted:
    DXAMUNCP/DXAMUNC2 check for transaction MUNX, while BOBMUNCZ checks for terminal
    ID #008.\nBOBMUNCZ-cbl.html\nDXAMUNC2-cbl.json\n\nBatch Validation\n\nIn batch
    reporting, program DXCBW40R performs a binary search of a municipality names and
    codes reference table using the combined county/municipality number (MUNS-NO).
    Unmatched claims are written to an exception report.\nDXCBW40R.md\n\nSummary\n\
    \nThe municipality code validation in the documented programs involves:\n\nAutomated
    resolution from city name via FIPS table or MUNICIPA file during claim address
    entry\nCascading fallback searches (city + office → city + office + munc code
    → city only → munc code only)\nField-format validation on the maintenance screens
    (alphabetic/numeric checks)\nAuthorization controls on who can modify the reference
    file\nBinary table search in batch for reporting purposes\n\nThis answer draws
    from DXCC116S, DXCC120S, LOH3C015, DXAMUNCP, DXAMUNC2, BOBMUNCZ, and DXCBW40R.
    Programs or jobs outside the knowledge base may handle municipality codes differently.\n\
    \nWhat would you like to explore further?\n\nFIPS lookup cascade details\n\nMUNICIPA
    file structure and maintenance\n\nBatch municipality processing"
