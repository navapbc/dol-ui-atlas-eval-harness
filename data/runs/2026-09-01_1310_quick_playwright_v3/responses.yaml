  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe knowledge base
    documents municipality (MUNC) code handling across several programs and contexts.
    This is a synthesized summary drawn from multiple source documents.\n\nWhere MUNC
    Codes Originate\n\nThe municipality code is stored in the IMS database on the
    Basic Claim segment (Segment 01), in the field MUNIC-CODE of copybook LOOPDB01.
    When batch programs process journal records, the municipality is captured the
    first time a Segment 01 (Basic Claim) record appears for a given SSN :\nDXCBW30E.md\n\
    \nA Municipality Switch (MUNCI-SW) is set to 'Y' when a Basic Claim is processed,
    and the code is stored in MUNCI-CUR\nWhen a new SSN is detected, the switch resets
    to 'N' and the municipality defaults to zero until a Basic Claim is encountered
    for the new claimant\nAll subsequent records for the same SSN carry forward the
    municipality established from that Basic Claim\nRange Validation in Claim Type
    Classification\n\nMultiple programs — including DXCBW30E, DXCBW39E, and DXCBW39U
    — apply the same tiered validation logic in their Claim Type Classification routine
    (X200-DO-TYPECLM). The validation depends on the claim type :\nDXCBW30E.md\nDXCBW39E.md\n\
    DXCBW39E.md\n\nMUNC Code Validation By Claim Type\n\nClaim Type\n\n\t\n\nCondition\n\
    \n\t\n\nMUNC Validation\n\n\t\n\n...\n\n\nType 4 — Interstate\tProgram Code =
    11 or 12\tNo range check — MUNC passed through as-is\t...\nType 3 — Out-of-State
    / Special Office\tLocal Office = 999 or 997\tMUNC must be > 01000 AND < 77000
    (i.e., 01001–76999)\t...\nType 1 — In-State Local Municipality\tMUNC between 05500
    and 07599\tUsed as-is (already within valid range by definition)\t...\nType 2
    — All Other In-State\tDefault / catch-all\tUsed as-is\t...\nView more\n\nThe decision
    flow in the documented programs is :\nDXCBW30E.md\nDXCBW39E.md\n\nIs Program Code
    11 or 12? → Type 4 (Interstate). Use MUNC as-is. Exit.\nIs Local Office 999 or
    997? → Type 3 (Out-of-State). Validate MUNC in range 01001–76999; if out of range,
    override to 77777. Exit.\nIs MUNC between 05500 and 07599? → Type 1 (In-State
    Local). Use MUNC as-is. Exit.\nOtherwise → Type 2 (All Other). Use MUNC as-is.
    Exit.\nNumeric Validation for Internet Certification\n\nProgram DXCBD50E applies
    a separate, stricter check when building Internet certification records: the municipality
    code (MUNIC from Segment 02) must be numeric. If it is not numeric, the program
    displays a warning message with the claimant's SSN, zeros out the SSN, and skips
    the record entirely — no Internet certification record is written. The rationale
    documented in the source is that a non-numeric MUNC \"indicates a data quality
    issue that also signals a potentially invalid SSN\".\nDXCBD50E.md\n\nMunicipality
    Reference Table Lookup\n\nProgram DXCBW40R (Municipality Claims Report) goes a
    step further by searching a municipality reference table to resolve MUNC codes
    to named municipalities for reporting. It uses an optimization: if the current
    record's MUNC code (MUNS-CODE-IN) matches the previous record's (PREV-CNTY-MUNS-NO),
    it skips the table search and reuses the previously matched position (HOLD-INDEX-2).\n\
    DXCBW40R.md\nDXCBW40R.md\n\nWhat Is Not in the Knowledge Base\nThe actual populated
    values of any municipality reference table (e.g., the mapping of code 05501 to
    a specific town name). The table layouts are documented, but the values are operations-maintained
    data.\nWhether any CICS online program validates MUNC codes at the point of data
    entry — the documented validation is all in batch programs.\nWhether there is
    a master municipality code table that defines the universe of valid NJ municipality
    codes beyond the range checks described above.\nWould you like to explore further?\n\
    \nHow does the municipality reference table lookup work in DXCBW40R?\n\nHow are
    MUNC codes used in the weekly extract and reporting programs?\n\nTell me more
    about DXCBD50E's municipality and SSN validation"
