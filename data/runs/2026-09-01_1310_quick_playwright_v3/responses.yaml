- id: v3-Q1
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe knowledge base
    has no process by the exact name \"Automated Collection Process.\" However, there
    are several closely related documented collection processes that may be what you're
    looking for. Here are the closest matches:\n\n1. Accelerated Collection Process
    (ACP)\n\nThis is the closest documented match. It is implemented by program UIMI0730,
    titled \"ACCELERATED COLLECTION PROCESS\" in its source header (authored by P.
    Haughton, August 2010). It is part of the CA-7 daily LOP batch schedule.\nUIMI0730.txt\n\
    \nThe ACP's population-selection logic is documented in the companion subprogram
    UIMI0725 (UIMI0725.md). A base claim record is selected for ACP population processing
    when it has at least one active outstanding balance across any of these debt types
    :\nUIMI0725.md\n\nFederal 100% or 50% Refund Offset\nNon-Federal 100% or 50% Refund
    Offset\nExtended Benefits 100% or 50% Refund Offset\nFSC, DI, EUB, or WFD 100%
    or 50% Refund Offset\nFines Amount Balance\nInterest Amount Balance\n\nThe selection
    criteria require that the record be a base claim (Program Code = 0 and Claim Date
    = 0) and that at least one of those balances is greater than zero. Once selected,
    the full claim validation and output record creation process is initiated.\nUIMI0725.md\n\
    \nNote: The retrieved source covers the selection/population step (UIMI0725) and
    identifies UIMI0730 as the main ACP program. The full end-to-end ACP flow (upstream
    extraction, downstream actions) may involve additional programs not fully documented
    in these passages.\n\n2. DABS — Debt Collection Document Generation\n\nJob D2FND222
    invokes the DABS (Debt Automated Build System) Document Builder program JECBD53P.
    This step processes a Driver File (DRIV1F1.DTL) and generates debt collection
    correspondence and forms across 10 distinct output streams, applying date-sensitive
    business rules and code lookups from the VSAM.CODEDABS.CLUSTER table.\nD2FND222.md\n\
    \nThe job also includes a Driver File backup step with automatic discard of incomplete
    backup generations on failure.\nD2FND222.md\n\n3. Auto Garnishment Batch Processing\n\
    \nJob L2AGW2 handles Auto Garnishment batch processing. It distributes garnishment
    records across 10 parallel processing units using program DXCBW18S, reading from
    a consolidated input file (AUTOGARN) and a merged detail file, then partitioning
    them into FILE01 through FILE10.\nL2AGW2.md\n\n4. Collection of Debt (COD) Continuity\n\
    \nProgram UIMB0025 documents how Collection of Debt (COD) fields are carried forward
    when a claim is transferred. The transferred fields include COD Amount, COD Potential
    Amount, COD Minimum Exceeded Date, and the Dunning Letter Level (current level
    of collection correspondence sent to the claimant).\nUIMB0025.md\n\nCould you
    clarify which of these you're interested in? If you meant the Accelerated Collection
    Process (ACP), I can dig deeper into UIMI0730 and its full batch context.\n\n\
    Which collection process would you like to explore further?\n\nAccelerated Collection
    Process (ACP)\n\nDABS Debt Collection Document Generation\n\nAuto Garnishment
    Batch Processing\n\nCollection of Debt (COD) Continuity"
