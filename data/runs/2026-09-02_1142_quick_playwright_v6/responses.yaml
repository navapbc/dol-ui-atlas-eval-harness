  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThis is thoroughly
    documented across L2AHD13.txt (JCL), UIPBHB01.md, and UIPBHB02.md — all from the
    Daily CA-7 v2 space. Here is the synthesized end-to-end walkthrough.\n\nThe Job:
    L2AHD13 — Automated Handbook Update\n\nThis four-step job reads incoming IB13
    interstate messages that carry updated Handbook text, selects the ones addressed
    to the state's Handbook receiver, sorts them so the most recent update for each
    state+section is processed last, and then applies them to the Automated Handbook
    VSAM file (UIFLHB00). Restart criticality is 1 (highest).\nL2AHD13.txt\n\nWhy
    the Sort Order Matters\n\nThe JCL narrative states the rationale explicitly: \"\
    The file is sorted on state and section within date and time to ensure that the
    most recent updates will be processed last.\"\n\nMultiple IB13 messages can arrive
    on the same day for the same state and section — for example, a correction followed
    by a re-correction. Because the update program (UIPBHB02) processes records sequentially
    and deletes-then-writes for each record, whichever record it processes last for
    a given state+section+record-number becomes the final state of the Handbook VSAM
    entry. By sorting State → Section → Date → Time in ascending order, the pipeline
    guarantees that for any given handbook location, the chronologically latest IB13
    overwrites all earlier ones, and the Handbook file always reflects the most recent
    content.\nUIPBHB01.md\nUIPBHB02.md\n\nStep-by-Step Job Flow\nStep 1 — VFY01 (IDCAMS
    VERIFY)\n\nVerifies that the IB13 VSAM file LAK2LDXP.PROD.VSAM.INFL1300.CLUSTER
    is in a consistent state. If a prior job abended with the file open, VERIFY resets
    its catalog markers so it can be safely read and written.\nL2AHD13.txt\nL2AHD13.md\n\
    \nStep 2 — UIPBHB01 (COBOL): Select and Tag Qualifying IB13 Records\n\nProgram
    UIPBHB01 browses the IB13 VSAM file for records addressed to the state's Handbook
    receiver. For each qualifying record it:\n\nFilters — only processes records of
    type IB13I with Receiver/Sender ID = .HANDBOOK for the configured state postal
    code\nSkips already-processed — any record where IB13-BATCH-SWITCH = 'Y' is skipped
    (it was handled in a prior run)\nExtracts State and Section — examines the first
    text line of the IB13 message. If it matches the section-header pattern *****
    XXY ***** (where XX = state, Y = section), state and section come from the header.
    Otherwise, they come from fixed key-level positions in the first line\nBuilds
    a sort key — prepends each record with a composite key:\nUIPBHB01 Sort Key Layout\n\
    \nPosition\n\n\t\n\nLength\n\n\t\n\nContent\n\n\t\n\n...\n\n\n1–3\t3\tState +
    Section (XXY)\t...\n4–10\t7\tCentury (2) + Julian Year (2) + Julian Day (3)\t\
    ...\n11–16\t6\tCreation Time\t...\n17–4785\t4769\tFull IB13 message record (payload)\t\
    ...\nView more\n\nThe Gregorian creation date is converted to Julian via the 8000-GREG-CONVERT
    routine, and century is determined by a Y2K pivot (year < 50 → '20', else '19').\n\
    UIPBHB01.md\n\nWrites the 4,785-byte record to temporary file &&TEMP\nStep 3 —
    SORT01 (DFSORT)\n\nSorts &&TEMP into &&SORTED with this SORT card:\n\nSORT FIELDS=(1,3,A,4,7,A,11,6,A),FORMAT=CH\n\
    \n\nThis means: ascending on positions 1–3 (State+Section), then 4–10 (Century+Julian
    date), then 11–16 (Time). The effect is that for any given State+Section, the
    oldest IB13 is first and the newest is last.\n\nNote: the JCL also contains a
    commented-out prior SORT card (4,7,A,11,6,A,1,3,A) — the current production version
    sorts State+Section first.\nL2AHD13.txt\n\nStep 4 — UIPBHB02 (COBOL): Apply Updates
    to the Handbook VSAM\n\nThis is the core update program. It opens four files in
    I-O mode:\n\nUIPBHB02 File Access\n\nDD Name\n\n\t\n\nDataset\n\n\t\n\nMode\n\n\
    \t\n\n...\n\n\nINFLTEMP\t&&SORTED\tInput\t...\nUIFLHB00\tLAK2LDXP.PROD.VSAM.UIFLHB00.CLUSTER\t\
    I-O\t...\nUIFLHB01\tLAK2LDXP.PROD.VSAM.UIFLHB01.CLUSTER\tI-O\t...\nINFL1300\t\
    LAK2LDXP.PROD.VSAM.INFL1300.CLUSTER\tI-O\t...\nView more\n\nFor each sorted record,
    UIPBHB02 does the following:\n\nWhat UIPBHB02 Does with Each Record\n\n1. Map
    to IB13 layout — Strips the sort key prefix and loads the IB13 message payload
    into working storage. Resets the line counter to 1.\n\n2. Detect record type —
    Examines the first text line:\n\nIf it matches ***** XXY ***** → this is a new
    section header (a section boundary)\nOtherwise → this is a continuation record
    for the current section\n\n3. Handle section boundaries:\n\nFirst section header
    ever: Save the IB13 key, copy the header line into the Handbook record buffer,
    turn off the first-time indicator, advance the line counter\nSubsequent section
    header: The previously assembled Handbook record is complete → set its HB-NEXT-RECORD-SWITCH
    = 'N' (no continuation) and write it to the Handbook VSAM file. Then begin the
    new section\nContinuation record: The current Handbook record has more data coming
    → set HB-NEXT-RECORD-SWITCH = 'Y' and write the current segment to the Handbook
    VSAM file\n\n4. Extract the Handbook VSAM key — The key line is the 2nd text line
    for new sections or the 1st line for continuations. The key is a 5-character composite
    XXYZZ (State XX + Section Y + Record Number ZZ)\n\n5. Delete-then-replace the
    Handbook record:\n\nDELETE the existing record with that key from UIFLHB00. Status
    23 (not found) is acceptable — the IB13 may be adding a brand-new section\nDELETE
    the corresponding Handbook In Progress (HIP) record from UIFLHB01 with the same
    key — this cleans up any pending-update tracking. Not-found is acceptable here
    too\n\n6. Initialize the new Handbook record:\n\nClear HB-LAST-EXPORT-DATE to
    zeroes (not yet exported)\nSet HB-LAST-UPDATE-DATE to today's date (formatted
    via the FAPCONF2 conversion routine)\nDefault HB-NEXT-RECORD-SWITCH = 'N'\n\n\
    7. Copy IB13 text lines — Iteratively copy each remaining IB13 text line into
    the Handbook record buffer. The line position is offset by −1 to account for the
    key line that was consumed but not written as content\n\n8. Write the assembled
    Handbook record to UIFLHB00 with the line count. Display 'HANDBOOK VSAM RECORD
    UPDATED - ' + key\n\n9. Mark the source IB13 record as processed:\n\nRe-read the
    IB13 record from INFL1300 using the saved key\nSet IB13-READ-SWITCH = 'Y' and
    IB13-BATCH-SWITCH = 'Y'\nStamp it with today's date in Julian format (century
    + year + day-of-year)\nRewrite it — this permanently flags it so the downstream
    IB13 batch purge program will delete it on its next run, and UIPBHB01 will skip
    it on its next run\n\n10. Re-read the current IB13 record using the saved \"next\"\
    \ key to restore working context for the next iteration\n\n11. At end-of-file:
    If any records were processed, write the final pending Handbook record with NEXT-RECORD-SWITCH
    = 'N'\n\nSummary: Why the Sort Guarantees Correctness\nSort Order And Its Effect
    On Processing\n\nSort Component\n\n\t\n\nPosition\n\n\t\n\nEffect\n\n\nState +
    Section (primary)\t1–3\tGroups all updates for the same handbook location together\n\
    Century + Julian Date (secondary)\t4–10\tWithin a location, orders by date oldest-first\n\
    Creation Time (tertiary)\t11–16\tWithin the same date, orders by time oldest-first\n\
    Combined effect\t—\tFor each XXYZZ key, the last record UIPBHB02 processes is
    the most recent. Since it deletes-then-writes, the final Handbook VSAM entry always
    holds the latest content\nView more\nCaveat\n\nThis describes the three programs
    documented in the knowledge base: UIPBHB01, UIPBHB02, and the L2AHD13 JCL. The
    IB13 inter-state messaging system that produces the incoming IB13 records, and
    the downstream IB13 batch purge program that deletes processed records, are referenced
    but their source is not in the held knowledge base. The FAPCONF2 date conversion
    routine called by UIPBHB02 is also referenced by name only — its source was not
    retrieved."
- id: v6-Q7
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThe employer
    daily charge report is not a single job but a three-job pipeline: L204DF1 → L205DJ
    → L206DL. Here's the full end-to-end walkthrough, synthesized from multiple source
    documents.\n\nWhere the Charge Data Originates — L204DF1\n\nPrograms DXCBD40E
    (check payments) and DXCBD50E (direct deposits) process the day's UI payment transactions
    and produce — among many other outputs — the Daily Charge detail file LAK2LDXP.L204DF.DLCHARGE.DTL
    as a GDG. This file contains 223-byte employer charge segment records for every
    payment processed that day.\nL204DF1.md\n\nStep 1: Extraction and Classification
    — Job L205DJ\n\nThis is the core employer charge extraction job. Its narrative
    states: \"This job reads the daily EMP charge segments and extracts records for
    files CHGRPT, FEDRPT, B187REV, SLCTCWC and UC53.\" It has six steps :\nL205DJ.txt\n\
    L205DJ.md\n\nWhich records make it onto the report?\n\nStep DXCBD90E — reads the
    GDG charge file, filters out non-chargeable employers (based on void flags 6,
    7, or 8, non-charge FEINs, and affidavit-flagged records), writes those to NONCHARG.DTL,
    and passes all records forward.\nDXCBD90E.md\n\nStep SYNCSRT1 — sorts the charge
    file with:\n\nSORT FIELDS=(1,5,PD,A,6,2,PD,A,8,4,BI,A)\n\n\nThis arranges records
    by employer account/period (positions 1–5), then charge type/classification (positions
    6–7), then sequence/amount (positions 8–11).\nL205DJ.txt\nL205DJ.md\n\nStep DXCBD43E
    — the main classification program. It reads each sorted record from LOOPCD04 and
    applies four application modules. The critical filtering rule: only Segment 4
    records (the charge segment) are eligible for charge and penalty accumulation.
    Records from other segments bypass charge totals entirely.\nDXCBD43E.md\n\nFor
    each qualifying Segment 4 record, DXCBD43E:\n\nValidates the program code and
    transaction code against the CODES reference table\nLooks up the employer address
    from EMPEXADD VSAM\nSeparates charge amounts by void status (EC-VOID-FLAG = '0'
    → non-voided; any other value → voided) and accumulates input/output running totals
    for both charges (AMT-EMP-CHARGE) and penalties (EMPLOYER-PENALTY-CHARGE)\nCategorizes
    each charge by employer type: UI, UCFE, UCX, General Fund, EUB, WFD, TUC, TUCX,
    FSC, etc.\nWrites a 54-byte summary record to the CHGRPT.DTL file for each charge
    category\nThe CHGRPT Record Layout\nCHGRPT Record Layout (54 Bytes)\n\nPosition\n\
    \n\t\n\nLength\n\n\t\n\nFormat\n\n\t\n\n...\n\n\n1\t2\tNumeric\t...\n3\t24\tAlpha\t\
    ...\n27\t3\tPacked\t...\n30\t6\tPacked (2 dec)\t...\n36\t3\tPacked\t...\n39\t\
    6\tPacked (2 dec)\t...\n45\t6\tPacked (2 dec)\t...\n51\t4\tPacked\t...\nView more\n\
    \nThis layout comes directly from DXEBD44R.txt\nDXEBD44R.txt\n.\n\nStep 2: The
    Printed Report — Job L206DL\n\nJob L206DL is the final reporting job. Its JCL
    narrative states: \"Daily Job Employer Charge Control Report and EB Employer Charge
    Report.\" Restart criticality is 1 (highest).\nL206DL.txt\nL206DL.txt\n\nStep
    DXEBD44R (Easytrieve)\n\nThis program reads the CHGRPT.DTL produced by DXCBD43E,
    sorts it by CHGTYPE, then dispatches each record to the appropriate sub-report
    based on its charge type number :\nDXEBD44R.txt\n\nHow the Report Is Organized\n\
    \nDXEBD44R produces at least six separate printed sub-reports, each covering a
    range of charge types :\nDXEBD44R.txt\n\nDXEBD44R Report Sub-Reports By Charge
    Type\n\nReport\n\n\t\n\nTitle\n\n\t\n\nCharge Types Included\n\n\t\n\n...\n\n\n\
    RPT1\tDaily Employer Charge Control Report (No EB)\t1–10 (with non-blank description)\t\
    ...\nRPT2\tDaily Extended Benefits Charge Control Report\t11–12\t...\nRPT3\tDaily
    Control Report — Conversion Employer\t13\t...\nRPT4\tDaily E.U.B. Charge Control
    Report\t14–17\t...\nRPT5\t(FSC / TUC-related)\t18–24, 29–42\t...\nRPT6\tNon-Charge
    Types Report\t25–28\t...\nView more\n\nEach sub-report has the same column structure
    :\nDXEBD44R.txt\n\nReport Column Layout\n\nEach sub-report prints a standard header
    block:\n\nPREPARED [SYSDATE] AT DOL DATA CENTER    NEW JERSEY DEPARTMENT OF LABOR\n\
    LOCAL OFFICE 999                          DIVISION OF UI DI          REPORT NO\
    \  DXEBD44R-RPT-001\n                    DAILY EMPLOYER CHARGE CONTROL REPORT
    (NO EB)\n                                     AS OF [DAILY-DATE]\n\n         \
    \    FUND        DEBIT    DEBIT      CREDIT   CREDIT    NET AMOUNT OF   TOTAL
    REC\n                          CNT     DOLLARS      CNT    DOLLARS      DOLLARS\
    \         CNT\n\n\nFor each charge type that has records, one detail line is printed
    showing:\n\nFund (the CHGDESCRP description)\nDebit Count and Debit Dollars\n\
    Credit Count and Credit Dollars\nNet Amount of Dollars (NETDOL)\nTotal Record
    Count\n\nAt the end of each sub-report, a Totals line is printed summing all categories
    within that report.\n\nNet Dollar Accumulation for Reconciliation\n\nIn addition
    to printing, DXEBD44R saves the NETDOL value from each charge type into a working
    storage variable (e.g., WL1 for type 1, WL2 for type 2, etc.) and also reads from
    the RECONCIL VSAM file. This allows the charge control totals to be cross-referenced
    against the reconciliation file.\nDXEBD44R.txt\n\nStep DXEBD49R\n\nThe second
    step processes the CETA Employee detail file (CETAEMP.DTL) also produced by DXCBD43E.\n\
    L206DL.txt\nL206DL.txt\n This is a separate EB Employer Charge Report.\n\nCaveat\n\
    \nThis describes the pipeline as documented across L204DF1.md, L205DJ.txt/L205DJ.md,
    DXCBD90E.md, DXCBD43E.md, L206DL.txt/L206DL.md, and DXEBD44R.txt. The intermediate
    upstream programs DXCBD40E and DXCBD50E also produce their own Reports 1A–1J (the
    individual \"LOOPS Daily Employer Charge Report\" for Intrastate, Interstate,
    UCFE 100%, NJ UCFE, etc.) as part of L204DF1 payment processing — those are a
    parallel set of employer charge reports embedded in the check register job, not
    the dedicated charge control reports produced by L206DL.\nDXCBD40E.md\nDXCBD50E.md\n\
    \nWhat would you like to explore next?\n\nCharge type classification logic in
    DXCBD43E\n\nThe inline employer charge reports from the payment processing job\n\
    \nDownstream processing of the other L205DJ output files"
