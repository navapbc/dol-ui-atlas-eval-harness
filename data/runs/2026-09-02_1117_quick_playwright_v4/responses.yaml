  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nHere is what
    the knowledge base documents about these two DB2 tables and the batch jobs that
    touch them. Important caveats up front:\n\nThe knowledge base has no process by
    the names \"SG01 pipeline\" or \"new-hire crossmatch.\" Those appear to be names
    from your replacement-system spec. I've mapped them to the nearest documented
    DB2 objects below, but please confirm with an SME that the spec is indeed referring
    to these tables.\nThe field inventories below are synthesized from SQL in JCL
    and from CICS program business rules across multiple documents — they represent
    fields that appear in documented code, not necessarily the full DDL.\nOTDUIMP.UIMT_SG01_CLAIMANT
    — the Claimant Table\n\nThis is the master claim-level table for UI benefits.
    It is keyed on the composite (SG01_IDN_SSN, SG01_CDE_PROGRAM_UIB, SG01_DTE_CLAIM_UIB)
    — SSN + program code + claim date.\nL2PUA003.txt\nNAVAWAGE-cbl.json\nUMODPMTS-cbl.json\n\
    \nDocumented columns (synthesized from L2PUA003.txt, NAVAWAGE-cbl.json, UMODPMTS-cbl.json,
    UMODWAGE-cbl.json):\n\nUIMT_SG01_CLAIMANT — Documented Columns\n\nColumn\n\n\t\
    \n\nDescription\n\n\t\n\nSource\n\n\nSG01_IDN_SSN\tClaimant SSN (PK)\tL2PUA003,
    NAVAWAGE, UMODWAGE\nSG01_CDE_PROGRAM_UIB\tUI Benefit Program Code (PK)\tL2PUA003,
    NAVAWAGE\nSG01_DTE_CLAIM_UIB\tUI Benefit Claim Date (PK)\tL2PUA003, NAVAWAGE\n\
    SG01_DATE_BEGIN_BASE\tBase Period Begin Date\tNAVAWAGE, UMODWAGE, UMODPMTS\nSG01_DATE_END_BASE\t
    Base Period End Date\tNAVAWAGE, UMODWAGE, UMODPMTS\nSG01_BEN_YEAR_END\tBenefit
    Year End Date\tUMODPMTS\nSG01_BAL_CLAIM_REM\tRemaining Claim Balance\tUMODPMTS,
