  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThis is a rich
    topic — the knowledge base documents local offices from multiple angles: the claim
    record, CICS authorization, batch classification, and the municipality relationship
    tables. Let me synthesize everything.\n\nLocal Office on the Claim Record\n\n\
    The primary representation is the field DB01-LOCAL-OFF on the IMS basic claim
    segment (DB01 / LOOPLE01). This is the local unemployment office that \"owns\"\
    \ the claim. It is set at claim registration time and persists on the record.
    A large number of programs read it :\nLO99SBLD-cbl.json\nDXCC072S-cbl.json\nMACROLST-cbl.json\n\
    DXCR032S-cbl.json\nLOAASBLD-cbl.json\nLOH3C015-cbl.json\nLOFQSBLD-cbl.json\nSARN114S-cbl.json\n\
    LOV1C326-cbl.json\nUIMI0031.md\n\nLO99SBLD — extracts it into T176-LOCAL-OFFICE
    and SPLIT-LO for numeric/range validation during certification eligibility\nLOAASBLD
    — copies it into APL-LOCAL-OFFICE and TXT-LOCAL-OFFICE-NUMBER for routing, remarks,
    and adjudication\nLOFQSBLD — passes it through to the web inquiry response buffer
    (W03-LOCAL-OFFICE-CODE)\nMACROLST, LOH3C015 — writes it to the DB2 UIMV_CLAIMANT
    table's CDE_LOCAL_OFFICE field, so the office that originally filed the claim
    is permanently recorded\nUIMI0031 — stamps it onto payment records as both PR02-LOCAL-OFF-CUR
    and PR02-RESP-LOCAL-OFF-CUR\nDXCR032S — carries it forward onto refund segments
    (SF08-REFUND-SCRN-LOCAL-OFF) and CAPS records (CAPS-LOCAL-OFFICE)\n\nThere is
    also a second local-office field on journal/segment records: Responsible Local
    Office (RESP-LOCAL-OFF-CUR / RESPLO). At claim registration (SARN114S), the segment
    prefix gets both :\nSARN114S-cbl.json\n\nLocal Office ← from DB01-LOCAL-OFF (the
    originating office on the claim)\nResponsible Local Office ← from APL-LOCAL-OFFICE
    (the processing terminal's office)\n\nThese can differ when a centralized unit
    or special office processes a claim belonging to another office.\n\nHow Local
    Office Is Used in Claims Processing\n1. CICS Terminal Authorization (Access Control)\n\
    \nMultiple CICS programs enforce the rule that a terminal can only process claims
    from its own local office — unless it's an authorized special unit :\nDXCC072S-cbl.json\n\
    LOV1C326-cbl.json\n\nDXCC072S, LOV1C326: Compare APL-LOCAL-OFFICE (terminal) against
    DB01-LOCAL-OFF (claimant). Match → access granted. Mismatch → check special unit
    authorization table (via LOCAL-OFFICE-CHECK). If not authorized → access denied
    with error.\n2. Batch Claim Type Classification\n\nThe Responsible Local Office
    (RESPLO) — not the local office per se — drives claim type classification in the
    batch journal extract programs (DXCBW30E, DXCBW39E, DXCBW39U, DXCBW30U). The hierarchy
    is :\nDXCBW30E.md\nDXCBW39E.md\nDXCBW39U.md\nDXCBW38R.md\nDXCBW30U.md\n\nClaim
    Type Classification By RESPLO And Municipality\n\nPriority\n\n\t\n\nCondition\n\
    \n\t\n\nClaim Type (STTYPE)\n\n\t\n\n...\n\n\n1\tProgram Code = 11 or 12\t4\t\
    ...\n2\tRESPLO = 999 or 997\t3\t...\n3\tMunicipality 05500–07599\t1\t...\n4\t\
    All other\t2\t...\nView more\n\nFor Type 3 claims (RESPLO 999/997), the municipality
    code is range-validated: if between 01001–76999 it's used as-is; otherwise it
    defaults to 77777.\nDXCBW30E.md\nDXCBW39E.md\n\n3. Local Office Validation Against
    Reference Tables\n\nDXCC121S (Claimant Maintenance) validates the Employment Service
    Office code against Table 112 (Local Offices) in the CODELOOP VSAM file. If the
    office code is not found, error 474 is raised.\nDXCC121S-cbl.json\n Special rules
    apply for certain program codes (e.g., Program Code 84 must use ESO = 998).\n\
    DXCC121S-cbl.json\n\nThe Municipality-to-Local-Office Assignment\n\nThis is directly
    documented — and it's the heart of what your MUNC replication spec is reflecting.
    The knowledge base shows two data stores that carry the municipality→local-office
    mapping, plus a maintenance application:\n\nPrimary: WDPV_E_FIPS_DESCRP (DB2 Table)\n\
    \nDXCC121S and LOH3C015 document how NJ address processing works :\nLOH3C015-cbl.json\n\
    DXCC121S-cbl.json\n\nFor NJ addresses, the system queries WDPV_E_FIPS_DESCRP by
    city name (DES_FIPS_REGION) AND local office (CDE_LOCAL_OFFICE)\nA matching row
    returns: CDE_MUNICIPAL (municipality code), IDN_FIPS_CITY, IDN_FIPS_COUNTY, IDN_FIPS_STATE\n\
    If exactly one match → municipality and FIPS codes are auto-assigned\nIf multiple
    matches for the same city + local office → the system refines by adding CDE_MUNICIPAL
    to the query\nIf the city is found but the local office doesn't match → a city/local-office
    mismatch error is displayed, and the user is directed to screen C015 to manually
    enter the municipality code\nIf duplicate city + local office → error 1505 (ambiguity)\n\
    Secondary: MUNICIPA VSAM File\n\nWhen the DB2 FIPS search fails, DXCC121S falls
    back to a browse of the MUNICIPA VSAM file by city name, then compares local office.
    Each record in this file also carries a local office field.\nDXCC121S-cbl.json\n\
    \nMaintenance Application: DXAMUNCP / DXAMUNC2 (MUNC Transaction)\n\nThe CICS
    municipality maintenance screens (MSTMUNC1 through MSTMUNC4) are documented in
    DXAMUNCP and DXAMUNC2. The detail screen (MSTMUNC4) shows the full municipality
    record layout :\nDXAMUNC2-cbl.html\nDXAMUNCP-cbl.json\n\nCITY, MUNICIPAL CODE,
    STATE, TAX MUNICIPAL, COUNTY, LOCAL OFFICE, LOCAL NAME, HEALTH MUNICIPAL, CORPORATE,
    WIB, COUNTY\n\nSo each municipality row does carry a local office, exactly as
    your MUNC replication spec shows. The CDE_LOCAL_OFFICE in the DB2 table (WDPV_E_FIPS_DESCRP)
    and the local-office field in the MUNICIPA VSAM file are the authoritative sources
    for this assignment.\n\nOut-of-State / Out-of-Region Handling\n\nFor addresses
    outside NJ :\nDXCC121S-cbl.json\n\nDE, NY, PA → searched in WDPV_E_FIPS_DESCRP
    by city + state FIPS code (no local office in the key)\nAll other states → assigned
    default municipality code 09400, all FIPS codes zeroed\nWhat's Not in the Knowledge
    Base\nWho maintains the WDPV_E_FIPS_DESCRP rows and the MUNICIPA VSAM file — the
    maintenance screens are documented, but the operational process for when/why rows
    are added or local-office assignments change is not in the held code slice.\n\
    The complete list of valid local office codes — Table 112 defines the valid set,
    but it lives in the CODELOOP VSAM dataset, whose populated values are operations-maintained
    and outside the knowledge base.\nWhether RESPLO and DB01-LOCAL-OFF can diverge
    on an existing claim over its lifetime (e.g., through office reassignment) — the
    registration logic sets them independently, but whether any downstream transaction
    can update DB01-LOCAL-OFF post-creation would require checking additional CICS
    update programs beyond the held set.\nWould you like to go deeper on any of these
    areas?\n\nMunicipality FIPS lookup details\n\nClaim type classification deep dive\n\
    \nMUNC transaction / maintenance screens"
