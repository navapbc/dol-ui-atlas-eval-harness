  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nGreat question
    for the Connect migration — channel identification in LOOPS is a bit more nuanced
    than it looks at first glance, because the channel is encoded differently depending
    on which layer of the system you're reading. The knowledge base documents two
    distinct mechanisms, plus a composite encoding on the payment record. Here's the
    full picture, synthesized from multiple source programs.\n\nHow LOOPS Stamps the
    Channel at Certification Time\n\nWhen a weekly certification flows through the
    CICS certification processing path, the program DXCP021S receives a processing
    mode indicator (SPAD-Z-MODE-WS) that identifies the inbound channel :\nDXCP021S-cbl.json\n\
    \n'W' = Web\n'I' = IVR\n'F' = Fax\n\nThis mode drives different initialization
    logic (e.g., the IVR application LOI5FUN5 restores its own screen data and skips
    certain defaults). However, this mode indicator is not what gets written to the
    certification record as a persistent channel marker.\n\nWhat does get persisted
    are two fields on the BP88 payment certification record :\nDXCP026S-cbl.json\n\
    \nBP88-TERMINAL-ID-CERT — set to '7777' for all automated channels (Web, IVR,
    and Voice)\nBP88-OPERATOR-ID-CERT — set to 9000 specifically for Web certifications;
    IVR/Voice uses its own operator ID (not 9000)\n\nThis is set in DXCP026S (the
    payment-processing CICS program), which explicitly assigns Terminal ID '7777'
    when the channel is Voice (APL-LOGICAL-CONV-ID = 'VP1A', 'VP1B', or 'IVR '), Web
    (SPAD-Z-MODE-WS = 'W'), or IVR (SPAD-Z-MODE-WS = 'I').\n\nHow to Tell IVR from
    Web from Manual in the Data\n\nEvery downstream program in the knowledge base
    uses the same two-field decision tree on the certification record. Here it is,
    documented consistently across DXCBDA2R, DXCBD12R, DXCBD12T, UIMI0440, and UIMI0443
    :\nDXCBDA2R.md\nDXCBDA2R.cbl.md\nDXCBD12T.md\nDXCBD12R.md\nUIMI0443.md\nUIMI0440.md\n\
    \nWeekly Certification Channel Classification Rules\n\nChannel\n\n\t\n\nTerminal
    ID (\n\n\t\n\nBP88-TERMINAL-ID-CERT\n\n\t\n\n...\n\n\nWEB (online self-service)\t\
    '7777'\t= 9000\t...\nPHONE / IVR (telephone)\t'7777'\t≠ 9000\t...\nManual / P100
    (staff-assisted)\t≠ '7777'\t(any)\t...\nView more\n\nThe key takeaway: Terminal
    ID '7777' is shared by both Web and IVR — it just means \"not a physical terminal.\"\
    \ The Operator ID is the differentiator: 9000 = Web, anything else with '7777'
    = IVR/Phone.\n\nUIMI0440 encodes this into a single phone-indicator field (F70-PHONE-IND)
    :\nUIMI0440.md\n\n'2' = Operator ID 9000 + Terminal ID 7777 (Web / SIM 926 automated)\n\
    '1' = Terminal ID 7777, Operator ID ≠ 9000 (Phone / IVR)\n'0' = Terminal ID ≠
    7777 (In-person / manual)\nThe Badge Indicator — A Second Encoding on Payment
    Records\n\nAfter payment processing, the Badge Indicator (SG02-BADGE-IND) on the
    IMS payment segment encodes both the certification method and the payment delivery
    method in a single composite digit, documented in NAVAPMTS :\nNAVAPMTS-cbl.json\n\
    \nBadge Indicator Encoding (Dual-Purpose)\n\nBadge Indicator\n\n\t\n\nCertification
    Method\n\n\t\n\nPayment Method\n\n\n0\tMANUAL\tCHECK\n1\tIVR\tCHECK\n2\tWEB\t\
    CHECK\n3\tMANUAL\tDIRECT DEPOSIT\n4\tIVR\tDIRECT DEPOSIT\n5\tWEB\tDIRECT DEPOSIT\n\
    6\tMANUAL\tDEBIT CARD\n7\tIVR\tDEBIT CARD\nView more\n\nSo if you're querying
    payment history (e.g., through the NAVAPMTS inquiry program), the Badge Indicator
    is the field to use. If you're reading raw certification records from the PAYVSAM
    or NOPAY files (as DXCBDA2R does), it's the Terminal ID + Operator ID pair.\n\n\
    What This Means for the Connect Migration\n\nFor your Connect integration, the
    critical implication is:\n\nIVR certifications today are distinguished from Web
    solely by Operator ID — the IVR system does not use Operator ID 9000. If Connect
    replaces the IVR and your new channel also stamps 9000, every downstream reporting
    program (DXCBDA2R, DXCBD12R, DXCBD12T, UIMI0440, UIMI0443) will classify those
    certs as Web, not Phone. You'll need to either assign a distinct Operator ID to
    Connect-originated certs, or update the downstream classification logic.\n\nCheck
    series is also channel-dependent — DXCP026S assigns check series 10 for IVR/Voice
    and 11 for Web.\nDXCP026S-cbl.json\n If Connect enters through the Web path, it
    gets series 11 instead of 10.\n\nThe Badge Indicator combines certification channel
    with payment delivery method. If Connect certifications flow through the Web processing
    mode, they'll get badge values 2/5 (WEB + CHECK/DIRECT DEPOSIT) rather than 1/4/7
    (IVR). This affects any system reading payment history.\n\nWhat Is Not in the
    Knowledge Base\nThe specific Operator ID that the current IVR system assigns —
    the docs say \"not 9000\" but don't name the value. This would be in the IVR middleware
    configuration or the LOI5FUN5 / LOI7FUN7 transaction setup.\nWhether there are
    additional downstream consumers of Terminal ID / Operator ID / Badge Indicator
    outside the held code slice.\nWhat would you like to explore next?\n\nMap the
    IVR certification processing flow end-to-end\n\nSearch for the IVR-specific Operator
    ID value\n\nAssess downstream impact if Connect uses Operator ID 9000"
