  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nHere is a comprehensive
    walkthrough of job L2AHD13 — the Automated Handbook Update job — synthesized from
    the L2AHD13.txt JCL, UIPBHB01.md, and UIPBHB02.md program analyses in the Daily
    CA-7 space.\n\nWhy the Sort Order Matters\n\nThe job processes incoming IB13 inter-state
    messages that carry handbook section updates. Multiple IB13 messages can arrive
    for the same state and section on a given day — for example, an editor might revise
    Section 3 of the NJ handbook twice in one afternoon. The sort order guarantees
    that the last record the update program encounters for each state+section is the
    most recent one, so that version — and only that version — becomes the authoritative
    content written to the Handbook VSAM file.\nL2AHD13.txt\nUIPBHB01.md\n\nThe composite
    sort key is:\n\nState → Section → Century → Julian Year → Julian Day → Creation
    Time\n\nThis produces two critical effects:\n\nGrouping: All records for the same
    state and section are adjacent, so the update program can detect section boundaries
    cleanly.\nChronological ordering within each group: Within a state+section, records
    run oldest-to-newest. Because UIPBHB02 processes records sequentially and does
    a delete-then-write for each one, the last record in the group overwrites all
    earlier versions. If the sort were random, a stale earlier revision could land
    after a newer one and become the version of record.\nUIPBHB01.md\nUIPBHB01.md\n\
    End-to-End Job Flow\n\nJob L2AHD13 runs in three steps :\nL2AHD13.txt\n\nStep
    1 — UIPBHB01: Select and Extract Qualifying IB13 Records\n\nProgram UIPBHB01 browses
    the IB13 VSAM indexed file for incoming records (IB13I) addressed to the state's
    .HANDBOOK receiver.\nUIPBHB01.md\nUIPBHB01.md\n For each record it:\n\nFilters
    — skips any record whose Receiver/Sender ID is not .HANDBOOK (boundary check),
    and skips any record whose Batch Switch = 'Y' (already processed by a prior run)\n\
    Extracts state and section — reads the first text line of the IB13 message:\n\
    If the line matches the section-header pattern ***** XXY ***** (where XX = state,
    Y = section), state and section are parsed from the header\nOtherwise, state and
    section are parsed from fixed positions at the beginning of the record-key line\n\
    Builds the sort key — converts the IB13 creation date (Gregorian → Julian via
    8000-GREG-CONVERT), determines century ('20' if year < 50, else '19'), captures
    creation time, and places all six components into the temporary record prefix:
    TEMP-STATE, TEMP-SECTION, TEMP-CENTURY, TEMP-JUL-YEAR, TEMP-JUL-DAY, TEMP-TIME\n\
    Embeds the payload — copies the full IB13 message record into TEMP-IB13-RECORD
    alongside the sort key\nWrites the assembled record to a sequential temporary
    file (DA-INFLTEMP)\nReports — displays totals for IB13 records read vs. temporary
    records written at EOJ\nStep 2 — JCL SORT: Sort the Temporary File\n\nThe JCL
    sorts the temporary file on the sort key fields (State, Section, Century, Julian
    Date, Creation Time) in ascending order. This is what places the most recent update
    for each section last.\nL2AHD13.txt\nUIPBHB01.md\n\nStep 3 — UIPBHB02: Apply Sorted
    Records to the Handbook VSAM\n\nProgram UIPBHB02 reads the sorted temporary file
    sequentially and processes each record as follows :\nUIPBHB02.md\nUIPBHB02.md\n\
    \nWhat UIPBHB02 Does With Each Record\n\nFor every record read from the sorted
    file, the program executes this sequence :\nUIPBHB02.md\nUIPBHB02.md\n\nMap to
    IB13 layout — extracts the IB13 key, data, text-line count, and text lines from
    the temporary record into the working IB13 record layout; resets the line counter
    to 1\n\nDetect new section vs. continuation — examines the first text line:\n\n\
    If it matches ***** XXY ***** → new section header\nOtherwise → continuation record
    for the current section\n\nSection-boundary handling:\n\nFirst section header
    ever (first-time switch = 'Y'): saves the IB13 key, copies the header line into
    the handbook record buffer, turns off the first-time switch, and advances the
    line counter — no VSAM write yet\nSubsequent section header (first-time switch
    = 'N'): marks the previous handbook record as having no continuation (HB-NEXT-RECORD-SWITCH
    = 'N'), writes it to the Handbook VSAM, then copies the new header into the buffer\n\
    Continuation record: marks the current handbook record as having a continuation
    (HB-NEXT-RECORD-SWITCH = 'Y') and writes it to the Handbook VSAM\n\nExtract the
    VSAM key — reads the key line from the IB13 text (second line for new sections,
    first line for continuations) and parses the 5-character key: State (2) + Section
    (1) + Record Number (2) = XXYZZ\n\nDelete the existing handbook record — issues
    a DELETE HB-FILE RECORD using the extracted key. Status '23' (not found) is acceptable
    — the IB13 may represent a brand-new section.\nUIPBHB02.md\nUIPBHB02.txt\n As
    the source code comments state: \"When a section of the automated handbook is
    updated, the whole section will be replaced on the VSAM file\"\n\nDelete the corresponding
    HIP record — attempts to remove the matching entry from the Handbook In-Progress
    file (DA-UIFLHB01) using the same key, cleaning up pending-update tracking\n\n\
    Initialize the new handbook record — clears the last-export date to zeros, sets
    the last-update date to today's system date (formatted via FAPCONF2), clears filler,
    and defaults HB-NEXT-RECORD-SWITCH to 'N'\n\nCopy IB13 text lines into the handbook
    record — iteratively moves each text line from the IB13 record into the handbook
    record being built, adjusting the line counter to account for the key line that
    is read but not written to the text area\n\nWrite the handbook record to VSAM
    — writes the completed record to DA-UIFLHB00 and displays a confirmation message
    with the key\n\nMark the source IB13 as processed — re-reads the previous IB13
    record from the IB13 file, sets IB13-READ-SWITCH = 'Y' and IB13-BATCH-SWITCH =
    'Y', stamps it with the current Julian date, and rewrites it. This marks it for
    purge by the next IB13 batch cleanup run\n\nRe-read the current IB13 — re-reads
    the current IB13 using its saved key and saves that key for the next write cycle\n\
    \nEnd-of-file — when the sorted file is exhausted, writes the final pending handbook
    record with HB-NEXT-RECORD-SWITCH = 'N'\n\nAt the end, the program displays totals:
    sorted records read and handbook records written, which should be equal (one-to-one
    correspondence).\nUIPBHB02.md\n\nSummary: Why Sort-Then-Process Works\n\nThe sort
    order (State + Section + Date + Time ascending) combined with UIPBHB02's delete-before-write
    logic means that for any given state+section, each successive record replaces
    the prior one. The last record in each group — the most recent — becomes the final
    version on the Handbook VSAM file. Without the sort, an older revision could overwrite
    a newer one, producing an incorrect handbook.\n\nScope Note\n\nThis describes
    the UIPBHB01 → SORT → UIPBHB02 pipeline as documented in the Daily CA-7 space.
    The origin of the IB13 records themselves (the inter-state messaging system that
    creates them) and the CICS online programs that display the Automated Handbook
    to users are separately documented and not covered in this slice of the knowledge
    base."
- id: v6-Q7
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe employer daily
    charge report is produced by a two-job pipeline: job L205DJ extracts and categorizes
    the raw charge segments, and downstream job L206DL formats and prints the control
    reports. Here is a synthesized walkthrough drawn from the DXCBD43E.md, L206DL.md,
    L206DL.txt, DXEBD44R.txt, and DXEBD49R.txt source analyses in the Daily CA-7 space.\n\
    \nThe Jobs\n\nL205DJ — Runs program DXCBD43E (COBOL batch). This is the heavy-lifting
    extract-and-categorize step. It reads every daily employer charge segment from
    the LOOPCD04 input file, validates and classifies each record, and writes one
    summary record per charge category to the CHGRPT output file (plus several side-effect
    files).\nDXCBD43E.md\nDXCBD43E.md\n\nL206DL — Runs two Easytrieve programs sequentially
    :\nL206DL.md\nL206DL.md\n\nStep 1 — DXEBD44R: reads the CHGRPT summary file from
    DXCBD43E, sorts it by charge type, and prints up to eight separate control reports\n\
    Step 2 — DXEBD49R: reads the CETAEMP detail file from DXCBD43E and prints the
    Daily Charge Report — CETA Employers\nWhich Records Make It Onto the Report\n\n\
    Program DXCBD43E applies a multi-gate validation to every record read from LOOPCD04.
    A record must pass all gates to be categorized, accumulated into the charge table,
    and ultimately appear on the report :\nDXCBD43E.md\nDXCBD43E.md\n\nTransaction
    code = E010 or E012 — any other code is written to the control error report and
    skipped\nNon-zero charge or penalty — records where both the employer charge amount
    and the penalty charge are zero are classified (assessment-only, C-week/balance-restore,
    or zero-charge) and counted but are not written to the charge category report\n\
    Valid program code + pay transaction code — the combination must match the Unit
    Record Code table; mismatches go to the error report\nValid pay transaction code
    — must be found in the Prefix Pay Code table (binary search); invalid pay codes
    go to the error report\nNon-zero employer FEIN — all-zeroes FEINs are flagged
    as errors\nNot a CETA or SP01 employer — CETA employers (FEIN prefix 800000) and
    SP01 special FEINs bypass the main charge-category pipeline and are routed directly
    to the CETAEMP output file for the separate CETA report\n\nRecords that survive
    all six gates are classified into one of 42 charge categories by employer FEIN
    and pay-transaction-code range, accumulated in a charge table, and at wrap-up
    one summary record per category is written to the CHGRPT file.\nDXCBD43E.md\n\n\
    How the Report Is Organized\nStep 1 — DXEBD44R (Charge Control Reports)\n\nDXEBD44R
    sorts the incoming CHGRPT records by CHGTYPE (charge type code) and then splits
    them across multiple reports by charge-type range :\nDXEBD44R.txt\n\nDXEBD44R
    Report Breakdown By Charge Type\n\nReport\n\n\t\n\nReport Number\n\n\t\n\nTitle\n\
    \n\t\n\n...\n\n\nRPT1\tDXEBD44R-RPT-001\tDaily Employer Charge Control Report
    (No EB)\t...\nRPT2\tDXEBD44R-RPT-002\tDaily Extended Benefits Charge Control Report\t\
    ...\nRPT3\tDXEBD44R-RPT-003\tDaily Charge Report — Conversion Employer\t...\n\
    RPT4\tDXEBD44R-RPT-004\tDaily E.U.B. Charge Control Report\t...\nRPT5\tDXEBD44R-RPT-005\t
    Daily W.F.D. Charge Control Report\t...\nRPT6\t(added 3/99)\tNon-Charge Types
    Report\t...\nRPT7\t(added 3/02)\tFSC Charge Types Report\t...\nRPT8\t(added 4/02)\t
    TUCX Charge Types Report\t...\nView more\n\nEach report shares the same columnar
    layout :\nDXEBD44R.txt\n\nFund (charge category description, e.g. \"UI-CONTRIBUTORY\"\
    , \"UCFE\", \"UCX\", \"GENERAL FUND\")\nDebit CNT — count of debit transactions\n\
    Debit DOLLARS — total debit dollar amount\nCredit CNT — count of credit transactions\n\
    Credit DOLLARS — total credit dollar amount\nNet Amount of DOLLARS — net (debit
    minus credit)\nTotal REC CNT — total record count for that category\n\nAt the
    bottom of each report, a Totals line sums all the columns. After all the sub-reports
    print, DXEBD44R also computes reconciliation cross-totals from the individual
    category net amounts and writes those to a reconciliation VSAM cluster.\nDXEBD44R.txt\n\
    \nStep 2 — DXEBD49R (CETA Report)\n\nDXEBD49R is a simple detail-listing report
    titled \"Daily Charge Report — CETA Employers\" (DXEBD49R-RPT-001). It prints
    one line per CETA charge record with :\nDXEBD49R.txt\n\nSSN, Claimant Name, Date
    of Claim, Local Office, Charge Week Ending, Charge Amount, WBR, MBA, Pay Code,
    Balance, Partial amount, Employer Registration Number\n\nAt the bottom it prints
    an Amount Total of all charge amounts.\n\nUpstream: The 42 Charge Categories\n\
    \nThe category index assigned by DXCBD43E determines which sub-report a category
    lands on. Here is the documented mapping (synthesized from the DXCBD43E.md business
    rules) :\nDXCBD43E.md\nDXCBD43E.md\n\nDXCBD43E Charge Category Index Map\n\nIndex\n\
    \n\t\n\nCategory\n\n\t\n\nEmployer FEIN / Condition\n\n\t\n\n...\n\n\n1\tUI Contributory
    (Regular)\tRegular NJ employer, regular pay codes\t...\n2\tGeneral Fund (Regular)\t
    FEIN 888888, regular pay code\t...\n3\tUCFE (Regular)\tFEIN 000002, regular pay
    code\t...\n4\tUCX (Regular)\tFEIN 000003 or 444444, regular pay code\t...\n5\t
    General Fund – FSC/Extended\tFEIN 888888, FSC/extended pay code\t...\n10\tOut-of-State\t
    FEIN 999998\t...\n11\tUI Contributory – EB\tRegular NJ employer, EB pay code\t\
    ...\n12\tEB Charged to Federal\tFEIN 777777, federal EB\t...\n13\tGeneral Fund
    – EB First Week\tFEIN 888888, pay codes 107/108\t...\n14\tGeneral Fund – EB Unfunded\t
    FEIN 888888, EB unfunded code\t...\nView more\nScope Note\n\nThis describes the
    extraction step (L205DJ / DXCBD43E) and the control-report printing step (L206DL
    / DXEBD44R / DXEBD49R). The same extraction also feeds several other downstream
    jobs and files — the Federal Charge Report (FEDRPT, printed by L206DN), the B187
    bank tape (L206DK), the CWC selection file (SLCTCWC), and the UC53 Penalty Assessment
    (L206DP) — but those are separate report streams. Programs DXCBD40E and DXCBD50E,
    which appear in the source code with the same per-claim-type report title literals
    (Intrastate 1A, Interstate 1B, UCFE 1C, etc.), are different programs producing
    the per-claim-type detail employer charge reports; their full business rules were
    not fully retrieved in this search, so the detail-report pipeline is not described
    here.\n\nWould you like to explore a related topic?\n\nB187 reverse file details\n\
    \nUC53 penalty assessment pipeline\n\nPer-claim-type detail reports (DXCBD40E
    / DXCBD50E)"
