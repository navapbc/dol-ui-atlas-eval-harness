- id: v6-Q1
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nHere's a comprehensive
    walkthrough of job L204DF2, drawn from the JCL documentation in the Daily CA-7
    space. The JCL header describes it as: \"THIS DAILY JOB PRINTS THE DAILY BATCH
    REGISTER AND BANK FILES.\" The job has restart criticality 9 (high).\nL204DF2.md\n\
    L204DF2.txt\n\nWhat L204DF2 Produces\n\nThe job produces these key permanent output
    files :\nL204DF2.md\n\nTable\n\nOutput Dataset\n\n\t\n\nDescription\n\n\t\n\n\
    Storage / Retention\n\n\nLAK2LDXP.L204DF.RECON.ACC2528.DTL\tSorted reconciliation
    detail — O-Category (Acct 2528)\tDisk, catalogued\nLAK2LDXP.L204DF.RECON.ACC2536.DTL\t
    Sorted reconciliation detail — B-Category (Acct 2536)\tDisk, catalogued\nLAK2LDXP.L204DF.RECON.ACC0987.DTL\t
    Sorted reconciliation detail — T-Category (Acct 0987)\tDisk, catalogued\nLAK2LDXP.L204DF.RECON.ACC0499.DTL\t
    Sorted reconciliation detail — E-Category (Acct 0499)\tDisk, catalogued\nLAK2LDXP.L204DF.BNKFLDTE.DTL(+1)\t
    Date-enriched bank records (88-byte, GDG)\tTape\nLAK2LDXP.L204DF.RECNBKP2.DTL(+1)\t
    Consolidated backup of all 4 account files\tTape, 120-day retention\nLAK2LDXP.L2BPBNK1.CHECKS.ISSUED.DTL(+1)\t
    Checks Issued file — sorted, deduplicated, 39-byte records\tGDG\nLAK2LDXP.L204DF.ERROR.DISK.DTL\t
    Unmatched/error records from bank matching (133-byte print-line)\tDisk\nLAK2LDXP.L204DF.ERROR.FICHE.DTL\t
    Error records archived to microfiche tape\tTape, 30-day retention\nLAK2LDXP.L204DF.RECNBKP2.DLY.BCKUP(+1)\t
    Permanent daily backup of consolidated recon\tTape, permanent (EXPDT=99000)\n\
    View more\nStep-by-Step Job Flow\nPhase 1: Cleanup (PREPARE)\n\nThe job starts
    by unconditionally deleting six prior-run files (intermediate recon, error disk,
    and the four account detail files) to guarantee a clean processing slate.\nL204DF2.md\n\
    \nPhase 2: Ingest and Filter (SORTA → BNKFLMOD)\nSORTA — Copies the entire Big
    Record Detail file (BIGREC.DTL, 80-byte records) verbatim into a temporary work
    file &&RECONCIL. This work file is used by two separate downstream paths.\nL204DF2.md\n\
    BNKFLMOD — Filters &&RECONCIL to extract only \"Old Account\" bank records, writing
    them to OLDACCT.BNKREC.DTL.\nL204DF2.md\nPhase 3: Date Enrichment and Categorization
    (BNKFLDTE → UIBNKDAT)\nBNKFLDTE — Reads OLDACCT.BNKREC.DTL plus the DATECARD control
    card and appends 8 bytes of date-related fields, expanding each record from 80
    → 88 bytes. Output goes to GDG BNKFLDTE.DTL(+1) on tape.\nL204DF2.md\nUIBNKDAT
    — Reads the same OLDACCT.BNKREC.DTL with DATECARD and routes each record into
    exactly one of four category streams based on bank account type :\nL204DF2.md\n\
    O → &&BANKO → Account 2528\nB → &&BANKB → Account 2536\nT → &&BANKT → Account
    0987\nE → &&BANKE → Account 0499\nPhase 4: Sort and Persist Bank Files (SORTO/B/T/E
    → REPRO4 → BACKUPs)\nSORTO / SORTB / SORTT / SORTE — Each temp category file is
    sorted ascending by the first 20 characters (account key) and written to its permanent
    reconciliation detail file (e.g., RECON.ACC2528.DTL).\nL204DF2.md\nREPRO4 — Consolidates
    all four account files (in order: 2528 → 2536 → 0987 → 0499) into a single tape
    GDG backup (RECNBKP2.DTL(+1), 120-day retention).\nL204DF2.md\nBACKUP1–4 — Each
    of the four account files also gets its own individual GDG backup on disk. These
    execute unconditionally.\nPhase 5: Bank Matching (SORT1 → BNKFLBLD → REPRO5)\n\
    SORT1 — Goes back to &&RECONCIL and filters it to only records where positions
    71–80 contain account number 0001273518 or 0001273507.\nL204DF2.md\nBNKFLBLD —
    Matches those filtered records against the BANKMTCH VSAM cluster. Any records
    that fail matching are written to ERROR.DISK.DTL (133-byte print-line format).\n\
    L204DF2.md\nREPRO5 — Backs up the BANKMTCH VSAM cluster to tape (30-day retention).\n\
    L204DF2.md\nPhase 6: Checks Issued File Build (BUILDOUT → SORTD)\n\nThis is the
    path that answers how check records get from the daily register to the bank files
    :\nL204DF2.md\n\nBUILDOUT — Reads the full BIGREC.DTL (the same \"Big Record\"\
    \ daily register) and transforms each record into a standardized 39-byte checks-issued
    output record, writing to temp file &&OUTSTD.\nSORTD — Sorts those 39-byte records
    in ascending order across the entire record content and removes exact duplicates
    (SUM FIELDS=NONE). The deduplicated result is written to a new GDG generation
    of LAK2LDXP.L2BPBNK1.CHECKS.ISSUED.DTL(+1).\n\nIn short: BIGREC.DTL → program
    BUILDOUT (standardize to 39 bytes) → SORT (sort + dedup) → CHECKS.ISSUED.DTL GDG.\n\
    \nPhase 7: Cleanup, Archival, and Final Backup\nREPRO6 — Backs up the payment
    record file (PAYREC.DTL) to a GDG on disk.\nL204DF2.md\nIEFBR14A — Deletes the
    spoiled-check file (SPOILCHK.DTL) if all prior steps succeeded; preserves it if
    anything failed.\nL204DF2.md\nREPRO8 — Archives ERROR.DISK.DTL to microfiche tape
    (ERROR.FICHE.DTL, 30-day retention) — but only if step REPRO6 succeeded.\nL204DF2.md\n\
    REPRO9 — Copies the consolidated RECNBKP2.DTL to a permanently retained daily
    backup tape (RECNBKP2.DLY.BCKUP(+1), EXPDT=99000) — but only if all prior return
    codes ≤ 4.\nHow Check Records Flow: Daily Register → Bank Files\n\nTo zoom in
    on your specific question, the path is a two-step transformation inside L204DF2
    :\nL204DF2.md\n\nThe daily register data arrives as LAK2LDXP.L204DF.BIGREC.DTL
    (80-byte records).\nProgram BUILDOUT reads BIGREC.DTL and builds a standardized
    39-byte output record per check to temp file &&OUTSTD.\nThe SORTD step sorts &&OUTSTD
    ascending across all 39 bytes and eliminates exact duplicates.\nThe result is
    written as a new generation of the Checks Issued Detail GDG (LAK2LDXP.L2BPBNK1.CHECKS.ISSUED.DTL(+1)),
    which is the bank-ready file.\n\nImportant caveat: This describes the BUILDOUT
    → SORTD extract/transform path within L204DF2. The upstream process that populates
    BIGREC.DTL and the downstream consumer of CHECKS.ISSUED.DTL are not documented
    in this job's JCL — they would be covered by predecessor and successor jobs in
    the daily CA-7 schedule.\n\nWhat would you like to explore next?\n\nTrace the
    predecessor job that feeds BIGREC.DTL\n\nTrace the successor job that reads CHECKS.ISSUED.DTL\n\
    \nDive into program-level details (BUILDOUT, BNKFLBLD, UIBNKDAT, etc.)\n\nSee
    the full L204DF daily schedule sequence"
- id: v6-Q2
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nHere's a complete
    walkthrough of how job L207DCL prepares BC3E claimant forms for laser printing.
    This is synthesized from the JCL source (L207DCL.txt), job-level business rules
    (L207DCL.md), and the individual COBOL program analyses (DXCB165U.md, DXCB166U.md,
    DXCBD24E.md, DXCBBC3E.md, UIMI0754.md) in the Daily CA-7 space.\nL207DCL.txt\n\
    L207DCL.md\nDXCB165U.md\nDXCB166U.md\nDXCBD24E.md\nDXCBBC3E.md\nUIMI0754.md\n\n\
    The JCL narrative states: \"THIS JOB PRODUCES THE FOLLOWING REPORT: PRINTS NEW
    BC3E FORMS FOR THE CLAIMANT ON LASER.\" Restart criticality is 1 (low — force
    complete when STEP04 returns RC 4, meaning no data). The AFP output is directed
    to the USPS Daily print bin (ADF_ND-USPS:DAILY) using FORMDEF GEN14 and PAGEDEF
    DOLB3E.\n\nOverview: Two Parallel Pipelines\n\nThe job splits the input into Domestic
    and Foreign streams, transforms each independently, then merges them for a single
    laser print output. Each pipeline adds the same enrichments (key field + DB2 sync
    code) but through separate step names.\n\nPhase 1 — Pre-Processing (Steps VERIFY
    → STEP04)\nTable\n\nStep\n\n\t\n\nProgram\n\n\t\n\nWhat It Does\n\n\nVERIFY\t\
    IDCAMS\tVerifies the LAK2LDXP.VSAM.CODES.CLUSTER integrity. If this fails (RC≠0),
    all subsequent COND=(0,NE) steps are skipped.\nBACKUP1\tIDCAMS REPRO\tBacks up
    the source file MAIL.L207DC2.DATA.DTL (778-byte FB records) into GDG MAIL.L207DC2.DATA.BCKUP(+1).\n\
    PREPARE1\tIEFBR14\tDeletes 9 intermediate files from any prior run to guarantee
    a clean slate.\nSTEP04\tIEBPTPCH\tPrints the first record of the source file (STOPAFT=1)
    so operations can visually confirm the file is readable and populated. RC 4 here
    means empty input — the JCL header says to force-complete.\nView more\nPhase 2
    — Split into Domestic / Foreign (Steps SORT1, SORT2)\n\nBoth sorts read the same
    source file MAIL.L207DC2.DATA.DTL (778-byte records):\n\nSORT1 — INCLUDE COND=(342,5,CH,EQ,C'00000')
    → Records with ZIP = 00000 at positions 342–346 are routed to MAIL.L207DCL.FRGN.DTL
    (the Foreign stream).\nSORT2 — OMIT COND=(342,5,CH,EQ,C'00000') → All other records
    (non-zero ZIP) are routed to MAIL.L207DCL.DATA.DTL (the Domestic stream).\n\n\
    Both files retain the original 778-byte LRECL. No sort key is applied — records
    are copied in their original sequence.\n\nPhase 3 — Domestic Pipeline (5 Programs)\n\
    \nThis is the main transformation chain, each program adding or correcting specific
    fields before the record is print-ready:\n\n1. DXCB165U — Save ZIP Codes (778
    → 787 bytes)\nInput: MAIL.L207DCL.DATA.DTL (778 bytes)\nOutput: MAIL.L207DC3.DATA.DTL
    (787 bytes)\nWhat it does: Copies the full 778-byte laser output record to the
    output structure, then extracts the 5-digit ZIP code (BC3L-ZIP-END1) and 4-digit
    ZIP+4 extension (BC3L-ZIP-END4) from the body of the record and appends them as
    the last 9 bytes of the output record. This \"saves\" the ZIP codes at the end
    of the record for the next program to reference.\nRecord change: 778 → 787 bytes
    (+ 9 bytes of saved ZIP data).\nSource: DXCB165U.cbl paragraph 420 — MOVE BC3L-ZIP-END1
    TO OUT-ZIP5-SAVE; MOVE BC3L-ZIP-END4 TO OUT-ZIP4-SAVE\n2. DXCB166U — Restore Blanked
    ZIP Codes (787 → 778 bytes)\nInput: MAIL.L207DC3.DATA.DTL (787 bytes)\nOutput:
    MAIL.L207DCL.TRAY.DTL (778 bytes)\nWhat it does: Reads the 787-byte records from
    DXCB165U. For each record, checks whether the primary ZIP code field (BC3L-ZIP-END1)
    is blank or zero. If so, it substitutes the ZIP from the saved fields (BC3L-ZIP-END1-SAVED,
    BC3L-ZIP-END4-SAVED) that were appended to the end of the record in the prior
    step. After correction, writes only the original 778 bytes to output (the trailing
    9 saved-ZIP bytes are consumed but not propagated).\nRecord change: 787 → 778
    bytes (ZIP corrected; trailing save area dropped).\nSource: DXCB166U.md business
    rule \"ZIP Code Missing Value Substitution\"\n3. DXCBD24E — Place ZIP Code on
    City/State Line (778 → 778 bytes)\nInput: MAIL.L207DCL.TRAY.DTL (778 bytes)\n\
    Output: EMAIL.ZUMDAHR1.TRA10.DTL (778 bytes)\nWhat it does: Formats the 9-digit
    ZIP as NNNNN-NNNN and inserts it into the address line (city/state field) of the
    AFP form record. The program scans the 40-character address field for three consecutive
    spaces and inserts the formatted ZIP there, ensuring existing city/state data
    isn't overwritten. Record length stays 778 bytes — this is an in-place address
    field modification.\nRecord change: 778 → 778 bytes (address field enriched with
    formatted ZIP).\nSource: DXCBD24E.md\n4. DXCBBC3E — Add Sort Key (778 → 790 bytes)\n\
    Input: EMAIL.ZUMDAHR1.TRA10.DTL (778 bytes)\nOutput: MAIL.L207DCL.TRAF.DTL (790
    bytes)\nWhat it does: Reads each UI claim record, reformats claimant name fields
    (splits last name, first name, and middle initial from a combined name field),
    and appends a 12-byte sort key derived from a partial SSN and the mail date to
    the end of the record.\nRecord change: 778 → 790 bytes (+ 12-byte key field).\n\
    Source: DXCBBC3E.md\n5. UIMI0754 (via step UIMB0754) — DB2 Employer Sync Code
    (790 → 797 bytes)\nInput: MAIL.L207DCL.TRAF.DTL (790 bytes)\nOutput: L207DCL.SYNC.DTL
    (797 bytes)\nWhat it does: For each record, extracts the claimant SSN (3 parts
    → packed numeric) and employer FEIN (3 parts → packed numeric), then queries the
    DB2 table UIMT_SG03_EMPLOYER using both as a combined key (WHERE SG03_IDN_SSN
    = :SSN AND SG03_EMP_FEIN = :FEIN). Retrieves the FEIN Synonym Code (SG03_FEIN_SYNONYM_CODE)
    and appends it to the output record. If no matching employer row exists, the synonym
    code defaults to zero — the record is still written.\nRecord change: 790 → 797
    bytes (+ 7-byte sync/synonym code area).\nRuns under: DB2 plan UIMIPLNP, invoked
    via TSO batch runner IKJEFT01.\nSource: UIMI0754.md\nPhase 4 — Foreign Pipeline
    (Same Programs, Parallel Steps)\n\nThe Foreign stream follows the same last two
    transformations as domestic, but skips the ZIP-save/restore and city-state insertion
    (those records have ZIP = 00000):\n\nTable\n\nStep\n\n\t\n\nProgram\n\n\t\n\n\
    Input → Output\n\n\t\n\n...\n\n\nDXCBBC3X\tDXCBBC3E (same program)\tFRGN.DTL →
    FRG2.DTL\t...\nUIMB754B\tUIMI0754 (same program)\tFRG2.DTL → FRG3.DTL\t...\nView
    more\nPhase 5 — Merge and Laser Print (Step LASRPRNT)\n\nStep LASRPRNT uses IEBGENER
    with concatenated SYSUT1 input:\n\nMAIL.L207DCL.FRG3.DTL (foreign records, 797
    bytes) — read first\nL207DCL.SYNC.DTL (domestic records, 797 bytes) — appended
    after\n\nOutput goes to SYSOUT=(,),OUTPUT=(*.AFPOUT1) — the AFP printer queue
    configured as:\n\nFORMDEF: GEN14\nPAGEDEF: DOLB3E\nDestination: LOCAL, ROOM='ADF_ND-USPS:DAILY'\n\
    \nNo transformation is applied — IEBGENER with SYSIN DD DUMMY copies records straight
    through.\n\nPhase 6 — Backups and Reprint Support\nTable\n\nStep\n\n\t\n\nWhat
    It Does\n\n\nBACKUP2\tIDCAMS REPRO of SYNC.DTL → TRAY.BCKUP(+1) GDG (797 bytes)\n\
    BACKUP3\tIDCAMS REPRO of FRG3.DTL → FRGN.BCKUP(+1) GDG (797 bytes)\nDATEPG7\t\
    Reads SYNC.DTL (797 bytes), appends a 10-byte run date → PLUS10.DTL (807 bytes)
    for reprint indexing\nGDGBUILD\tArchives PLUS10.DTL → PLUS10.BCKUP(+1) GDG\nDXCBR400\t
    Returns RC=400 only if manually restarted at this step (RESTART=DXCBR400). Normal
    runs return RC < 100, so the reprint branch is skipped.\nDXCBR7A/DXCBR7B/#REPRINT\t
    Conditional reprint path: DXCBR7A selects records by run date from the GDG, DXCBR7B
    filters by record-number ranges, and #REPRINT sends the subset to the AFP printer.\n\
    View more\nRecord Length Summary Through the Chain\nL207DCL Record Length Transformation
    Chain\n\nStep\n\n\t\n\nProgram\n\n\t\n\nLRECL In\n\n\t\n\n...\n\n\nSORT1/SORT2\t\
    SORT\t778\t...\nDXCB165U\tDXCB165U\t778\t...\nDXCB166U\tDXCB166U\t787\t...\nDXCBD24E\t\
    DXCBD24E\t778\t...\nDXCBBC3E\tDXCBBC3E\t778\t...\nUIMB0754\tUIMI0754\t790\t...\n\
    LASRPRNT\tIEBGENER\t797\t...\nDATEPG7\tDATEPG7\t797\t...\nView more\n\nImportant
    caveats:\n\nThis describes what each program does within this job. The upstream
    process that populates MAIL.L207DC2.DATA.DTL is not documented in this job's JCL
    — it would be covered by a predecessor job in the daily CA-7 schedule.\nThe exact
    COBOL field layouts for DXCBD24E and DXCBBC3E are described from extracted business
    rules, not from a line-by-line source walkthrough. The internal field-level details
    (which bytes of the address field are scanned, exact sort-key composition) are
    derived from the program analyses and should be confirmed against the source if
    you need byte-level precision.\nWhat would you like to explore next?\n\nWhat feeds
    L207DCL its input?\n\nDeep-dive into the DXCBBC3E key field derivation\n\nWalk
    through the reprint mechanism"
- id: v6-Q3
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe classification
    logic lives primarily in program DXCRD99E, a daily batch program that reads Segment
    09 (refund payment) records from the Change Data Transaction File (CDTFILE) and
    assigns an Account Code of CASH, OFFSET (CLPY), or WRITE-OFF (WOFF) to each record
    based on the value of field DB09-REFUND-PAY-TYPE. That code is then carried into
    the SEG9FILE extract used by downstream reporting programs like DXCR227E (daily
    ETA-227 extract) and DXCR227M (monthly ETA-227). Here's the full decision chain,
    drawn directly from the DXCRD99E business rules.\n\nStep 0 — Gate Check: Reject
    Pay Type '06'\n\nBefore any classification occurs, pay type '06' is rejected outright.
    The record is flagged as a bad record with the error message NOT-VALID-OFFSET-MSG
    and routed to the error file DB89FILE. No account code is ever assigned.\nDXCRD99E.md\n\
    \nStep 1 — Initial Classification: CASH vs. OFFSET\n\nThe first decision evaluates
    the Refund Pay Type against a fixed list of known cash payment types :\nDXCRD99E.md\n\
    DXCRD99E.md\n\nTable\n\nIf\n\n\t\n\nDB09-REFUND-PAY-TYPE\n\n\t\n\nis…\n\n\t\n\n\
    ...\n\n\n'01', '02', '03', '04', '07', '09', '10', '51', '11', or '12'\tCASH\t\
    ...\t\nAnything else (and not '06', which was already rejected)\tOFFSET (CLPY)\t\
    ...\t\nView more\n\nSo the default for any unrecognized non-rejected pay type
    is OFFSET, not CASH. The CASH list is the explicit whitelist.\n\nStep 2 — Write-Off
    Override for Pay Type '99'\n\nAfter the initial CASH/OFFSET assignment, a secondary
    check looks specifically at pay type '99'. If the pay type is '99', the account
    code is overridden to WRITE-OFF (WOFF), regardless of whether Step 1 had assigned
    CASH or OFFSET.\nDXCRD99E.md\nDXCRD99E.md\n\nStep 3 — Write-Off Reversal: No Waiver
    Reason → Back to CASH\n\nThere is one more refinement: if the pay type is '99'
    but the Waiver Reason Code field (DB09-WO-WAIVER-REASON-CODE) is blank (all spaces),
    the account code is overridden back from WRITE-OFF to CASH. The logic is that
    without a formal waiver reason on file, the transaction cannot be treated as a
    legitimate write-off and must instead be classified as a cash collection.\nDXCRD99E.md\n\
    DXCRD99E.md\n\nIf the Waiver Reason Code is present (non-blank), the WRITE-OFF
    classification is retained.\nDXCRD99E.md\n\nThe Complete Decision Flow\nRefund
    Payment Account Code Classification Logic\n\nStep\n\n\t\n\nCondition\n\n\t\n\n\
    Account Code Assigned\n\n\t\n\n...\n\n\nGate\tPay Type = '06'\tREJECTED — routed
    to DB89FILE error file; no account code\t...\n1a\tPay Type ∈ {'01','02','03','04','07','09','10','51','11','12'}\t\
    CASH\t...\n1b\tPay Type NOT in the list above (and ≠ '06')\tOFFSET (CLPY)\t...\n\
    2\tPay Type = '99' (regardless of Step 1 result)\tOverride → WRITE-OFF (WOFF)\t\
    ...\n3\tPay Type = '99' AND Waiver Reason Code is blank\tOverride → CASH (reverts
    from WRITE-OFF)\t...\n3 (alt)\tPay Type = '99' AND Waiver Reason Code is present\t
    Retain WRITE-OFF (WOFF)\t...\nView more\nHow Downstream Programs Use the Classification\n\
    \nThe account code assigned by DXCRD99E is written into the DB99-ACCOUNT-CODE
    field of each SEG9FILE output record. Downstream reporting programs then consume
    it :\nDXCR227E.md\nDXCR227E.md\n\nDXCR227E (daily ETA-227 extract) reads the Cash/Offset
    file and re-classifies records by pay type for accumulation into Section B, Line
    202 (Cash) and Line 203 (Offset). It applies the same CASH pay-type list as DXCRD99E
    — pay types '01'–'04', '07', '09'–'12', '51' are CASH; everything else routes
    to the Offset line. Records that match neither are skipped.\nDXCR227E.md\nDXCR227E.md\n\
    \nDXCR227M (monthly ETA-227) also reads the DB09 Cash/Offset file and classifies
    pay types '05' and '06' specifically as Offset for the monthly report accumulation.\n\
    DXCR227M.md\n\nImportant Caveat — Scope of the Documented Rules\n\nThis describes
    the DXCRD99E classification logic as documented in the program analysis. The pay-type
    code values themselves (what '01' means in business terms, what '10' represents)
    are not defined in the program source — they are maintained operationally, likely
    in the CODELOOP VSAM dataset or in reference documentation outside the knowledge
    base. If you need the business meaning of each individual pay-type code (e.g.,
    \"01 = personal check, 05 = benefit offset\"), that mapping would need to come
    from an SME or from the T120/CODELOOP reference data.\n\nAlso note a documented
    discrepancy between programs: DXCR227M classifies pay types '05' and '06' as Offset
    for monthly reporting, while DXCRD99E rejects '06' entirely as invalid. This may
    reflect different processing contexts (daily federal extract vs. monthly state
    report), but it is worth flagging for SME review if you are reconciling across
    both programs.\nDXCRD99E.md\nDXCR227M.md\n\nWhat would you like to explore next?\n\
    \nUpstream job flow into DXCRD99E\n\nETA-227 report accumulation detail\n\nSegment
    09 copybook field layout"
- id: v6-Q4
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nHere is a comprehensive
    breakdown of DXCRD88E — the DB08 Reformat daily batch program — synthesized from
    the DXCRD88E.md program analysis in the Daily CA-7 space.\nDXCRD88E.md\nDXCRD88E.md\n\
    \nDXCRD88E reads Segment 08 (refund claim / overpayment) records from the Change
    Data Transaction file (CDTFILE), runs them through a gauntlet of structural and
    percentage validations, computes net outstanding balances across 20 funding-category
    buckets, and writes one output record per positive-balance bucket to SEG8FILE
    for downstream report programs (DXERD801–DXERD804). Invalid records are routed
    to DB89FILE with a diagnostic error message.\n\nPart 1 — Validation Pipeline\n\
    \nEvery record is validated in a strict, short-circuiting sequence. The first
    failing check sets the error message and immediately exits to error processing
    — no later checks are applied.\n\nDXCRD88E Validation Pipeline\n\nStep\n\n\t\n\
    \nValidation\n\n\t\n\nCondition to Reject\n\n\t\n\n...\n\n\n1\tBefore/After Byte
    validity\tByte ∉ {B, A, I, D}\t...\n2\tDelete Byte rejection\tByte = D (Delete)\t\
    ...\n3\tProgram Code 45 rejection\tProgram Code = 45\t...\n4\tFederal amount presence\t
    All three Federal amounts due (Fraud, Non-Fraud, Agency Error) = 0\t...\n5\tPC
    20: Fed% and UCFE% must = 100%\tPC=20 and (Fed% ≠ 100% or UCFE% ≠ 100%)\t...\n\
    6\tPC 30: Fed% and UCX% must = 100%\tPC=30 and (Fed% ≠ 100% or UCX% ≠ 100%)\t\
    ...\n7\tFed% + NonFed% must = 100%\tSum ≠ 100%\t...\n8\tPC 80/83: Fed%=100%, UCX%=0%,
    UCFE%=0%\tAny condition not met\t...\n9\tUCX% + UCFE% ≈ Fed% (rounding tolerance)\t
    Sum outside tolerance range\t...\n10\tZero Fed% with non-zero UCX/UCFE\tFed%=0
    and (UCX%>0 or UCFE%>0)\t...\nView more\nKey Validation Notes\nTransaction Code
    D15U is a special adjustment transaction that is exempt from all percentage validations
    (steps 5–11). This allows D15U records to carry otherwise-invalid percentage combinations
    without being rejected.\nDXCRD88E.md\nDXCRD88E.md\nStep 4 (federal amount presence)
    is not an error — records with no federal amounts are silently skipped with no
    output and no error record.\nDXCRD88E.md\nDXCRD88E.md\nStep 9 uses a configurable
    rounding tolerance rather than exact equality, and has three additional bypass
    conditions: PC 80/83, all-percentages-zero, and the D15U + PC 15 special case.\n\
    DXCRD88E.md\nPart 2 — Transaction Sign Determination\n\nBefore validations begin,
    the Before/After Byte determines how all financial amounts will be signed in output
    :\nDXCRD88E.md\n\nDXCRD88E Transaction Sign (BUCKET-SIGN)\n\nBefore/After Byte\n\
    \n\t\n\nMeaning\n\n\t\n\nBUCKET-SIGN\n\n\nB (Before)\tState before a change —
    being reversed\t−1 (negative)\nA (After)\tState after a change — new current value\t
    +1 (positive)\nI (Insert)\tNew record being added\t+1 (positive)\nD (Delete)\t
    Record being removed\t−1 (negative) — but also rejected as bad record\nView more\n\
    \nNote: although Delete records receive a −1 sign, they are always rejected (step
    2) and routed to the error file. The sign is still applied to their error-file
    amounts for directional accounting.\nDXCRD88E.md\n\nPart 3 — Claim Classification\n\
    \nAfter the structural validations pass, each record receives a classification
    and an account code in paragraph 1200-RECORD-HSKG :\nDXCRD88E.md\nDXCRD88E.md\n\
    \nDXCRD88E Claim Classification Logic\n\nProgram Code\n\n\t\n\nClassification
    (DB88-LOOPS-SKELETON-IND)\n\n\n10, 20, 21, 22, 23, 30, 31, 40, 41, 42, 43\tLOOPS
    (active UI programs)\nAny other code (except 99)\tSKELETON (inactive/non-standard)\n\
    99\tSUSPENSE (overrides any prior LOOPS/SKELETON assignment)\nView more\nThe Account
    Code (DB88-ACCOUNT-CODE) is set to RECEIVABLES unconditionally for every record
    that reaches this step, regardless of classification.\nDXCRD88E.md\nClassification
    and account code fields are cleared to spaces before each record to prevent carry-over.\n\
    DXCRD88E.md\nPart 4 — Balance Computation (20 Funding Buckets)\n\nFor every record
    that passes all validations, DXCRD88E computes 20 outstanding balances, each as
    :\nDXCRD88E.md\nDXCRD88E.md\n\nBalance = Amount Due − Amount Paid\n\nDXCRD88E
    — 20 Funding-Category Balance Buckets\n\nFunding Category\n\n\t\n\nFraud\n\n\t\
    \n\nNon-Fraud\n\n\t\n\n...\n\n\nNFED (Non-Federal)\t✓\t✓\t...\nFED / UCX / UCFE
    (Federal)¹\t✓\t✓\t...\nEB (Extended Benefits)\t✓\t✓\t...\nFSC (Federal Supplemental
    Comp.)\t✓\t✓\t...\nEUB (Extended Unemployment Benefits)\t✓\t✓\t...\nWFD (Workforce
    Development)\t✓\t✓\t...\nFINE (Fines)\t— single bucket —\t\t...\nINTR (Interest)\t
    — single bucket —\t\t...\nView more\n\n¹ Federal balances are written under the
    FED funding code only for PC 80/83 and D15U special cases; for all other program
    codes they are split between UCX and UCFE using the UCFE-as-percent-of-Federal
    ratio.\n\nOnly buckets with a positive balance produce an output record. The balance
    is then multiplied by the BUCKET-SIGN to produce the signed amount written to
    SEG8FILE.\nDXCRD88E.md\nDXCRD88E.md\n\nPart 5 — Federal Amount Splitting (UCX/UCFE)\n\
    \nThe routing of Federal refund balances depends on the program code :\nDXCRD88E.md\n\
    \nDXCRD88E Federal Balance Routing\n\nCondition\n\n\t\n\nRouting\n\n\t\n\nFunding
    Code(s)\n\n\nPC 80 or 83\tDirect — no split\tFED\nD15U + specific PCs (01,04,08,09,15,16,17,70,71,76,80,83,84,90)
    with Fed amounts > 0\tBypass split — straight FED processing\tFED\nAll other PCs\t
    Split using UCFE-as-%-of-Federal ratio\tUCFE (proportional share) + UCX (remainder)\n\
    PC 30 special case\tUCX output even when UCX% = 0, if UCFE amount is zero\tUCX\n\
    View more\n\nThe UCFE ratio is computed as:\n\nUCFE-as-Pct-of-Fed = UCFE Claim
    % ÷ Federal Claim % (rounded)\n\nFor each fraud type (Fraud, Non-Fraud, Agency
    Error):\n\nUCFE amount = Federal Balance × UCFE-as-Pct-of-Fed → written with funding
    code UCFE\nUCX amount = Federal Balance − UCFE amount → written with funding code
    UCX\n\nIf no UCFE was allocated (UCFE Claim% = 0), the full Federal balance goes
    to UCX.\nDXCRD88E.md\n\nPart 6 — Safety Checks and Error Processing\nEmpty Bucket
    Validation: After processing all 20 funding categories for a valid B (Before)
    or I (Insert) record (excluding transaction code D070), if zero output records
    were written, the program abends with error code 800. This guards against data
    integrity issues.\nDXCRD88E.md\nDXCRD88E.md\nBad Record Processing (1301-BAD-IMAGE-PROC):
    For rejected records, all 20 amount-due fields (not balances) are multiplied by
    BUCKET-SIGN and written to DB89FILE along with SSN, Program Code, Claim Date,
    Before/After Byte, Transaction Code, Local Office, all four claim percentages,
    and the specific error message.\nDXCRD88E.md\nBalance Reset: All 20 balance fields
    are zeroed after each record to prevent carry-over.\nDXCRD88E.md\nDXCRD88E.md\n\
    Scope Caveat\n\nThis describes the DXCRD88E program as documented in its program
    analysis. It covers only the DB08 reformatting step — the upstream CDT file extraction
    and downstream report programs (DXERD801–DXERD804) that consume SEG8FILE are separately
    documented. The business meanings of individual program codes (e.g., what \"Program
    Code 10\" or \"Program Code 43\" represents) are not defined in this program's
    source — those definitions live in operational reference data or policy documentation
    outside the knowledge base.\n\nWhat would you like to explore next?\n\nDownstream
    report programs\n\nCompare DB08 vs DB09 processing\n\nD15U special cases deep
    dive"
