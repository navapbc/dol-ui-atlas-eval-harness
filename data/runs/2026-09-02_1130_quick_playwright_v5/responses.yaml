- id: v5-Q1
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThe daily certification
    extracts process — which reads both the LOOPPAY and NOPAY backup files — is run
    by job L2DCWEXR, classified under system code CWE1 (Daily Process). It has a restart
    criticality of 1 (highest). Below is the complete step-by-step breakdown.\nL2DCWEXR.md\n\
    L2DCWEXR.txt\n\nJob L2DCWEXR — Step-by-Step Flow\nL2DCWEXR Job Step Sequence\n\
    \nStep\n\n\t\n\nStep Name\n\n\t\n\nUtility / Program\n\n\t\n\n...\n\n\n1\tRECALDSN\t\
    IEFBR14\t...\n2\tCLEANUP1\tIEFBR14\t...\n3\tCOPYVPAY\tIDCAMS REPRO\t...\n4\tSORTVPAY\t\
    SORT\t...\n5\tCOPYNPAY\tIDCAMS REPRO\t...\n6\tSORTNPAY\tSORT\t...\n7\tCLEANUP2\t\
    IEFBR14\t...\n8\tDLYCWEXR\tDXCBDA2R (COBOL)\t...\n9\tCOPYCWER\tIEBGENER\t...\n\
    View more\nOutput Files Produced by DXCBDA2R (Step 8)\n\nThe COBOL program DXCBDA2R
    evaluates each LOOPPAY and NOPAY transaction against the DATECARD processing date
    and routes them into these categorized audit files :\nL2DCWEXR.md\n\nADTPRVWK
    — Previous week's pay-period transactions\nADTD0629 — Transactions with Deduction
    Code 0629\nADTD0928 — Transactions with Deduction Code 0928\nADTONEWK — One-week
    pay cycle transactions\nADTTWOWK — Two-week (bi-weekly) pay cycle transactions\n\
    ADTCWE14 — Current Week Earnings over a 14-day period\nADTNEARN — Newly calculated/adjusted
    earnings\nADTWEARN — Standard weekly earnings\nADTLPAYS — Last/final pay transactions
    (e.g., termination pays)\nVOIDI1FL — Voided/reversed payment transactions\nBYPASSFL
    — Transactions intentionally bypassed\nDAILYREP — Formatted Daily Audit Report
    (132-byte wide)\n\nAfter the job completes, the Daily Certification Extracts Report
    is automatically emailed to four DOL recipients (Ronald Marino, Gregory Castellani,
    Jon Christiansen, Edward Kwiatkowski) with a CC to the DIT-LOOPS distribution
    list.\nL2DCWEXR.md\n\nConditional Execution Logic\n\nSteps 3–6 and 8–9 are conditional:
    they only run if every preceding step returned RC=0. Steps 1, 2, and 7 (RECALDSN,
    CLEANUP1, CLEANUP2) run unconditionally, ensuring cleanup happens even if earlier
    steps failed.\nL2DCWEXR.md\n\nImportant: Related but Separate — NOPAYSUP\n\nThe
    knowledge base also documents a separate program called NOPAYSUP, which is not
    a step inside L2DCWEXR. NOPAYSUP runs after program DXCBDSUP in a different execution
    context and performs certification suppression — it compares LOOPPAY and NOPAY
    records by CWE (Current Week Ending) dates and flags the less-current record with
    suppression code '07'.\nNOPAYSUP.txt\nNOPAYSUP.md\n This is an upstream process
    that feeds into the files L2DCWEXR later reads.\n\nWhat would you like to explore
    next?\n\nHow does DXCBDA2R categorize transactions in DAILY mode?\n\nWalk me through
    the NOPAYSUP suppression process\n\nWhat are the restart/recovery procedures for
    L2DCWEXR?"
- id: v5-Q2
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nGood news —
    the program and job both exist in the knowledge base, but I need to flag an important
    name correction first.\n\nName Correction: DXCBO98B, Not DXCB098B\n\nYour runbook
    says DXCB098B (with a zero), but the actual program name in both the JCL source
    (ZUMDA2R1.txt) and the COBOL source/analysis (DXCBO98B.txt, DXCBO98B.md) is DXCBO98B
    — that's the letter O, not zero. The JCL step is:\n\n//DXCBO98B EXEC  PGM=DXCBO98B,COND=(0,NE)\n\
    \n\nIf the runbook has a typo, it's worth correcting to avoid confusion during
    abend research or load-library lookups.\nZUMDA2R1.txt\n\nWhat DXCBO98B Does —
    Overview\n\nDXCBO98B is a batch COBOL program that converts NOPAY Electronic Benefits
    (EB) records (281-byte, LRECL=281) into PAYVSAM format (360-byte, LRECL=360).
    It runs as step DXCBO98B in job ZUMDA2R1 and only executes when all prior steps
    return RC=0 (COND=(0,NE)).\nZUMDA2R1.md\nDXCBO98B.md\n\nI/O Files\nDXCBO98B I/O
    Files\n\nDD Name\n\n\t\n\nDataset\n\n\t\n\nLRECL\n\n\t\n\n...\n\n\nINFILE\tLAK2LDXP.ZUMDA2R1.MAIL.NOPAYEB.DTL\t\
    281\t...\nOUTFILE\tLAK2LDXP.ZUMDA2R1.MAIL.VSAMPAY.DTL\t360\t...\nView more\nProcessing
    Logic — Step by Step\n\nThe program follows a simple read → map → write loop :\n\
    DXCBO98B.md\n\nOpen files — Opens INFILE (NOPAY) for reading and OUTFILE (PAYVSAM)
    for writing.\nRead first record — Primes the loop; if EOF immediately, skips to
    step 12.\nMap claimant identity — Transfers NOPAY-SSN → EB-SSN, NOPAY-PC → EB-PC,
    NOPAY-DOC → EB-DOC.\nMap geographic/location fields — ZIP-5, ZIP+4, Responsible
    Local Office, Local Office.\nMap dates & time — CWE Dates 1–4, Date Entered System,
    Time of Entry → EB-TIME-OF-CERT.\nMap terminal/operator — Entry Terminal ID →
    EB-TERMINAL-ID-CERT; Entry Operator ID → EB-OPERATOR-ID-CERT.\nInitialize decertification
    & check defaults — All set to zeroes or spaces (Pseudo Check Number, Actual Check
    Number, Date Paid, Check Amount, Void Indicator = 0, De-cert Terminal = spaces,
    De-cert Operator = 0, De-cert Time = 0).\nMap financial fields — WBR, WBA, Claim
    Balance, Earnings (CWE1 & CWE2), Pensions (CWE1 & CWE2), Other Amount, Gross Amount,
    Integrity Bytes = zeroes.\nMap work-week fields — Work-week earnings and indicators
    for CWE1 & CWE2.\nMap health/offset/UI-transfer — Health Amount, Offset CWE1 &
    CWE2, Transitional UI Pay 1 & 2.\nReformat claimant name — Input: LASTNAME/FIRSTNAME
    MIDDLENAME → Output: FIRSTNAME MIDDLENAME LASTNAME using UNSTRING with / and space
    delimiters. Stored in EB-FIRST-MIDDLE-LAST-NAME.\nDXCBO98B.txt\nDXCBO98B.md\n\
    Reformat address — Input STREET/CITY in NOPAY-ADDRESS-SEG01-FORMAT → EB-ADDRESS-LINE1
    (street) and EB-ADDRESS-LINE2 built as CITY STATE ZIP.\nDXCBO98B.md\nMap remaining
    fields — State code, Suppression Code → EB-CERT-SUPPRESSION; defaults ERI Code
    = 0, Cert Code = spaces; income tax withheld/taxable for CWE1 & CWE2; tax-year
    indicators and totals (3 years); SEA indicators CWE1 & CWE2; Print Indicator.\n\
    Set policy defaults — EB-NME-FINANCIAL-INST = spaces; EB-PAYMENT-TYPE-IND = '3'
    (non-check payment type, always).\nDXCBO98B.md\nCleanse addresses — Replace all
    low-value (X'00') characters in EB-ADDRESS-LINE1 and EB-ADDRESS-LINE2 with spaces.\n\
    Write output record — Writes the 360-byte EB-RECORD to OUTFILE; increments NUM-TOT-OUTPUT.\n\
    Read next / loop — Reads next INFILE record, increments NUM-INPUT; loops back
    to step 3 until EOF.\nDisplay summary — Prints \"E.B. records converted to payvsam\"\
    \ banner with TOTAL INPUT RECORDS and TOTAL OUTPUT RECORDS.\nClose files — Closes
    both files and terminates.\nKey Policy Rules (Hardcoded Defaults)\n\nThese values
    are always set regardless of input content :\nDXCBO98B.md\n\nPayment Type Indicator
    = '3'\nCheck Amount = 0\nActual Check Number = 0\nDate Paid = 0\nPseudo Check
    Number = 0\nVoid Indicator = 0\nFinancial Institution Name = spaces\nERI Code
    = 0\nCertification Code = spaces\nAll de-certification fields = zeroes/spaces\n\
    Where It Sits in Job ZUMDA2R1\n\nDXCBO98B runs on the EB mail processing branch
    of the job, immediately after the INCLEB sort step selects records with the EB
    indicator in range 100–199 (positions 217–218). The converted output (MAIL.VSAMPAY.DTL)
    feeds downstream mail and payment processing. It is not on the main check-generation
    path (that goes through NOPAYADD → VERFYNO2 → UIMI0441).\nZUMDA2R1.md\n\nWhat
    would you like to explore next?\n\nShow me all 16 steps of ZUMDA2R1\n\nBuild a
    complete field-mapping table for DXCBO98B\n\nWhat reads the VSAMPAY output downstream?"
- id: v5-Q3
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThe knowledge
    base does have detailed documentation on LOJ4S200, but I need to flag a couple
    of corrections to the engineer's note before diving into the logic.\n\nCorrections
    to the Engineer's Note\n\nLOJ4S200 is a program name, not a transaction ID. The
    CICS transaction associated with this program is LOJ4. LOOPS naming convention:
    LOJ*S200 names are COBOL programs in conversation S200; the 4-character transaction
    IDs are LOJ1, LOJ4, etc.\n\nLOJ4S200 is not an entry point — it's a sub-function
    reached from LOJ1S200. The documented entry point to the stimulus inquiry subsystem
    is program LOJ1S200 (transaction LOJ1), which presents the Stimulus Claimant Menu
    (Screen 820). LOJ4S200 is reached only when the user selects Option 3 on that
    menu, after SSN validation passes. Control is transferred via XCTL (no terminal
    context).\nLOJ1S200-cbl.json\n\nIt handles refund summary inquiries, not general
    \"stimulus payment\" inquiries. The documented title is Refund Summary Inquiry
    (Screen 824), which is one of six sub-functions under the stimulus menu — not
    a catch-all payment inquiry.\nLOJ4S200-cbl.html\n\nProgram LOJ4S200 — Refund Summary
    Inquiry (Screen 824)\n\nHere is the full documented logic (source: LOJ4S200-cbl.html
    and LOJ4S200-cbl.json):\n\nEnvironment\nExecution: Online CICS\nDatabase: DB2\n\
    MQ Calls: None\nModule Type: Main/driver module\nScreen Map: LMAP824\nDB2 Table:
    UIMT_STIM_REFUNDS\nProcessing Flow\n\nThe program operates in two states — Initial
    (first-time display) and Continue (user interaction loop) :\nLOJ4S200-cbl.json\n\
    \nInitial State (screen state = 0 or 1):\n\nSession Validation — Checks communication
    area length > 7; if invalid, returns immediately without processing.\nLOJ4S200-cbl.html\n\
    Screen State Routing — If state is 0 (uninitialized), sets it to 1; routes to
    initial processing.\nLOJ4S200-cbl.json\nSSN Formatting — Retrieves SPAD-SSN-DB
    from the session, splits into WS-SSN1/WS-SSN2/WS-SSN3, assembles as XXX-XX-XXXX
    into screen field SSNO.\nLOJ4S200-cbl.json\nRefund Data Retrieval — Executes a
    DB2 SELECT against UIMT_STIM_REFUNDS using the claimant's SSN (IDN_SSN), fetching
    AMT_TOT_REF_DUE and AMT_TOT_REF_PAID.\nLOJ4S200-cbl.json\nNo-record handling —
    If no row found, sets error flag MES-AP-ERRS = 'Y', positions cursor on option
    field, invokes READ-T200 to display error message 0200 (\"no data available for
    SSN\").\nLOJ4S200-cbl.json\nAmount display — If found, moves amounts to HOLD-TOT-AMT-DUE
    → TOTAL-AMT-DUEO and HOLD-TOT-AMT-PAID → TOTAL-AMT-PAIDO for currency-formatted
    display.\nLOJ4S200-cbl.json\nScreen send — Sends full map LMAP824 with ERASE,
    sets screen state to 2 (Continue), returns to transaction LOJ4 awaiting user input.\n\
    LOJ4S200-cbl.json\n\nContinue State (screen state = 2):\n\nReceive input — Reads
    LMAP824 map, captures OPT-INPUTI (option) and EIBAID (function key), clears message
    fields (APMSG1O, APMSG2O, BRCMSGO).\nLOJ4S200-cbl.json\nOption numeric validation
    — If OPT-INPUTI is not numeric, clears the display field.\nLOJ4S200-cbl.json\n\
    Function key validation — Accepts only ENTER or PF1. PF1 sets option to '01'.
    Any other key → clears option, sets OPT-INPUTL = -1 (cursor position), routes
    to error handler.\nLOJ4S200-cbl.json\nOption range validation — If option > 24,
    clears and redisplays. If option is within 1–24 but not a recognized navigation
    option for this screen, clears and shows error.\nLOJ4S200-cbl.json\nNavigation:
    PF1 / Option 01 — Records 'LOJ4S200' as prior entry (APL-PRIOR-CCT-ENTRY), resets
    screen state to 1, transfers control back to LOJ1S200 (menu).\nLOJ4S200-cbl.json\n\
    Redisplay: ENTER with blank/00 — Maintains state at 2, resends LMAP824, awaits
    further input.\nLOJ4S200-cbl.json\nWhere LOJ4S200 Fits — Stimulus Inquiry Screen
    Map\n\nFor context, LOJ1S200 (the menu) routes to six sub-function programs :\n\
    LOJ1S200-cbl.json\n\nLOJ1S200 Stimulus Claimant Menu Navigation\n\nMenu Option\n\
    \n\t\n\nTarget Program\n\n\t\n\nScreen\n\n\t\n\n...\n\n\n1\tLOJ2S200\t(Claimant
    Detail)\t...\n2\tLOJ6S200\t821\t...\n3\tLOJ4S200\t824\t...\n4\tLOJ6S200\t821\t\
    ...\n5\tLOJ9S200\t(unknown)\t...\n6\tLOJ7S200\t826\t...\nView more\n\nSo the engineer's
    note likely meant: \"Option 3 on the LOJ1 stimulus menu invokes program LOJ4S200
    for refund summary inquiries.\" It's worth updating the runbook to reflect the
    correct transaction ID (LOJ4), the correct role (sub-function, not entry point),
    and the specific scope (refund summary, not general payment inquiry).\nLOJ4S200-cbl.html\n\
    LOJ1S200-cbl.json\n\nWould you like to explore further?\n\nPull up the LOJ1S200
    menu program details\n\nShow me LOJ7S200 (Screen 826) logic\n\nShow me LOJ6S200
    (Screen 821) logic"
- id: v5-Q4
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nYes — in the
    documented programs, the CWE date is always a Saturday, and this is enforced at
    runtime in code, not just convention. The knowledge base shows both active enforcement
    (code that checks the value and rejects violations) and derivation by construction
    (code that computes CWE so it lands on Saturday). Here's the full picture from
    the documented programs.\n\nRuntime Enforcement (Rejects Non-Saturday CWE Dates)\n\
    \nThese programs actively check day-of-week and reject or abort if CWE ≠ Saturday.
    These are the ones you can point to as enforcement:\n\nPrograms That Enforce CWE
    = Saturday At Runtime\n\nProgram\n\n\t\n\nType\n\n\t\n\nMechanism\n\n\t\n\n...\n\
    \n\nDXCA360C\tCICS (Screen A252)\tCalculates DOWSUB for entered CWE date; checks
    DOWSUB = 7\t...\nDXCA016S\tCICS (Claim Transfer)\tCalculates day-of-week for entered
    CWE date; checks DOWSUB = 7\t...\nDXCP028S\tCICS (Claim Period Processing)\tValidates
    both CWE start and end dates are Saturday\t...\nWWCP028S\tCICS (Web Claim Period)\t
    Calculates DOWSUB for CWE Hold Date; checks = 7\t...\nView more\n\nThe strongest
    enforcement points you can cite are :\nDXCA360C-cbl.json\nDXCA016S-cbl.json\n\
    DXCP028S-cbl.json\n\nDXCA360C — the basic claim data entry screen (A252). If an
    operator enters a CWE that isn't a Saturday, DOWSUB is computed via the date conversion
    routine, and if it's ≠ 7, the field is error-highlighted with error code 9. The
    rule is explicitly documented as \"CWE Date Must Fall on a Saturday\" (Policy
    Rule R-DXCA360C-cbl-00233).\nDXCA360C-cbl.json\n\nDXCA016S — the claim transfer
    screen. Same check, but with the explicit literal message 'CWE DATE MUST BE A
    SATURDAY' displayed to the user.\nDXCA016S-cbl.json\n\nDXCP028S and WWCP028S —
    claim period processing programs. These go further: if either the start or end
    date is not Saturday, the program abends with code 'NSAT' — a hard fatal error,
    no processing occurs, no records are written.\nDXCP028S-cbl.json\nWWCP028S-cbl.json\n\
    \nDerivation by Construction (Computes CWE to Always Be Saturday)\n\nThese programs
    don't reject violations — they ensure the CWE is Saturday by computing it that
    way:\n\nPrograms That Derive CWE As Saturday By Construction\n\nProgram\n\n\t\n\
    \nType\n\n\t\n\nMechanism\n\n\t\n\n...\n\n\nDXCD071S\tCICS (Basic Claim Record
    Update)\tAfter CWE calculation, checks day-of-week; if not Saturday, advances
    forward to next Saturday\t...\nDXCBDSUP\tBatch (Daily)\tCalculates Julian day
    number, then adjusts backward to nearest preceding Saturday for CWE alignment\t\
    ...\nLO99SBLD\tCICS (Web Payment)\tSets CWE1 from claim record (described as \"\
    Saturday end date\"), derives week start as CWE − 6 days (= Sunday)\t...\nLOAASBLD\t
    CICS (Web Benefit Payment)\tRTW date derived by subtracting 5 days from CWE-1,
    which is explicitly stated as \"a Saturday\" yielding Monday\t...\nUIMI0443\t\
    Batch (Daily)\tDerives week FROM date as CWE − 6 days, with comment \"the start
    of the week is always 6 days before the ending Saturday\"\t...\nLOICSBLD\tCICS
    (Web Certification)\tAssigns C-CWE1 from DB, then C-CWE2 = C-CWE1 + 7 (preserves
    Saturday alignment)\t...\nView more\n\nKey example: DXCD071S is the auto-correction
    program. It evaluates the day-of-week after all CWE calculations and, if the result
    is not a Saturday, it advances the date forward to the next Saturday.\nDXCD071S-cbl.json\n\
    \ This is a belt-and-suspenders approach on top of the input validation.\n\nSummary\n\
    \nThe Saturday rule is both convention and enforced code, in the documented programs:\n\
    \nInput paths (DXCA360C, DXCA016S) validate at data entry and reject non-Saturday
    dates with error messages.\nProcessing paths (DXCP028S, WWCP028S) validate at
    execution time and abend on violation — the hardest possible enforcement.\nCalculation
    paths (DXCD071S, DXCBDSUP) derive CWE to always land on Saturday by construction,
    and DXCD071S additionally auto-corrects if it doesn't.\n\nCoverage caveat: This
    is bounded by the documented programs in the knowledge base. Programs, jobs, or
    streams outside this coverage may handle it differently, so a universal claim
    (\"every CWE in the system is always Saturday\") cannot be confirmed from the
    knowledge base alone. But within the documented code, the pattern is consistent
    and actively enforced — not just assumed.\n\nWould you like to dig deeper into
    any of these?\n\nDXCD071S auto-correction logic\n\nBatch Saturday alignment in
    DXCBDSUP\n\nDay-of-week calculation mechanism"
- id: v5-Q5
  answer: "ENGINEERING ONBOARDING SPECIALIST (V2)\nCompleted 1 step\n\nThe knowledge
    base does not have a process documented by the name \"yearly SOIL control-card
    update.\" I searched for it specifically and could not match that name to a documented
    job, scheduled stream, or operator procedure. Let me tell you what the knowledge
    base does document about SOIL-related control cards and annual date processing,
    so you can determine if one of these is what you're looking for.\n\nWhat IS Documented\n\
    1. The DATECARD Program — Daily Date Generation (Including Annual Dates)\n\nThe
    batch program DATECARD generates and writes 8 date values to an output file (LAK2LDXP.PROD.CNTLLIB(DATECARD)),
    and it auto-calculates the annual boundaries each time it runs :\nDATECARD.md\n\
    \nTable\n\nSlot\n\n\t\n\nDate Calculated\n\n\t\n\nHow\n\n\n1\tToday's date\tSystem
    date or input override\n2\tNearest Wednesday (week-end date)\tJulian arithmetic
    against 1969 epoch\n3\tFirst day of current month\tMM=current, DD='01'\n4\tLast
    day of current month\tMonth-end table + leap-year check\n5\tQuarter begin date\t
    Quarter calendar table lookup\n6\tQuarter end date\tQuarter calendar table lookup\n\
    7\tFirst day of current year\tMM='01', DD='01' → January 1st\n8\tLast day of current
    year\tMM='12', DD='31' → December 31st\nView more\n\nSlots 7 and 8 are the annual
    begin/end dates. When the DATECARD program runs on January 2nd, those slots automatically
    flip to the new year's boundaries. The slots accept overrides — if an operator
    pre-populates a slot with a real date (not the placeholder 'MMDDYY'), the program
    uses it as-is instead of calculating.\nDATECARD.md\n\n2. How Batch Programs Consume
    the Annual Dates\n\nDownstream programs (e.g., DXCB236E, DXCB245E, DXCB165U, DXCRD28R,
    and the SOIL processing program DXCRR05E) all read the B040-DATE-CONTROL-CARD
    from SYSIN, which carries the full set of 8 dates — including the Annual Begin
    Date and Annual End Date. These are used as reference boundaries for annual period
    processing, year-based reporting, and YTD accumulation.\nDXCB236E.md\nDXCB165U.md\n\
    DXCRD28R.md\n\n3. Operator Setup Instructions (from JCL Comments)\n\nThe JCL source
    for ZUMDSRR1 (a SOIL-related batch job) includes explicit operator setup instructions
    :\nZUMDSRR1.txt\n\nSETUP INSTRUCTIONS\n CONTROL CARD:\n   LAK2LDXP.PROD.CNTLLIB(DATECARD),DISP=SHR\n\
    \   - MAKE SURE THAT THE DATECARD IS SET UP\n     WITH THE RUN DATE THAT YOU NEED.\n\
    \n\nThis tells the operator to verify the DATECARD member contains the correct
    run date before submitting the job.\n\n4. FEDPGM — CICS Control Card Screen Update\n\
    \nThe CICS program FEDPGM provides an online screen (MAP3) that allows an operator
    to manually update a control card record. It validates all fields for cleared/erased
    conditions, performs date range validation (year must be between current year
    and current year + 1, month between 1 and 12), and on success rewrites the record
    with the confirmation message: 'THE RECORD HAS BEEN CHANGED AND NOW CONTAINS THE
    DATA ON THE SCREEN'.\nFEDPGM-cbl.json\n\n5. SOIL Year-to-Date Field on Claim Records\n\
    \nSeparately, the SOIL YTD Recovered Amount field (DB01-AMT-YTD-RECOVERED-SOIL)
    accumulates throughout the year as SOIL transactions are processed by DXCRD03U.\n\
    DXCRD03U.md\n Screen A269 in DXCA360C allows operators to manually edit this field.\n\
    DXCA360C-cbl.json\n\nWhat's Missing\n\nThe knowledge base does not document:\n\
    \nA specific annually scheduled job whose sole purpose is \"update the SOIL control
    card for the new year\"\nA runbook or checklist for year-end SOIL control-card
    rollover\nWhether the DATECARD program is re-run manually at year-end, or whether
    the annual dates auto-roll because DATECARD runs daily as part of the normal schedule\n\
    \nThe DATECARD program by design computes the annual begin/end from the current
    system date each time it runs — so if it runs daily, the year-end rollover would
    be automatic. But whether it's triggered daily by CA-7, or manually at year-end,
    or both, is not documented in the knowledge base coverage.\n\nIf you have a specific
    job name or screen number for the process you're thinking of, I can search for
    it directly. It's also possible this lives in operational runbooks or the Monthly
    CA-7 schedule, which are outside the current knowledge base coverage.\n\nWould
    you like me to dig further into any of these?\n\nSearch by a name/number I provide\n\
    \nMore detail on the FEDPGM control card screen\n\nMap the DATECARD downstream
    dependencies"
