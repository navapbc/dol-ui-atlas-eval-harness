    PROD.CNTLLIB(DATECARD)\t—\t—\tOperations\tVERFYUI2, UIMI0440, DXCB103U\tControl
    card, maintained externally\n7. Common Failure Scenarios and What To Do\n\nSymptom\n\
    \n\t\n\nLikely Cause\n\n\t\n\nAction\n\n\nTEST1 fails (RC ≠ 0) — all downstream
    steps flush\tNONDD.DTL is empty or missing\tCheck ZUMDA1R2 — did it run? Did UIMI0143
    produce the NONDD file?\nVERIFYUI fails\tDate mismatch or corrupt records in NONDD\t
    Check the VERFYUI2 verification report (SYSOUT=J). Verify DATECARD is current.\n\
    UIMI0063 integrity warning in sysout\tCHECK INTEGRITY PROBLEM EXISTS!\tAdvisory
    only — UIMI0440 does NOT stop. Investigate the input LoopPay records, but the
    checks were still generated.\nEMPTYIT runs (creates empty UI.CHKS.DTL)\tUIMI0063
    step returned RC ≠ 0\tThe empty file exists so BACKUP1/BACKUP2 don't fail. Investigate
    why UIMI0440 failed (DB2 plan issue? VSAM file locked?).\nDXCB103U ABENDs with
    INVALID RETURN CODE ON OPEN FOR FILE REPRINT\tUIVSAM cluster unavailable or locked\t
    Verify CICS region CICJPAF is down. Check if another job has an exclusive lock
    on the VSAM.\nDXCB103U ABENDs with SEVERE PROBLEM WITH THE REPRINT5 FILE\tUIVSAM5
    write failure — possibly full, locked, or corrupt\tCheck VSAM catalog for UIVSAM5
    space. May need IDCAMS VERIFY or a cluster redefine.\nRECORDS-READ ≠ RECORDS-WRITTEN
    in DXCB103U output\tMid-run write failure\tThe program would have ABENDed with
    a message. Check sysout for the actual file status.\n8. Historical Change Log
