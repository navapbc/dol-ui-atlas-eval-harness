    ZUMDA1R2.txt\n A few things to flag for your replacement:\n\nKey Takeaways for
    the New Engineer\n\nThree-job chain: ZUMDA1R2 (channel routing) → ZUMDA1R1 (check
    generation + backup) → the DXCB103U step at the end of ZUMDA1R1 (reprint accumulation).
    All gated by COND=(0,NE) — any upstream failure skips everything downstream.\n\
    ZUMDA1R1.txt\nZUMDA1R1.md\n\nUIMI0440 is the heavy lifter — it's the DB2/COBOL
    program that formats checks, writes to the REPRINT VSAM, and produces the 806-byte
