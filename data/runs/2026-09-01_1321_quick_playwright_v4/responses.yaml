- id: v4-Q1
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nGood question —
    these are two distinct DB2 tables in LOOPS, and it's important to clarify that
    the knowledge base does not document a process named \"new-hire crossmatch\" that
    ties them together. Your replacement-system spec may be referencing a design that
    sits outside the documented LOOPS batch flows. Here's what the knowledge base
    does document about each table and the jobs that touch them.\n\nOTDUIMP.UIMT_RSA_NONMON
    — RSA Non-Monetary Transactions\n\nThis table stores Reemployment Services and
    Eligibility Assessment (RSA) non-monetary UI claim records. The documented columns
    (nine fields extracted by L2UDB020) are :\nL2UDB020.md\nL2UDB020.md\n\nIDN_SSN
    — Claimant Social Security Number\nTMS_RECORD_LOAD — Record Load Timestamp\nCDE_PROGRAM_UIB
    — UI Benefit Program Code\nDTE_CLAIM_UIB — UI Benefit Claim Date\nIDN_HIST — Historical
    Record Identifier\nDTE_PROOFING — Proofing Date\nIDN_LOGON_ID — Processing user's
    Logon ID\nIDN_USERNAME — Processing user's Username\nTMS_RECORD_UPDT — Record
    Last Update Timestamp\n\nBatch jobs documented against this table:\n\nL2UDB020
    (READ) — Extracts the entire table (no filters, WITH UR) into a tilde-delimited
    CSV (LAK2LDXP.L2UDB020.NONMON.CSV), then sorts by SSN into LAK2LDXP.L2UDB020.NONMON.SORTED.CSV
    (122-byte fixed records).\nL2UDB020.md\nL2UDB020.txt\nL2FTPRS2 (downstream) —
    FTPs the sorted CSV file to a Labor server. The JCL explicitly notes the CSV \"\
    IS FLAT FILE COPY OF DB2 TABLE UIMT_RSA_NONMON\".\nL2FTPRS2.txt\nL2FTPRS2.txt\n\
    \nNote — write side: The knowledge base does not document which job or program
    writes to UIMT_RSA_NONMON. There is a separate but similarly named table, OTDUIMP.UIMT_NONMON_DATA,
    which is populated by CICS subprogram UIMI0466 (and its batch counterpart UIMB0466)
    with nonmonetary determination details (examiner number, issue code, determination
    date, redetermination, etc.).\nUIMI0466.md\nUIMB0466.md\n These are two different
    tables — confirm with an SME which one your spec intends as the source-of-truth
    for the replacement pipeline.\n\nOTDUIMP.UIMT_SG01_CLAIMANT — Core Claimant and
    Claim Data\n\nThis table holds core claimant identity and claim-level data. The
    documented columns (from COBOL source and JCL) include :\nsrc_cob_ABENDBP-W...\n\
    bre_cob_2_UIMB014...\n\nSG01_IDN_SSN — Claimant SSN\nSG01_CDE_PROGRAM_UIB — UI
    Benefit Program Code\nSG01_DTE_CLAIM_UIB — UI Benefit Claim Date\nSG01_INVALID_CLAIM
    — Invalid Claim indicator\n\nThe flow diagram in L2PUA003.md labels it \"Core
    Claimant and Claim Data\" and shows it alongside three other DB2 tables (UIMT_SG11_NONMON,
    UIMT_SG02_PAYMENT, UIMT_IDENTITY_THEFT_SSN).\nL2PUA003.md\n\nBatch jobs documented
    against this table:\n\nL2PUA003 (READ) — PUA (Pandemic Unemployment Assistance)
    Fraud Data Extract. Reads UIMT_SG01_CLAIMANT (plus UIMT_SG11_NONMON, UIMT_SG02_PAYMENT,
    and UIMT_IDENTITY_THEFT_SSN), unloads fraud candidate records, reformats them,
    and FTPs them to the claims server.\nL2PUA003.md\nL2PUA003.txt\nL2PUA003.txt\n\
    COBOL program in ABENDBP-WS1750R.txt (READ) — Opens a cursor (TABLE_007) against
    UIMT_SG01_CLAIMANT and fetches SSN, program code, claim date, and invalid-claim
    flag.\nsrc_cob_ABENDBP-W...\nbre_cob_2_UIMB014...\n\nNote — write side: The knowledge
    base does not document which batch job or online program inserts/updates rows
    in UIMT_SG01_CLAIMANT.\n\nImportant Distinction: DB2 Table vs. File-Based SG01
    Pipeline\n\nThe knowledge base also documents an extensive file-based \"SG01\"\
    \ processing pipeline inside the Payroll Reissuance job D2PAD168 (and its counterpart
    D2PAD139). That pipeline works with 659-byte flat-file SG01 segment records derived
    from document conversion — involving steps like SG01FLDS, TDCBD17L, SORT22, and
    dozens of SG01 offset split/merge passes.\nD2PAD168.md\n This is not the same
    as the DB2 table UIMT_SG01_CLAIMANT. The file-based pipeline processes payment
    reissuance offsets; the DB2 table stores claimant claim-level identity data. Your
    spec's \"SG01 pipeline\" should be verified against the replacement-system design
    docs to determine which one it means.\n\nSummary\nDB2 Tables And Batch Job Summary\n\
    \nDB2 Table\n\n\t\n\nPurpose\n\n\t\n\nDocumented Read Jobs\n\n\t\n\n...\n\n\n\
    OTDUIMP.UIMT_RSA_NONMON\tRSA non-monetary UI claim transactions\tL2UDB020 (extract→CSV);
    L2FTPRS2 (FTP downstream)\t...\nOTDUIMP.UIMT_SG01_CLAIMANT\tCore claimant identity
    and claim data\tL2PUA003 (PUA fraud extract); COBOL ABENDBP/WS1750R cursor read\t\
    ...\nView more\n\nBottom line: In the documented LOOPS batch flows, these two
    tables are not connected by any single crossmatch job. The New Hire crossmatch
    jobs (ZLPDN1R0–ZLPDN1R9) read IMS databases (LOPD/LOPX), not these DB2 tables.
    If your replacement-system spec links UIMT_RSA_NONMON entries to an \"SG01 pipeline,\"\
    \ that linkage is either in an undocumented upstream process or is a new design
    in the replacement system — I'd recommend confirming with the crossmatch SME which
    LOOPS process currently provides the join between these datasets.\n\nWould you
    like to explore further?\n\nRSA_NONMON extract pipeline details\n\nSG01_CLAIMANT
    fraud extract details\n\nD2PAD168 SG01 reissuance pipeline\n\nNew Hire crossmatch
    IMS-based jobs"
- id: v4-Q2
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThis is a great
    question for onboarding — the daily new-hire pipeline is one of the larger documented
    batch flows in LOOPS, spanning multiple jobs across file acquisition, deduplication,
    DB2 load, parallel splitting, crossmatching, IMS updates, and refund reporting.
    Here's the end-to-end walkthrough, synthesized from multiple source documents
    across the Daily CA-7 and NewHire knowledge spaces.\n\nThe New Hire Input Record\n\
    \nBefore diving into the jobs, the input file uses the NEWHIRE copybook layout
    — 320-byte fixed-length records containing :\nNEWHIRE.txt\nNEWHIRE.txt\n\nNH-SSN
    (9 digits) — Claimant/Employee Social Security Number\nNH-LAST-NAME, NH-FIRST-NAME,
    NH-MIDDLE-INIT — Name fields\nEmployee address (line 1, line 2, city, state, ZIP,
    ZIP+4, foreign country code/ZIP)\nNH-DATE-HIRE (8 digits), NH-DATE-BIRTH (8 digits),
    NH-GENDER\nEmployer name, address, state, ZIP, NH-EMPLR-FEIN (9 digits)\n44 bytes
    of filler\nPhase 1 — File Acquisition & Deduplication: L2NHD011\n\nThis is the
    entry point. The file SENDTOUIB.TXT arrives daily from DOL on the MoveIt server.\n\
    L2NHD011.md\nL2NHD011.md\n\nL2NHD011 — File Acquisition And Deduplication Steps\n\
    \nStep\n\n\t\n\nUtility / Program\n\n\t\n\nWhat It Does\n\n\nPREPARE1\tIEFBR14\t
    Deletes leftover sort work file and MoveIt control file from prior run\nTRANS01\t
    EZACFSM1\tDownloads SENDTOUIB.TXT from /HOME/DOL/LOOPS/INBOUND via MoveIt; archives
    a timestamped copy to /HOME/DOL/LOOPS/ARCHIVE; deletes the source file from inbound\n\
    TRANS02\tFTP\tExecutes the MoveIt secure-transfer commands using stored credentials\n\
    SORTCOPY\tSORT (FIELDS=COPY)\tArchives the raw downloaded file into a new GDG
    generation KIPPS001.ZUMDNHU1.DTL(+1) — 320-byte FB records, no transformation\n\
    PREPARE2\tIEFBR14\tDeletes the temporary KIPS1 working copy\nSORTCPY2\tSORT (FIELDS=COPY)\t
    Refreshes KIPS1 working area from KIPS2 staging source\nSORTHIRE\tSORT\tSorts
    the new GDG generation by SSN (positions 1–9, ascending, zoned decimal) → NEWHIRE.SORT.DTL\n\
    DXNHCM29\tDXNHCM29\tReads the sorted file; detects duplicate SSNs using date-sensitive
    rules from DATECARD; produces two GDG outputs: unique records (NEWHIRE.OUT.DTL(+1))
    and duplicates (NEWHIRE.DUP.DTL(+1)) plus an error report\nView more\n\nKey output:
    LAK2LDXP.L2NHD011.NEWHIRE.OUT.DTL(+1) — the deduplicated new-hire file that feeds
    all downstream jobs.\nL2NHD011.md\nL2NHD011.md\n\nPhase 2 — DB2 Load: ZUMDNHU1\n\
    \nThis job loads the deduplicated records into the DB2 table UIMT_NEWHire.\nZUMDNHU1.md\n\
    ZUMDNHU1.md\n\nZUMDNHU1 — DB2 Load Steps\n\nStep\n\n\t\n\nProgram\n\n\t\n\nWhat
    It Does\n\n\nDBLOAD\tUIMI0134 (DB2 plan UIMI0134)\tReads the current generation
    of NEWHIRE.OUT.DTL; validates each record (DOB, hire date, SSN, FEIN, ZIP, state
    code — including leap-year and future-date checks); inserts valid records into
    UIMT_NEWHire with a current timestamp (TMS_RECORD_LOAD); logs errors\nPURGEDSN\t
    IDCAMS\tConditionally purges the KIPPS FTP interface detail file after a successful
    load\nView more\n\nProgram UIMI0134 validates six fields per record: Date of Birth,
    Date of Hire, SSN (numeric), Employer FEIN (numeric), Employee ZIP (numeric),
    and Employee State (against a predefined list including territories). A foreign
    country code overrides an invalid state. Only records passing all six checks are
    inserted.\nUIMI0134.md\n\nPhase 3 — Parallel Split Preparation: L2NHD001\n\nThis
    job prepares both the New Hire records and a consolidated Pay/No-Pay file, then
    splits each into 10 SSN-range partitions for parallel downstream processing.\n\
    L2NHD001.md\n\nL2NHD001 — Parallel Split Steps\n\nStep\n\n\t\n\nUtility / Program\n\
    \n\t\n\nWhat It Does\n\n\nPREPARE1\tIEFBR14\tDeletes 23 prior-run work files (sorted
    NH, sorted PNP, 10 NH splits, 10 PNP splits, combined PNP)\nDXNHCM04\tDXNHCM04\t
    Merges four account-type files (Pay, No-Pay, T4F, TRA) into one unified PAYNOPAY.DTL
    (80-byte records)\nSORTPNP\tSORT\tSorts the merged Pay/No-Pay file by account
    ID (pos 1–9 ascending), then date/sequence (pos 32–39 descending)\nSORTHIRE\t\
    SORT\tSorts the L2NHD011 output (NEWHIRE.OUT.DTL) by account ID (pos 1–9 ascending)
    → SORT.NEWHIRE.DTL\nSPLITNH\tSORT\tSplits the sorted New Hire file into 10 partitions
    (NEWHIRE.SPLIT01.DTL – SPLIT10.DTL) by SSN ranges\nSPLITPNP\tSORT\tSplits the
    sorted Pay/No-Pay file into the same 10 SSN-range partitions (PAYNOPAY.SPLIT01.DTL
    – SPLIT10.DTL)\nView more\n\nThe 10 SSN ranges used for splitting are consistent
    across all split/match jobs :\nL2NHD001.md\nL2NHD001.md\n\nSSN Range Partition
    Boundaries\n\nSplit\n\n\t\n\nSSN Range\n\n\n01\t000000000 – 115502000\n02\t115502001
    – 137444750\n03\t137444751 – 141302200\n04\t141302201 – 144540100\n05\t144540101
    – 148361300\n06\t148361301 – 152052200\n07\t152052201 – 155405800\n08\t155405801
    – 163187500\n09\t163187501 – 249743000\n10\t249743001 and above\nView more\nPhase
    4 — Parallel Pay/No-Pay Crossmatch: ZULDNHR0–ZULDNHR9\n\nThese 10 jobs run in
    parallel — one per SSN split. Each matches Pay/No-Pay records against New Hire
    records using IMS.\n05_job_purpose_in...\nZULDNHR1.md\nZULDNHR1.md\nZULDNHR7.md\n\
    \nEach job (ZULDNHRn) does:\n\nPREPARE — Deletes the prior CMATCH.SPLITnn.DTL
    output file\nMatching — Runs DSNMTV01 with PSB LOPGMPnn, reading PAYNOPAY.SPLITnn.DTL
    + NEWHIRE.SPLITnn.DTL, accessing IMS databases LOPDnnnn and LOPXnnnn\nOutput —
    Produces a combined match file CMATCH.SPLITnn.DTL (479-byte FB records)\nPhase
    5 — Parallel IMS Update: ZULDNHU0–ZULDNHU9\n\nThese 10 jobs consume the match
    output from Phase 4. Each runs DSNMTV01 to process matched new-hire records against
    IMS databases and VSAM reference files (code tables, employee address).\n05_job_purpose_in...\n\
    \nEach job produces:\n\nBPC output files (BPC174 – BPC179) — Benefit Plan Carrier
    transaction files\nBatch journal (BTCHJRL4)\nOutput records and reports for downstream
    processing\nPhase 6 — IMS New Hire Refund Crossmatch: ZLPDN1R0–ZLPDN1R9\n\nThese
    10 jobs run a separate crossmatch path directly from the deduplicated New Hire
    file against IMS claim data. Each is described in JCL as \"NEW HIRE CROSS REF
    MATCH WITH CURRENT FILE AND OFFSET > ZERO\".\n05_job_purpose_in...\n05_job_purpose_in...\n\
    ZLPDN1R1.txt\nZLPDN1R0.txt\nZLPDN1R0.md\nZLPDN1R0.md\nZLPDN1R1.md\n\nEach job
    (ZLPDN1Rn) does:\n\nSCRATCH — Deletes prior-run sort and refund work files\nSRTHIRE
    — Sorts the current generation of NEWHIRE.OUT.DTL, filtering to the job's SSN
    range, ascending by SSN\nDXNHCM02 — IMS DL/I batch program that reads sorted new-hire
    records, looks up claimant data in IMS databases (LOPDnnnn / LOPXnnnn) using DATECARD,
    and produces a New Hire Refund Detail file (NHREFUND.DTL, 170-byte FB records)
    for qualifying participants\nPhase 7 — Refund Reporting: DXCBNHR1 (downstream)\n\
    \nProgram DXCBNHR1 reads the refund detail output and produces two printed reports
    split by refund balance threshold :\nDXCBNHR1.md\n\nOver $2,000 Report — Refund
    balance ≥ $2,000.00\nUnder $2,000 Report — Refund balance > $0 and < $2,000.00\n\
    \nEach report includes: SSN, employee name, address, employer FEIN, hire date,
    claim date, bad-address indicator, and refund balance.\n\nEnd-to-End Flow Summary\n\
    DOL MoveIt Server\n        │\n        ▼\n  ┌─ L2NHD011 ─────────────────────────┐\n\
    \  │  FTP download → Archive → GDG      │\n  │  Sort by SSN → DXNHCM29 dedup \
    \     │\n  │  Output: NEWHIRE.OUT.DTL(+1)        │\n  └───────┬────────────────┬────────────┘\n\
    \          │                │\n          ▼                ▼\n    ZUMDNHU1    \
    \        L2NHD001\n    UIMI0134 →          Merge Pay/NoPay/T4F/TRA\n    DB2 UIMT_NEWHire\
    \    Sort both → Split both ×10\n                              │\n           \
    \         ┌─────────┴─────────┐\n                    ▼                   ▼\n \
    \          ZULDNHR0–9            ZLPDN1R0–9\n           Match PNP vs NH      \
    \ Sort NH per range\n           → CMATCH files        DXNHCM02 vs IMS\n      \
    \              │                   │\n                    ▼                  \
    \ ▼\n           ZULDNHU0–9            DXCBNHR1\n           IMS update        \
    \    Refund reports\n           BPC174–179            (≥$2K / <$2K)\n\nImportant
    Caveats\nThis is a synthesis built from the documented jobs listed above. The
    CA-7 schedule may include additional predecessor/successor jobs not detailed in
    the knowledge base (e.g., the upstream source of the KIPS2 file, or downstream
    consumers of the BPC files).\nThe write side of the UIMT_NEWHire DB2 table is
    now clear: it's program UIMI0134 in job ZUMDNHU1.\nZUMDNHU1.md\nUIMI0134.md\n\
    The knowledge base does not document which job concatenates or merges the 10 ZLPDN1Rn
    refund files before feeding them to DXCBNHR1, or whether DXCBNHR1 reads them individually.\n\
    What would you like to explore next?\n\nNew Hire crossmatch program internals\n\
    \nPay/No-Pay consolidation details\n\nDB2 load validation rules\n\nJob scheduling
    and dependencies"
- id: v4-Q3
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThis is a very detailed
    question, and the documented source code provides a thorough answer. The RTW update
    logic lives in program UIMB0147 (referenced in the knowledge base as both UIMB0147.cbl.md
    and UIMI0147.cbl.md), specifically in procedure 2300-UPDTE-RTW-DB01, which runs
    within the ZULDNHU0–ZULDNHU9 IMS update jobs. Here's the full decision tree, synthesized
    from both source documents.\n\nWhere the Return-to-Work Date Is Stored\n\nThe
    return-to-work date is stored in field DB01-DATE-RETURN-WORK on the Claim Basic
    segment (DB01) of the IMS LOOPDB01 database. The hire date is converted from its
    input YYYYMMDD format to the internal \"F6\" packed date format before being written
    there.\nUIMI0147.md\nUIMB0147.md\n\nImportant Scope Note — Non-TRA Claims Only\n\
    \nThe RTW date update logic in 2300-UPDTE-RTW-DB01 applies only to non-TRA (non-T3)
    source records. For TRA claimants (source code T3), the entire RTW date update
    path is skipped; the program routes directly to the DB2 remarks insertion (3100-INSERT-T3-REMARK)
    into TNPV_CLAIM_REMARKS without touching DB01-DATE-RETURN-WORK.\n\nThe Decision
    Tree (Procedure 2300-UPDTE-RTW-DB01)\n\nThe following decision flow is documented
    in UIMB0147 / UIMI0147 and governs whether the hire date gets written as the RTW
    date :\nUIMI0147.md\nUIMB0147.md\n\nStep 1 — Does an RTW date already exist?\n\
    Check: Is DB01-DATE-RETURN-WORK non-zero?\nIf YES → Skip entirely. No update,
    no remark. The existing RTW date is preserved.\nUIMI0147.md\nStep 2 — Read Additional
    Claim (DB10) segments\n\nIf no RTW date exists, the program reads all Segment
    10 (Additional Claim) child segments under the claimant's claim in IMS using a
    GNP (Get-Next-within-Parent) loop. For each segment it captures:\n\nWhether any
    DB10 segment was found (FOUND-10-SW)\nWhether a valid Date of Additional Claim
    exists — determined by checking whether DB10-FILLER-CHK-10 is spaces (DOA-FOUND-SW)\n\
    The actual date (WS-DATE-ADD-CLAIM) and separation code (WS-DB10-SEP-CODE-ADD)\n\
    Step 3 — Evaluate what was found\nRTW Update Decision Logic For Non-TRA Claims\n\
    \nCondition\n\n\t\n\nAction\n\n\t\n\nReport/Remark\n\n\nRTW already non-zero (DB01-DATE-RETURN-WORK
    > 0)\tSkip — no change to claim\tNone\nNo DB10 segments found (FOUND-10-SW = 'N')\t
    Set DB01-DATE-RETURN-WORK = Hire Date\tNo exception report\nDB10 found, but no
    valid Date of Additional Claim (DOA-FOUND-SW = 'N')\tSet DB01-DATE-RETURN-WORK
    = Hire Date\tNo exception report\nValid Additional Claim Date found, but saved
    Hire Date = 0\tRe-establish parent; do NOT set RTW\tNone\nAdditional Claim Date
    ≤ Hire Date (hire is on or after the additional claim)\tSet DB01-DATE-RETURN-WORK
    = Hire Date\tNo exception report\nAdditional Claim Date > Hire Date (additional
    claim is more recent than hire)\tDo NOT update RTW date\tWrite RTW-Not-Updated
    report entry + insert 'NH RTW NOT UPDATED' remark on claim (IMS DB16 segment)\n\
    View more\nWhen the RTW Date IS Updated\n\nThe hire date is written as the RTW
    date when all of these are true:\n\nNo RTW date already exists on the claim (DB01-DATE-RETURN-WORK
    = 0)\nSource is not T3 (TRA claims are excluded)\nOne of the \"safe\" additional-claim
    conditions holds:\nNo Additional Claim segment (DB10) exists at all, OR\nDB10
    segments exist but none contain a valid Date of Additional Claim, OR\nA valid
    Additional Claim Date exists but it is on or before the Date of Hire\nThe saved
    Hire Date is non-zero (a valid date was received from the new-hire file)\n\nWhen
    these conditions are met, the program converts HM-DATE-HIRE from YYYYMMDD to internal
    F6 format and stores it in DB01-DATE-RETURN-WORK, then issues a REPL call to persist
    the updated claim basic segment in IMS.\nUIMI0147.md\n\nWhen the RTW Date Is NOT
    Updated (and What Happens Instead)\n\nThe RTW date is suppressed when the Date
    of Additional Claim is strictly later than the Date of Hire (WS-DATE-ADD-CLAIM
    > DATE-SAVE). In this case:\n\nThe RPT-RTW-SW flag is set to 'Y'\nThe ZERO-SW
    is set to 'Y' to prevent any downstream zeroing of the RTW field\nAn RTW-Not-Updated
    report entry is written (paragraph 3060-RTW-RPT-NH) containing: SSN, program code,
    DOC, employer FEIN, hire date, first benefit week begin date, employer name, additional
    claim date, and separation code\nA special IMS remark (DB16 segment) is inserted
    on the claim with title 'NH RTW NOT UPDATED' and text:\n\nNEW HIRE DATE OF HIRE:
    [MM/DD/YYYY] WITH [FEIN] [EMPLOYER NAME] NOT UPDATED TO CLAIM BASIC SINCE ADDITIONAL
    DATED [MM/DD/YYYY]\n\nThe business rationale is to prevent recording a return-to-work
    date that predates a subsequent claim filing, which would be contradictory.\n\
    UIMI0147.md\nUIMB0147.md\n\nSummary Flow\nCrossmatch hit arrives (from ZULDNHU0–9
    jobs, program UIMB0147)\n                │\n         Source = T3?\n        ┌───YES──┐\n\
    \        │        ▼\n        │   Skip RTW update entirely\n        │   → Route
    to DB2 TRA remarks\n        │\n        └───NO───┐\n                 ▼\n    DB01-DATE-RETURN-WORK
    > 0?\n        ┌───YES──→ Skip (RTW already set)\n        └───NO───┐\n        \
    \         ▼\n    Read all DB10 (Additional Claim) segments\n                 │\n\
    \    ┌── No DB10 found ──────────→ Set RTW = Hire Date ✓\n    │\n    ├── DB10
    found, no valid DOA → Set RTW = Hire Date ✓\n    │\n    ├── Valid DOA found, Hire=0
    ─→ Skip (no valid date)\n    │\n    ├── DOA ≤ Hire Date ─────────→ Set RTW = Hire
    Date ✓\n    │\n    └── DOA > Hire Date ─────────→ SUPPRESS RTW update\n      \
    \                             Write report + insert\n                        \
    \           'NH RTW NOT UPDATED' remark\n\nImportant Caveats\nThis describes the
    documented logic in UIMB0147/UIMI0147 from the held knowledge base. Other programs
    or CICS screens may also read or write DB01-DATE-RETURN-WORK, but those are outside
    the scope of the new-hire crossmatch flow documented here.\nThe \"F6 format\"\
    \ conversion for the hire date into DB01-DATE-RETURN-WORK is documented but the
    exact byte layout of F6 is not detailed in the retrieved source — it is described
    as an \"internal date format\" conversion. An SME or the date-conversion subroutine
    source would confirm the packed representation.\nWhat would you like to explore
    next?\n\nWhen do the claimant/employer letters get generated?\n\nWalk me through
    the standard crossmatch remark insertion\n\nHow does the TRA/T3 path differ?"
- id: v4-Q4
  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThis is an excellent
    question that gets at a fundamental architecture boundary in LOOPS. The retrieved
    source code tells a clear story, and the answer to your second question — does
    LOOPS compute the weekly pension reduction? — is particularly important for any
    replacement spec.\n\nHow LOOPS Applies a Pension Reduction at Payment Time\n\n\
    At the point a weekly benefit is being paid, the pension reduction is applied
    through a single, universal formula called the AWBA (Adjusted Weekly Benefit Amount)
    calculation. This formula appears identically across every payment-processing
    and reporting program in the held knowledge base:\n\nAWBA = WBA-PAY  minus  PENSION-AMT\n\
    \n\nThis is documented consistently in UIMB0440.md, UIMB0443.md, BALANCE.md, DXCBD10R.md,
    DXCBD06E.md, and DXCBD83R.md\nDXCBD10R.md\nBALANCE.md\nDXCBD06E.md\nDXCBD83R.md\n\
    .\n\nWhere the Pension Amount Lives on a Payment Record\n\nEach payment record
    (the BP88-format VSAM record for pay transactions, or the NOPAYIN-format record
    for no-pay transactions) carries two pre-populated per-week pension fields:\n\n\
    BP88-PENSION-AMOUNT1 — pension deduction for Certification Week Ending period
    1\nBP88-PENSION-AMOUNT2 — pension deduction for Certification Week Ending period
    2\n\nThese fields are already filled in when the payment record reaches the check-printing
    and reporting programs. Every downstream program simply reads them.\nUIMB0443.md\n\
    UIMB0440.md\nDXCBD30R.txt\n\nThe AWBA Zero-Floor Rule\n\nAfter computing AWBA
    = WBA minus PENSION-AMT, a validation rule applies:\n\nIf AWBA < 0 and Program
    Code ≠ 45 → AWBA is floored at zero (no negative benefit is allowed)\nIf AWBA
    < 0 and Program Code = 45 (CWC — Combined Wage Claim Transfer) → the negative
    value is retained as-is. This is a documented policy exception\nCheck Stub and
    Report Display\n\nAt check-printing time (programs UIMB0440, UIMB0441, UIMB0442,
    UIMB0443), the total pension deduction shown on the check stub is simply:\n\n\
    Total Pension Deduction = BP88-PENSION-AMOUNT1 + BP88-PENSION-AMOUNT2\n\n\nThis
    summed value is placed in fields F24-PENSION and F59-PENSION on the check stub.\n\
    UIMB0443.md\nUIMB0440.md\nUIMB0441.md\n\nSpecial Case: Pension Offset Segments\n\
    \nProgram DXCBD40E documents a special \"pension offset segment\" identified by
    CHECK-PART2 = 0099999999. If such a segment has a zero benefit amount (AMT-BEN-PAID
    = 0), it is completely excluded from all downstream processing — no sort key,
    no check register, no bank record, no reports.\nDXCBD40E.md\n\nThe Critical Answer:
    LOOPS Does NOT Compute the Weekly Reduction\n\nIn the documented programs, LOOPS
    never computes a weekly pension reduction from raw pension details. There is:\n\
    \n❌ No lump-sum proration logic\n❌ No conversion from gross monthly/annual pension
    to a weekly offset\n❌ No employer-contribution-percentage calculation\n❌ No pension-type
    routing (periodic vs. lump sum vs. rollover)\n\nEvery program that touches pension
    at payment time — UIMB0440, UIMB0443, BALANCE, DXCBD10R, DXCBD06E, DXCBD83R —
    receives PENSION-AMT (or BP88-PENSION-AMOUNT1/2) as a pre-computed dollar amount
    and simply subtracts it from WBA-PAY.\nDXCBD10R.md\nBALANCE.md\nDXCBD06E.md\n\
    DXCBD83R.md\nUIMB0443.md\n\nWhere the Weekly Amount Originates\n\nThe pension
    amount enters the claim through the Non-Monetary Determination (DB11) segment.
    Program DXCBW30E documents capturing a PENSION-AMT from Segment 11 loop data (LOOPSP11)
    and storing it in the non-monetary output field NPENAMT.\nDXCBW30E.md\n This is
    the result of the determination process — but the computation of that dollar figure
    (from the raw pension details a claimant reports or that a pension source provides)
    is not performed by any program in the held knowledge base.\n\nThis confirms the
    manual process you described: staff determine the weekly pension reduction amount
    outside LOOPS (historically in Excel), then key that computed dollar amount into
    LOOPS via a CICS screen as a non-monetary determination. From that point forward,
    LOOPS carries the pre-computed PENSION-AMT on every payment segment and simply
    applies the AWBA = WBA − PENSION formula.\n\nSummary Flow (Synthesized)\n┌──────────────────────────────────────────────────────┐\n\
    │  OUTSIDE LOOPS (today: manual / Excel)               │\n│  Staff computes weekly
    pension reduction from:        │\n│  - pension type, lump sum, employer %, etc.\
    \          │\n│  Result: a dollar amount (e.g., $47.00/week)         │\n└───────────────────┬──────────────────────────────────┘\n\
    \                    │ keyed via CICS screen\n                    ▼\n┌──────────────────────────────────────────────────────┐\n\
    │  LOOPS: Non-Monetary Determination (DB11)            │\n│  PENSION-AMT stored
    on the determination segment     │\n│  (DXCBW30E captures it from LOOPSP11)  \
    \             │\n└───────────────────┬──────────────────────────────────┘\n  \
    \                  │ flows to payment segment (DB02)\n                    ▼\n\
    ┌──────────────────────────────────────────────────────┐\n│  LOOPS: Payment Record
    (BP88 VSAM / DB02 IMS)       │\n│  BP88-PENSION-AMOUNT1, BP88-PENSION-AMOUNT2\
    \          │\n│  (pre-populated per certification week)              │\n└───────────────────┬──────────────────────────────────┘\n\
    \                    │ read at check-print / reporting\n                    ▼\n\
    ┌──────────────────────────────────────────────────────┐\n│  LOOPS: AWBA = WBA-PAY
    − PENSION-AMT                │\n│  Floor at zero (unless PC=45 CWC)          \
    \          │\n│  (UIMB0440, BALANCE, DXCBD10R, DXCBD06E, etc.)     │\n└──────────────────────────────────────────────────────┘\n\
    \nImplication for the Replacement Spec\n\nThe pension spec that replaces the manual
    Excel process is introducing computation logic that does not exist anywhere in
    the current LOOPS codebase (in the documented programs). The replacement system
    would be the first place that logic is codified in software — there is no legacy
    code to reverse-engineer for the proration formulas. The business rules for prorating
    lump sums, applying employer contribution percentages, or handling different pension
    types would need to come from NJ DOL policy documents and SMEs, not from existing
    COBOL source.\n\nWould you like to explore any of these areas further?\n\nPension
    flow from DB11 to DB02\n\nPension offset segment handling\n\nCWC negative AWBA
    exception"
