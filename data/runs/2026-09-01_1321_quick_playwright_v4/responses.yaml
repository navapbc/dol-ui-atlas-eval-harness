    Not documented in held code; likely in CODELOOP VSAM or a DB2 reference table\t
    Outside KB coverage\nView more\n\nThe bottom line for the Connect migration: LOOPS
    uses the local office extensively once it's on the claim, but the mechanism that
    assigns a local office based on municipality at claim-filing time is not in the
    batch program slice covered by the knowledge base. That assignment logic would
    be in the CICS online claim-filing conversation (C030) or a supporting reference
    table — worth checking with the team that owns the online claim intake screens
