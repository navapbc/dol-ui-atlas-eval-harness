  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThe knowledge base
    has rich documentation on this. LOOPS uses a layered approach: basic format checks
    happen at multiple ingest points, but the real SSN verification (against SSA)
    and deceased detection both flow through a single external service called VERIS.
    Here's the full picture.\n\nSSN Format Validation (Local, Within LOOPS)\n\nBefore
    any external check, multiple LOOPS programs perform basic SSN format and numeric
    validation at their respective entry points:\n\nDXCB147U — Validates SSN against
    the NNN-NN-NNNN pattern, checking all 11 character positions individually (3 digits,
    dash, 2 digits, dash, 4 digits)\nDXCBD42C — Validates SSN is all-numeric for payment/redet
    records from the WRREDET file; writes 'SSN MUST BE NUMERIC' to an error report
    if it fails\nUIMB0134 — Validates Employee SSN is all-numeric for New Hire crossmatch
    records\nUIMI0158 — Validates SSN is numeric on crossmatch output records, setting
    an SSN-Passed flag ('Y'/'N') that gates whether the record is written\n\nThese
    are all local format checks — they reject garbage data but do not confirm the
    SSN is real or alive.\n\nSSN Verification Against SSA (External — VERIS)\n\nThe
    actual identity-level SSN verification is performed by calling the VERISB (batch)
    or VERISBN (new variant) external subroutine, which communicates with the Social
    Security Administration.\nVERISB.md\nVERISBN.md\n\nInputs to VERIS:\n\nClaimant's
    SSN (VERIS-SSN)\nDate of Birth, reformatted to CCYY-MM-DD (VERIS-DOB)\n\nTrigger
    point documented: Program UIMI0025 (CWC initial claim processing, Program Code
    45) fires the VERIS call after successfully inserting the new basic claim segment
    into the IMS database. The trigger flag LETS-DO-VERIS is set to 'Y', and DB01-DATE-BIRTH
    is saved for the call.\nUIMI0025.md\n [108]\n\nVERIS Response Fields:\n\nVERIS-COMPCODE
    — MQ completion code (00 = successful communication)\nVERIS-SSN-RETCDE — the SSN-level
    return code from SSA\nPlus: VERIS-DOBCODE, VERIS-LOWASSIGN, VERIS-HIGHASSIGN,
    VERIS-AGENOW, VERIS-LOWAGE, VERIS-HIGHAGE, VERIS-DOBSTRING, VERIS-STATESTRING,
    VERIS-FIRSTNAME, VERIS-LASTNAME, VERIS-RIDDOB, VERIS-RIDDOD (date of death), VERIS-ZIP1,
    VERIS-ZIP2\nWhere SSN Verification Results Land\n\n1. UIMV_SSN_VALIDITY DB2 table
    — Every VERIS call result (success or failure) is recorded here. Key fields include
    [108]:\nUIMI0025.md\n\nIDN-SSN, Program Code, Date of Claim\nMQ-COMPCODE, MQ-REASON\n\
    SSN-RETCDE, SSN-RETCDE-LIT\nDOBCODE, LOWASSIGN/HIGHASSIGN, AGENOW, LOWAGE/HIGHAGE\n\
    STATE-CDE, DOBSTRING\nHISTORY-IND (set to '0' for current)\n\n2. Claim pended
    in IMS — When VERIS-COMPCODE = 00 AND VERIS-SSN-RETCDE ≠ 00 (SSN problem confirmed),
    the program [108]:\nUIMI0025.md\n\nRetrieves the basic segment with GHU\nSets
    DB01-POT-PAY-PEND = 1 (potential payment pending)\nIncrements DB01-REMARKS-COUNTER\n\
    Creates a Remarks segment (DB16) with the message 'PROBLEM WITH SSN - CLAIM PENDED'\n\
    Deceased Detection — Three Sources\n\nProgram UIMB0726 / UIMI0726 documents a
    three-source deceased check that sets the Deceased Flag ('Y'/'N'). A claimant
    is marked deceased if any of the following is true [101]:\nUIMB0726.md\nUIMI0726.md\n\
    \nTable\n\nSource\n\n\t\n\nCheck\n\n\t\n\nHow Death Date Is Captured\n\n\nInput
    master record\tDeceased Indicator ≠ 0 on the existing master input record\tDate
    carried from the input record\nUIMV_SSN_RETIRED DB2 table\tSSN found in the SSN
    Retired table\tDATE-OF-DEATH from the table record\nVERIS death verification\t
    VERIS-SSN-RETCDE = '00000110'\tVERIS-RIDDOD (date of death from SSA)\nView more\n\
    \nEligibility threshold for VERIS death check: The claimant's AR-TOTAL-REFUND
    must be greater than $24.99 — only claimants with a meaningful outstanding balance
    get the VERIS deceased check.\nUIMB0726.md\n\nWhere Deceased Results Land\n\n\
    1. UIMV_SSN_RETIRED DB2 table — When VERIS returns SSN-RETCDE = '00000110', a
    record is inserted with [108]:\nUIMI0025.md\n\nIDN-SSN, Program Code, Date of
    Claim\nFIRSTNAME, LASTNAME (from SSA)\nDATE-OF-BIRTH, DATE-OF-DEATH\nZIP-BENEFIT-SENT,
    ZIP-LUMP-SUM-SENT\n\n2. Output Master Record (ACP) — Programs UIMB0726/UIMI0726
    set [101]:\nUIMB0726.md\nUIMI0726.md\n\nAR-DECEASED-IND = 1 and AR-DECEASED-DATE
    = WS-DATE-DEATH-VERIS (if deceased)\nAR-DECEASED-IND = 0 and AR-DECEASED-DATE
    = zeroes (if not deceased)\n\n3. Downstream cleanup — Program DXCBACP1 applies
    deceased date placeholder correction: if the Deceased Date is '????????' and the
    indicator is 1, it replaces it with the current system date; if the indicator
    is 0, it clears to zeros.\nDXCBACP1.md\n\nVERIS Resilience Rules\nIf a VERIS call
    fails and the error reason is not 2033 (non-connection error), the total error
    counter increments.\nUIMB0726.md\nIf total VERIS errors exceed 75, all further
    VERIS calls are disabled for the remainder of the run (VERIS-SW = 'N'), and the
    message '*** MORE THAN 75 VERIS ERRORS ***' is logged.\nUIMB0726.md\nICON ↔ LOOPS
    Interface\n\nThe knowledge base documents ICON as an upstream system that feeds
    data into LOOPS. Source code comments in UIMB0003.txt / UIMI0003.txt reference
    formatting alien registration numbers \"FROM ICON TO LOOPS\" and ensuring data
    acceptance for the S.A.V.E. program.\nUIMI0003.txt\n [102] Job TNPYD006 also generates
    HCTC payment files formatted for ICON transmission.\nTNPYD006.md\n [106] However,
    the knowledge base does not contain a process or interface named \"UIQ\" — the
    term does not appear in any retrieved document. If your spec references ICON's
    UIQ as the channel for the new SSN check, that may be an ICON-side component documented
    outside the LOOPS knowledge base, or it may be worth confirming the exact name
    with the ICON team.\n\nSummary Flow (Synthesized from Multiple Sources)\n┌─────────────────────────────────────────────────────────┐\n\
    │  LOCAL FORMAT CHECKS (multiple programs)                │\n│  DXCB147U: NNN-NN-NNNN
    format                          │\n│  DXCBD42C, UIMB0134, UIMI0158: numeric-only\
    \            │\n│  → Rejects garbage; does NOT confirm SSN is real        │\n\
    └──────────────────────┬──────────────────────────────────┘\n                \
    \       │ passes format check\n                       ▼\n┌─────────────────────────────────────────────────────────┐\n\
    │  VERIS CALL (VERISB / VERISBN subroutine)              │\n│  Input: SSN + DOB\
    \                                       │\n│  External: Social Security Administration\
    \               │\n│  Triggered in UIMI0025 (CWC claim filing, PC=45)       │\n\
    └──────────────────────┬──────────────────────────────────┘\n                \
    \       │ response received\n            ┌──────────┼──────────┐\n           \
    \ ▼          ▼          ▼\n      SSN OK      SSN Problem   Deceased/Retired\n\
    \    (RETCDE=00)  (RETCDE≠00,   (RETCDE=00000110)\n                  ≠00000110)\n\
    \            │          │          │\n            ▼          ▼          ▼\n  \
    \   ┌──────────┐ ┌──────────┐ ┌──────────────────┐\n     │ Record   │ │ Pend \
    \    │ │ Insert into      │\n     │ in       │ │ claim:   │ │ UIMV_SSN_RETIRED
    │\n     │ UIMV_SSN │ │ POT-PAY  │ │ (name, DOB, DOD, │\n     │_VALIDITY │ │ PEND=1\
    \   │ │  ZIP codes)      │\n     │          │ │ + Remark │ │                 \
    \ │\n     │          │ │ DB16     │ │ + Record in      │\n     │          │ │\
    \          │ │ UIMV_SSN_VALIDITY│\n     └──────────┘ └──────────┘ └──────────────────┘\n\
    \                                        │\n                  ┌─────────────────────┘\n\
    \                  ▼\n     ┌───────────────────────────────────┐\n     │  ACP
    Master Record Output         │\n     │  (UIMB0726 / UIMI0726)           │\n  \
    \   │  AR-DECEASED-IND = 1             │\n     │  AR-DECEASED-DATE = death date\
    \   │\n     │  (three-source check: input rec, │\n     │   SSN Retired table,
    VERIS)      │\n     └───────────────────────────────────┘\n\nImplication for Your
    SSN Validation Spec\n\nYour replacement spec routing through ICON's UIQ is introducing
    a different verification path than what LOOPS uses today. In the current system,
    VERIS is the sole SSN verification channel, and it doubles as the deceased detection
    mechanism (return code '00000110'). If the new UIQ-based check only validates
    SSN existence and leaves deceased checks out of scope, be aware that today's VERIS
    call serves both purposes simultaneously — the replacement will eventually need
    a deceased-detection equivalent to cover the UIMV_SSN_RETIRED insert and the downstream
    AR-DECEASED-IND/AR-DECEASED-DATE population that currently depend on VERIS return
    code '00000110'.\n\nWould you like to explore any of these areas further?\n\n\
    VERIS MQ messaging details\n\nDB2 table deep dive\n\nDeceased detection logic
