  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nGreat question for
    the Connect migration — LOOPS uses a two-field convention on the certification
    record itself (not a single \"channel\" flag) to identify where a weekly certification
    was submitted. The channel is determined by the combination of Operator ID and
    Terminal ID stamped on the record at the time of entry. Here's exactly how it
    works:\n\nHow LOOPS Marks the Submission Channel\n\nLOOPS does not store a literal
    \"IVR\" or \"WEB\" label on the certification record. Instead, it stamps two metadata
    fields at submission time, and downstream programs derive the channel from those
    values :\nDXCBDA2R.md\nDXCBDA2R.cbl.md\n\nTable\n\nField (PAYVSAM)\n\n\t\n\nField
    (NOPAY)\n\n\t\n\nDescription\n\n\nBP88-OPERATOR-ID-CERT\tNOPAY-OPERATOR-ID-ENTRY\t
    Operator ID at time of certification entry\nBP88-TERMINAL-ID-CERT\tNOPAY-TERMINAL-ID-ENTRY\t
    Terminal ID at time of certification entry\nView more\n\nThe channel classification
    logic (documented in program DXCBDA2R.cbl, paragraph 2600-CHECK-ENTRY-SOURCE)
    then applies these rules :\nDXCBDA2R.md\nDXCBDA2R.cbl.md\n\nChannel Classification
    Rules\nLOOPS Weekly Certification Channel Classification Rules\n\nChannel\n\n\t\
    \n\nTerminal ID\n\n\t\n\nOperator ID\n\n\t\n\n...\n\n\nWEB (online self-service)\t\
    '7777'\t9000\t...\nPHONE / IVR (telephone self-service)\t'7777'\tNot 9000\t...\n\
    Manual P100 (staff-assisted)\tNot '7777'\tNot 9000\t...\nView more\nHow to Tell
    an IVR Cert from a Web Cert in the Data\n\nThe key distinguisher is the Operator
    ID — both IVR and Web share Terminal ID '7777', but only Web uses Operator ID
    9000 :\nDXCBDA2R.md\nDXCBDA2R.md\n\nIVR cert: Terminal ID = '7777' AND Operator
    ID ≠ 9000\nWeb cert: Terminal ID = '7777' AND Operator ID = 9000\nManual/staff
    cert: Terminal ID ≠ '7777' (Operator ID is irrelevant for this classification)\n\
    \nSo if you're querying the PAYVSAM or NOPAY data, a filter like:\n\nsql\n\n--
    IVR certifications\nWHERE TERMINAL_ID = '7777' AND OPERATOR_ID <> 9000\n\n-- Web
    certifications\nWHERE TERMINAL_ID = '7777' AND OPERATOR_ID = 9000\n\n-- Manual
    / staff-entered\nWHERE TERMINAL_ID <> '7777'\n\nwill separate the three channels.\n\
    \nWhere This Logic Is Used\nDXCBDA2R.cbl — the batch Daily/Weekly Certification
    Extract Report program — is the primary documented consumer of this logic. It
    reads both the PAYVSAM (payment) and NOPAY (no-payment) input files, classifies
    each cert by channel, and produces three separate summary reports: Combined, Web-only,
    and Phone-only.\nDXCBDA2R.cbl.md\nNOPAYRFM — the NOPAY-to-PAYVSAM reformatter
    — preserves these fields when it maps NOPAY-TERMINAL-ID-ENTRY → BP88-TERMINAL-ID-CERT
    and NOPAY-OPERATOR-ID-ENTRY → BP88-OPERATOR-ID-CERT.\nNOPAYRFM.md\nImportant Caveats
    for the Connect Migration\n\nNo dedicated \"channel\" column exists — the channel
    is derived from the Operator ID / Terminal ID combination, not stored as a discrete
    code. If Connect introduces a new submission path, it would need to either reuse
    one of the existing ID conventions or add a new indicator field.\n\nIVR Operator
    IDs are variable — the IVR is identified by Terminal ID '7777' with any Operator
    ID other than 9000. The knowledge base does not document what specific Operator
    ID values the IVR system stamps (it could be a fixed IVR system ID or vary). This
    would be worth confirming with the IVR/telephony team.\n\nCoverage caveat — this
    logic is documented in DXCBDA2R and NOPAYRFM within the held code slice. Other
    LOOPS programs or CICS screens that consume these fields may apply the same convention,
    but that cannot be confirmed from the knowledge base alone.\n\nWhat would you
    like to explore next?\n\nDXCBDA2R batch flow details\n\nBP88 certification record
    layout\n\nNOPAYRFM field mapping"
