  answer: "ENGINEERING ONBOARDING SPECIALIST\nCompleted 1 step\n\nThis is an excellent
    question, and the knowledge base has very thorough documentation on this topic.
    The short answer is: in the documented programs, the Saturday CWE is derived by
    construction, not enforced by runtime validation — and skeleton program codes
    don't get a CWE at all.\n\nHow the CWE Is Handled by Program Code Category\n\n\
    There are two distinct categories in the documented programs:\n\n1. Skeleton Program
    Codes — No CWE Calculated\n\nFor skeleton program codes (11, 12, 50, 51, 70, 71,
    72, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 88), the CWE date calculation
    is skipped entirely. The skeleton flag (C010-SKEL-FLAG) is set to '1', and neither
    a Current Week Ending date nor a Benefit Year End date is calculated or stored.
    Processing jumps directly to the base period calculations.\nUIMI0003.md\n\nThis
    is consistent across all documented new-claim programs:\n\nUIMB0003 (batch new
    claims)\nUIMI0003 (CICS new claims)\nUIMI0025 (interstate new claims)\n2. Standard
    (Non-Skeleton) Program Codes — CWE = Claim Date + 6 Days\n\nFor all non-skeleton
    program codes, the CWE is computed as Date of Claim + 6 days and stored in C010-DATE-CURRENT-CWE.\n\
    \nThis works because NJ UI claims must be filed on a Sunday (for non-skeleton,
    non-exempt codes). The UIMI0003 source explicitly validates this: if the Date
    of Claim does not fall on a Sunday, the claim is rejected with error message 'DATE
    OF CLAIM MUST FALL ON SUNDAY'.\nUIMI0003.md\n Since Sunday + 6 = Saturday, the
    CWE is always a Saturday by construction.\n\nNotable exception: Program Code 45
    and claims filed before a specific effective date bypass the Sunday day-of-week
    check entirely.\nUIMB0003.md\n UIMB0025 also uses a different CWE calculation
    for PC 45 — it subtracts 7 days and then adjusts backward to the nearest preceding
    Sunday, rather than adding 6 days forward.\nUIMB0025.md\n\nDerived, Not Enforced\n\
    \nThe 00_ca7_daily_overview.md document states this explicitly :\n00_ca7_daily_over...\n\
    \n\"In the held daily programs, the Saturday week-ending date (CWE) is produced
    by construction, not validated at runtime.\"\n\nIt lists the specific mechanisms
    across programs:\n\nUIMB0018 — uses DAYS-TO-PREV-SATURDAY-VALUES day-of-week offset
    tables to snap a date to the prior Saturday\nUIMB0248 — computes day-of-week (REM
    of INTEGER-OF-DATE by 7) and only performs weekly-report work in the Saturday
    branch; its explicit non-Saturday guard (IF WS-WEEKDAY NOT = 'SATURDAY') is commented
    out in source\nDXCBDA2R — paragraph 1300-GET-PREV-WEEKEND-DATE computes the previous
    weekend date with month-length addends\nDXCBDSUP — computes the Saturday CWE boundary
    for mail-certification scheduling using day-of-week offset tables\nDXCBD23U —
    computes the \"Saturday of the CWE week\" by calculating a forward offset from
    the CWE date using day-of-week remainder mapping\nSummary\nTable\n\nProgram Code
    Category\n\n\t\n\nCWE Behavior\n\n\t\n\nSource Programs\n\n\nSkeleton (11, 12,
    50, 51, 70–88)\tCWE not calculated; skeleton flag set to '1'\tUIMB0003, UIMI0003,
    UIMI0025\nStandard non-skeleton (10, 20, 21, etc.)\tCWE = Date of Claim + 6 days;
    claim date must be Sunday, so CWE is always Saturday by construction\tUIMB0003,
    UIMI0003\nPC 45 (Interstate Benefit)\tCWE calculated differently (backward from
    claim date minus 7, adjusted to preceding Sunday); Sunday claim-date check is
    bypassed\tUIMB0025, UIMB0003\nDownstream programs\tVarious programs snap dates
    to Saturday using offset tables, but none actively reject a non-Saturday CWE at
    runtime (the UIMB0248 guard is commented out)\tUIMB0018, UIMB0248, DXCBDA2R, DXCBDSUP,
    DXCBD23U\nView more\n\nBottom line: In the documented programs, the Saturday CWE
    pattern holds by derivation (the code constructs it to be Saturday), but no documented
    program actively validates or rejects a non-Saturday CWE at runtime. The UIMB0248
    source had such a guard, but it is commented out. Skeleton program codes receive
    no CWE at all. This analysis is bounded by the knowledge base coverage — programs,
    jobs, or streams outside the held slice may handle it differently, so a universal
    claim that CWE is always Saturday system-wide cannot be confirmed from the knowledge
    base alone.\n\nWould you like to explore further?\n\nCWE in interstate claim type
    determination\n\nDXCBD23U disqualification date calculation\n\nCWE offset table
    mechanisms"
