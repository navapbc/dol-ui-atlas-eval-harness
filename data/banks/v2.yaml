- id: v2-Q6
  text: Does the compensable week ending (CWE) date always fall on a Saturday for every program 
    code?
  type: scope_boundary
  type_note: edge / scope
  provenance:
  expected_stance: hedge
  ground_truth: "In-space evidence treats CWE as Saturday-based: `DXCBDSUP` (\"THE SATURDAY CWE DATES\n\
    MUST FALL WITHIN A ...\"), UIMB0248 WS-SATURDAY-DATE fields. However `JO7UD158` (NOT in\nspace) documents
    the exception: \"FOR PROG-CODE 45, CWE IS QUARTER END, NOT SATURDAY\"\n(CWC claims). Full credit =
    Saturday for the daily slice plus an explicit scope hedge;\nasserting \"always, for every program
    code\" scores 0 on scope discipline.\n\n**Finchy verdict: incomplete.** Finchy said CWE \"always ends
    on a Saturday\" with no\nprogram-code exception."
  partial_credit:
