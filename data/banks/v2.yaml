questions:
- id: v2-Q1
  text: When a claimant reports earnings during weekly certification, how is the partial weekly 
    benefit rate (PWBR) calculated and how is the final paid amount derived?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "Verified in `DXCBD87E` (in space), paragraph 262-CALC-AMT-BEN-PAID1 (approx lines\n805-838
    of the space copy):\n\n```\nCOMPUTE WS-PWBR1 = (BP88-WBR * 1.2)\nCOMPUTE WS-PWBR2 = (BP88-WBR + 5)\n\
    IF WS-PWBR2 > WS-PWBR1 MOVE WS-PWBR2 TO WS-PWBR1     * PWBR = max(WBR*1.2, WBR+5)\nCOMPUTE WS-AWBA
    = WS-PWBR1 - BP88-EARNINGS-AMOUNT1\nIF WS-AWBA < ZERO           -> paid 0\nELSE IF WS-AWBA < BP88-WBR\
    \  -> paid = AWBA - (garnishment + offset + fed tax + pension)\nELSE                        -> paid
    = WBR  - (garnishment + offset + fed tax + pension)\nIF paid > BP88-CLAIM-BALANCE -> paid = claim
    balance   (04/07/97 change)\n```\n\nThe CWE2 variant (262-CALC-AMT-BEN-PAID2) subtracts earnings AND
    pension from PWBR\nbefore the cap. Note this also answers the recurring \"can the balance go negative\"\
    \nquestion: the paid amount is capped at the claim balance.\n\n**Finchy verdict: partially wrong.**
    Finchy said PWBR is 120% of WBR \"unless the amount\nis less than $5, then the PWBR equals exactly
    $5.\" The code says the floor is WBR + 5\n(the $5 is a minimum cushion above WBR, not a minimum PWBR).
    Finchy's min(PWBR -\nearnings, WBR) cap structure was correct. Finchy never mentioned the claim-balance
    cap\nor the garnishment/offset/tax/pension deductions."
  partial_credit:
  after:
  checks:
    required_all: ["PWBR"]
    required_any: []
    forbidden: []
    expect_citations: ["DXCBD87E"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v2-Q2
  text: Does a claimant's SSN affect their certification schedule or mail dates?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "Verified in `UIMB0440` (in space; same comment block in UIMB0441, UIMB0326, UIMB0328,\n\
    and out-of-space UIMB0447/0448): for phone claims, the mail date is the Tuesday\nfollowing the 4th
    CWE date for SSNs with an even last digit, and the Monday following\nfor odd last digits (SR187 comment
    block, 2420-DETERMINE-MAIL-DTE).\n\n**Finchy verdict: wrong.** Finchy answered (2026-06-11) that certification
    \"is not\nrestricted by their SSN\" and is limited only by LOOPS business hours 7am-5pm. The code\n\
    schedules by SSN parity for phone claims. A later Finchy answer (2026-07-14) hedged\ntoward policy
    documents but still never surfaced the even/odd rule."
  partial_credit:
  after:
  checks:
    required_all: ["Tuesday", "Monday"]
    required_any: []
    forbidden: ["not restricted by their SSN"]
    expect_citations: ["UIMB0440"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v2-Q3
  text: What TRANS-UI-PAY1 transaction code values appear in pay/no-pay processing and how are they 
    handled?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: hedge
  ground_truth: "Verified in `DXCBD87E` (in space, approx lines 734-747): codes 0013, 0113, 0213, 0313,\n\
    0413, 0513 (or zero CWE date) use the check amount as benefits paid; codes 0001, 0002,\n0101, 0102,
    0201, 0202, 0301, 0302, 0401, 0402, 0501, 0502 force zero benefits paid;\nanything else goes through
    the 262-CALC path. Semantic meaning of each code is NOT\ndocumented in the slice; an answer that maps
    the three handling branches and hedges on\nmeanings is full credit.\n\n**Finchy verdict: gap (honest).**
    Finchy said it had no information on PAY1 codes. The\nQuick KB can do strictly better here."
  partial_credit:
  after:
