- id: v6-Q8
  text: In job L213DC, where do the error records from the DB08 reformat program (DXCRD88E) actually
    land, and is there anything surprising about it?
  type: data_flow
  type_note: data flow (conflict surfacing)
  provenance:
  expected_stance: answer
  ground_truth: "The DD is named DB89FILE in both programs but points at DIFFERENT datasets: DXCRD88E's
    errors land in L213DC.DB98FIL.DTL; DXCRD99E's in L213DC.DB89FIL.DTL. Only the 88E half mismatches
    (nothing was swapped between steps, so do not require \"crossed\" framing); a commented-out DD in
    the 88E step already pointed at DB98FILE.DTL (evidence of a FILE→FIL rename, not of the mismatch being
    introduced). REPRA262, a later step in the SAME job, REPROs the two datasets straight into DB89FILE/DB98FILE
    GDGs (89→89, 98→98). Full credit surfaces the DD-name-vs-dataset mismatch on the 88E step; asserting
    errors land in \"the DB89 file\" from the DD name alone is the miss. Note for grading a BRE-only arm:
    bre/jcl/L213DC.md DOES capture the DD→dataset mapping, but mislabels both files as \"validated records\"\
    \ rather than errors — crediting content requires the COBOL/BRE program docs"
  partial_credit:
  after:
  checks:
    required_all:
    - DB89FILE
    required_any:
    - L213DC.DB98FIL.DTL
    - DB98FIL
    forbidden: []
    expect_citations:
    - DXCRD88E
    - DXCRD99E
    - REPRA262
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v6-Q9
  text: (v3 reserve) How does LOOPS record self-service direct deposit changes, and how would the 
    replacement system tell a web-submitted change from other sources?
  type: scope_boundary
  type_note: retrieval + scope boundary
  provenance: "Ground truth in v3_answer_key.md §RESERVE: UIMT_DIR_DEP_INFO carries IDN_CONVERSATION;
    'WEB ' = online self-service (UIMB0803 daily BC-516 extract evaluates D185/D186/WEB); UIMB0298 debit-card-migration
    inserts. SSI-side job names/schedules NOT in KB"
  expected_stance: answer
  ground_truth: "Cut per user to bring the bank to 8; kept as a verified swap-in candidate for a\nfuture
    version.\n\nSource brief: \"Deprecate SSI Batch Jobs\" (four SSI-side batch jobs push direct\ndeposit/address
    updates into LOOPS; three are rewritten, Direct Deposit Sync remains).\n\nVerified in space:\n\n-
    Direct deposit records in UIMT_DIR_DEP_INFO carry a Transaction Source Code\n  (IDN_CONVERSATION);
    'WEB ' marks changes submitted through the online self-service\n  channel (rule documented in UIMB0803,
    which extracts pay-status-changed records\n  daily to populate Form BC-516, evaluating conversation
    types D185/D186/WEB).\n- ~111 files mention direct deposit; 17 BRE docs reference IDN_CONVERSATION;
    UIMB0298\n  handles debit-card-migration inserts against the Direct Deposit Info table.\n\nVerified
    ABSENT: the SSI-side job names from the brief — \"Direct Deposit Sync\",\n\"Direct Deposit Update\"\
    , \"Direct Deposit Update Update\", \"Address Update\". The only\ngreps resembling them are false
    positives (a \"DABS IMS UPDATE UPDATE\" JCL comment in\nZDLCANU3 and an \"UPDATE UPDATE_CURSOR ERROR\"\
    \ literal in UIMB0142). SSI itself is not\ndocumented as a system in the KB.\n\nFull credit: describes
    the LOOPS-side evidence (IDN_CONVERSATION='WEB ', UIMB0803's\nextract, the DB2 table) and states that
    the SSI-side batch jobs and their schedules\nare not in the linked spaces. Describing the four SSI
    jobs by name as if documented,\nor asserting the SSI→LOOPS transport mechanism, is the fail."
  partial_credit:
  after:
  checks:
    required_all:
    - IDN_CONVERSATION
    required_any: []
    forbidden:
    - Direct Deposit Sync
    - Direct Deposit Update
    expect_citations:
    - UIMB0803
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v6-Q10
  text: (v4 reserve) The Persistence API identifies a claim by SSN, date of claim, and program code.
    Is that how LOOPS uniquely identifies a claim?
  type: retrieval
  type_note: retrieval
  provenance: 'Ground truth in v4_answer_key.md §RESERVE: yes — SSN/PC/DOC triplet is the pervasive claim
    identity (UIMV_SSN_RETIRED key, UIMT_RSA_NONMON, UIMB0147 crossmatch, report headers); may note IMS
    segments additionally qualified by segment type (DB01/DB10)'
  expected_stance: answer
  ground_truth: "Source spec: Weekly Certification in Salesforce — the Persistence API callout sends\n\
    SSN + Date of Claim + Program Code \"to ensure that only related weekly certifications\nare returned.\"\
    \n\nCandidate question: \"The Persistence API identifies a claim by SSN, date of claim,\nand program
    code. Is that how LOOPS uniquely identifies a claim?\"\n\nVerified in space: the SSN/PC/DOC triplet
    is pervasive as the claim identity — e.g.\nUIMB0004's UIMV_SSN_RETIRED insert keys on IDN_SSN + PC
    + DOC; UIMT_RSA_NONMON\ncarries SSN, program code, claim date; UIMB0147's crossmatch insert and RTW
    report\nlines all carry SSN/PC/DOC; report headers routinely print the triplet\n(RTW-HEAD-SSN/PC/DOC).
    A grounded answer confirms the triplet with citations and may\nnote IMS claim segments are additionally
    qualified by segment (DB01 basic, DB10\nadditional claim). Kept as a swap-in candidate; cut to hold
    the bank at 8."
  partial_credit:
  after:
  checks:
    required_all:
    - SSN/PC/DOC
    required_any: []
    forbidden: []
    expect_citations:
    - UIMV_SSN_RETIRED
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
