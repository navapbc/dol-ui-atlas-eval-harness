- id: v5-Q4
  text: For the claims certification cycle, is the certification week ending date always a Saturday?
    Is that enforced anywhere in code I can point to, or is it convention?
  type: scope_boundary
  type_note: scope discipline (CWE retest, re-angled)
  provenance:
  expected_stance: answer
  ground_truth: "In held code Saturday CWE is DERIVED by construction, never validated at runtime:\n-
    UIMB0018 (`source/cobol/UIMB0018.txt` ~89200-91100): DAYS-TO-PREV-SATURDAY-VALUES\n  day-of-week offset
    tables snap dates to the Saturday prior to separation date.\n- UIMB0248 GET-DAY-OF-WEEK (~013770-014700):
    WS-DAY-OF-WEEK = REM(INTEGER-OF-DATE,7);\n  weekly-report work only in the WHEN 6 (SATURDAY) branch;
    the explicit guard\n  `IF WS-WEEKDAY NOT = 'SATURDAY' PERFORM 3220-PRINT-NO-WEEKLY` is COMMENTED OUT\n\
    \  (014650-014670) — enforcement existed and was disabled.\n- DXCBDA2R 1300-GET-PREV-WEEKEND-DATE:
    month-code addends compute previous weekend\n  (the 2026-08-07 incident program; verified correct).\n\
    - DXCBDSUP header comments: \"THE SATURDAY CWE DATES MUST FALL WITHIN A PERPETUAL\n  CYCLE\" (SSN-group
    mail-cert scheduling).\n- No program in the daily slice rejects a non-Saturday CWE.\nOut-of-KB exception
    — do NOT require, DO penalize its denial: JO7UD158 (not in any\nspace, re-verified 2026-08-12) documents
    PROG-CODE 45 CWE = quarter end (CWC).\nScoring: 10 = Saturday per held code WITH the derived-vs-enforced
    distinction +\nKB-bounded hedge (cannot rule out exceptions outside the held slice). Citing the\n\
    commented-out UIMB0248 guard = retrieval-depth bonus. ~5 = right answer but claims\nactive enforcement
    or gives no hedge. 0-3 = \"system-wide invariant, regardless of\nprogram code\" (the v2-Q6 failure,
    seen twice)."
  partial_credit:
