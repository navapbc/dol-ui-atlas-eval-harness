    (A/B/D/G/M/N/P/T/U/W). The discrepancy is REAL: the customer's own\nSharePoint doc (LOOPS DAILY Processing
    Page 1-A) contains this exact O→0\ntranscription error.\nScoring: 10 = exact name not found + surfaces
    DXCBO98B as a near-name candidate\nwhose documented function matches + explicitly flags the one-character
