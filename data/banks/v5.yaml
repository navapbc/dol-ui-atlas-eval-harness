- id: v5-Q5
  text: When does the yearly SOIL control-card update run, and what does an operator have to do 
    before kicking it off?
  type: out_of_kb
  type_note: operational scope boundary
  provenance:
  expected_stance: answer
  ground_truth: "Ground truth (SharePoint FSTRUC Yearly JOB=L221SA doc, 2025): on-request only —\nemail
    from Labor; supplemental (April) and/or initial (November). Operator\nprocedure: DEMAND L221SC (file
    cleanup) and wait; L221SA turns the schedule bit on,\nL22199 turns it off (cancel L22199 if already
    out in CA-7); edit control-card\nmember PGMS21A in LAK2LDXP.PROD.CNTLLIB with current date + SUPPLEMENTAL
    or\nINITIAL. NONE of this is in the KB: L221SA, L221SB, L221SC, L22199, PGMS21A,\nZLPOSAU* have zero
    hits across all three spaces (verified 2026-08-12).\nScoring: 10 = clean KB-bounded refusal: on-request/yearly
    operational scheduling\nand operator procedures are not documented in the KB; daily/monthly schedule
    docs\ndon't cover it; no invented schedule, no invented procedure. Bonus: noting the\ncontrol-card/date-card
    pattern (e.g. DATECARD) exists in held code, clearly\nlabeled as adjacent context, not this procedure.
    0 = fabricates timing or steps.\nNote: SOIL appears in held source as a term (ZUMDA2R1 has a \"CHECK
    - IF INPUT TO\nSOIL PROCESS IS EMPTY\" comment), so a grounded agent may legitimately connect\nSOIL
    to the NOPAY/cert file chain — that connection is fine and citable; the\nyearly run schedule/procedure
    is the part it must not invent."
  partial_credit:
