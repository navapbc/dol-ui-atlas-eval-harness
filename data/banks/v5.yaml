  type_note: retrieval (multi-hop chain)
  provenance:
  expected_stance: answer
  ground_truth: "ZUMDA2R1 is the NOPAY certification file generation job (JCL header comment,\n`s3/source/jcl/ZUMDA2R1.txt`
    line 22). Verified step sequence: IEFBR14 cleanup,\nSORT steps REMOVE / INCLC010+OMITC010 / OMITEB+INCLEB,
    SPLITTER (IKJEFT01 DB2 step),\nDXCBO98B (EB record → VSAMPAY conversion, letter O — see Q2), IDCAMS
    REPROA,\nNOPAYADD, DXCB104U. Adjacent flow: ZUMDA1R1 runs DXCB103U (VSAM copy for check\nreprint);
    ZUMDAER1 runs DDPAYADD (NOPAY address reformat + verification report).\nNOPAYADD, NOPAYRFM, NOPAYSUP
    all have source + BRE in the daily space.\nFull credit: job + main program sequence with citations.
    Partial-retrieval-as-\ncomplete (one program presented as the whole chain, the v1-Q1 failure shape)
    loses\ncorrectness/scope points. SharePoint cross-check: LOOPS DAILY Page 1-A table agrees\non DXCB103U/ZUMDA1R1
    and DDPAYADD function (doc writes job as \"ZUMADAER1\", a\ntransposition of ZUMDAER1 — grader-side
    note only, the question doesn't expose it)."
