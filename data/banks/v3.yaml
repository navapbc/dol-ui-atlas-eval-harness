- id: v3-Q1
  text: Describe the Automated Collection Process.
  type: term_redirect
  type_note: term-redirect
  provenance:
  expected_stance: redirect
  ground_truth: "The literal phrase appears nowhere in the KB, the Finchy export, or the LOOPS source\n\
    archive. Canonical name: **Accelerated Collection Process (ACP)**; BRE docs also say\n\"Accelerated
    Collections/Payments\" and \"Accelerated Refunds\" (UIMB0726).\n\nWhat ACP is: recovery of UI benefit
    overpayments via the NJ Department of Revenue\n(DOR). In-space program inventory (all with BRE docs
    in the daily space):\n\n| Program | Role |\n|---------|------|\n| UIMB0725 | Builds initial eligible-claimant
    population from IMS claims; excludes deceased via SSN-Retired DB2 table and VERIS |\n| UIMB0726 |
    Daily master-file refresh (\"Accelerated Refunds Daily Extract\"); re-pulls IMS/DB2 attributes, VERIS
    deceased check, assigns Claimant IDs |\n| UIMB0729 | (in space; see BRE doc) |\n| UIMB0730 | Processes
    valid DOR payments into UIMT_DOR_REFUND_PAYMENTS; web EFT/CRD matched to existing rows, lockbox/coupon
    inserted via SSN lookup in UIMT_UNIQUE_CLAIMANT_ID; unmatched to error file |\n| UIMB0731 | Processes
    returned DOR payments; adds failure reason, flips match code 1→2; unmatched to error file |\n| UIMB0732,
    UIMB0305/0306/0307 | Supporting ACP programs, in space |\n| DXCBACP1, DXCBACP4 | Batch ACP programs
    run by L2ACPD3 / L2ACPD5, in space |\n\nDaily CA-7 flow (verified in CA7/DOLDAILYD061526 1.TXT):\n\
    L2ACPD1 → L2ACPD2 → L2ACPD4 → L2ACPD5, and L2ACPSPL → L2ACPD6 → L2ACPD3, plus\nZULDACR*/ZULDA2R* demand
    streams. The TSO steps run the programs via IMS PSBs\n(UIMI0729/0730/0731/0732, UIMI0305-0307 wrapping
    the UIMB programs).\n\nOut of scope (full-credit answer flags this): monthly leg L2ACPM1-M3 runs DXCBACP3,\n\
    DXCBACP8, DXCBACP9 — none in any space.\n\nDecoy: the ETA-227 / DXCR227 program family (in space)
    is overpayment-collections\n*reporting* (federal ETA-227 Refund Report accumulation), not the ACP
    process. An\nanswer centered on DXCR227 misidentifies the process."
  partial_credit:
  after:
  checks:
    required_all: ["ACP"]
    required_any: ["Accelerated Collection Process", "Accelerated Collection Population"]
    forbidden: ["ETA-227"]
    expect_citations: ["UIMB0730", "UIMB0731", "L2ACPD"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v3-Q2
  text: What does the acronym ACP stand for?
  type: acronym_check
  type_note: acronym check
  provenance:
  expected_stance: answer
  ground_truth: "The KB defines the acronym in three verified places (all in the daily space,\nre-checked
    2026-08-03 in `quick_space_ca7_daily_s3/s3/`):\n\n- ZULDA2R* JCL comments: \"NOT CURRENTLY EXIST IN
    ACCELERATED COLLECTION PROCESS(ACP)\"\n  (the literal expansion-plus-acronym pairing).\n- UIMB0730
    and UIMB0731 program titles: \"PROGRAM TITLE : ACCELERATED COLLECTION\n  PROCESS\", carried into their
    BRE doc summaries.\n- UIMB0725/0726 BRE docs: \"Accelerated Collection **Population** (ACP)\" for
    the\n  master-file population, and UIMB0726 says \"Accelerated Collections/Payments (ACP)\".\n\nFull
    credit: **Accelerated Collection Process** with a citation; also acceptable to\nnote the KB additionally
    uses \"Accelerated Collection Population\" for the ACP master\nfile (both expansions are genuinely
    in-KB, so reporting the variation is a plus, not a\nhedge failure). The fail is echoing Q1's planted
    invalid name (\"Automated Collection\nProcess\") or inventing a third expansion. Consistency check:
    if the agent correctly\nredirected in Q1, this answer must match what it said there."
  partial_credit:
