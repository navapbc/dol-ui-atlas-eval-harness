- id: v3-Q3
  text: When LOOPS issues a weekly benefit payment, how is the charge allocated across the 
    claimant's base-period employers?
  type: retrieval
  type_note: retrieval (active workstream)
  provenance:
  expected_stance: answer
  ground_truth: "Source brief: \"Add employer charges to weekly payment calc workflow\" (Phase 2, target\n\
    Q3 2026). The brief itself states the legacy behavior being reproduced: at monetary\ndetermination
    each base-period employer gets a percentage share and a maximum\nchargeable amount; each issued payment
    is then distributed across employers in\nproportion to those shares and drawn down against each cap.
    The question tests whether\nthe agent can surface the LOOPS-side evidence for this.\n\nVerified in
    space (2026-08-03):\n\n- **Determination-time values:** the BC3 record family (~62 BRE docs mention
    BC-3/BC3)\n  carries per-employer \"Maximum UI Charge Amount\" and \"Employer Charge Percentage\"\n\
    \  alongside MBA/WBR (e.g. online BC3 record formatting rules: NBC3-AMT-MAX-UI,\n  NBC3-EMPLOYER-PERCENT-CHRG).
    This matches the brief's Phase 1.\n- **Per-payment charge records:** benefit transaction Segment 04
    = employer charge\n  records, carrying Employer Charge Amount + Employer Penalty Charge with void
    flags\n  (EC-VOID-FLAG).\n- **Reconciliation:** the BALANCE program compares per-claimant Payment
    Total\n  (Segment 02, AWBA-based) against Employer Charge Total (Segment 04, non-void minus\n  void)
    and reports unbalanced groups — the KB's version of the brief's \"each week's\n  charges must sum
    exactly to that week's benefit amount\" invariant.\n- Supporting mentions across ~86 files: DXCBD48R,
    DXCBD06E, UIMB0127, UIMB0397,\n  A187ESUM, DXCBSTRP, D2PAD614, ZDLREIU1; CWE employer-charge-date
    complement trick\n  (Date = -Date - 1) in reporting programs.\n\n**The proration arithmetic (resolved
    2026-08-03): explicitly in-KB.** DXCBP500's BRE\n(in the daily space) is \"a batch employer charging
    program\" whose rules state:\n\n- Rule 13: distribute the weekly benefit amount across all liable
    employers\n  proportionally by each employer's charge percentage.\n- Rule 14 (UI): charge = employer's
    charge percentage × weekly benefit amount,\n  capped at the employer's remaining balance, which is
    then reduced.\n- Rule 15 (EB): charge = 50% × charge percentage × WBA (state share of Extended\n \
    \ Benefits), capped at the EB remaining balance.\n- Rule 16: the last employer absorbs any remaining
    unallocated balance so the full\n  WBA is always charged out (the KB's answer to the brief's missing-cent
    question).\n- Rules 17-20: negative payments reverse charges employer-by-employer in reverse\n  order,
    restoring balances.\n- Rule 27: the charge record layout (CWE date, pay transaction code, FEIN, charge\n\
    \  amount, employer percentage, remaining balance, etc. — the Segment 04 fields).\n\n**Critical caveat
    (the gap-probe half of this question):** UIMB0031's BRE (in space)\nlabels DXCBP500 the *old* charging
    module, called only for claims dated before\nJuly 1, 1986; post-June-1986 claims are charged by **UIMR0030,
    whose source is absent\nfrom the entire held archive** (called by UIMB0031 and UIMB0030, both in space,
    and\nRTBB0030, not in space). So the formula the KB documents belongs to the legacy-era\nmodule; whether
    UIMR0030 preserves it is unverifiable from held source — same shape\nas the v2-Q2 UIMB-vs-UIMI caveat.
    A perfect answer cites DXCBP500's rules AND flags\nUIMR0030 as the undocumented modern path; citing
    the formula without the module\ncaveat is still strong (grounded, correct) but drops a gap-honesty
    point.\n\nTerminology wrinkle: the brief says AWBA = \"Adjusted Weekly Benefit Amount\"; BALANCE's\n\
    BRE doc expands it \"Average Weekly Benefit Amount\". Not graded, but worth noting if\nthe agent surfaces
    it."
  partial_credit:
  after:
  checks:
    required_all: ["charge percentage"]
    required_any: []
    forbidden: []
    expect_citations: ["DXCBP500"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
- id: v3-Q4
  text: Which LOOPS batch processes validate SSNs and check whether a claimant is deceased, and how 
    do they work?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "Source brief: \"SSN Validation and Deceased Check Service\" (new-system services that\n\
    will eventually replace \"the SSN Validation and Deceased check batch jobs\" in LOOPS).\n\nVerified
    in space:\n\n- **VERIS** is the external SSN validation service (155 files mention it). Return\n \
    \ code '00000110' = retired/deceased indicator, used consistently.\n- **UIMB0004**: calls VERIS and
    on '00000110' inserts into UIMV_SSN_RETIRED (SSN,\n  prog-code, DOC, name, DOB, date of death, ZIPs).
    Run via ZU1D04U*/ZU1DI4U* jobs.\n- **UIMB0072**: VERIS rerun program — re-extracts from Table-22 and
    reports\n  successful/unsuccessful VERIS reruns.\n- **ACP-side deceased checks**: UIMB0725 queries
    the SSN-Retired table (deceased if\n  any record matches); UIMB0726 re-validates via VERIS on the
    daily refresh.\n- **Nuance (bonus):** UIMB0725's BRE explicitly labels its VERIS deceased-check flow\n\
    \  \"Currently Bypassed - Not Active\" — a top answer distinguishes the documented-but-\n  bypassed
    path from the active SSN-Retired-table check.\n\nFull credit: names VERIS, the '00000110' convention,
    UIMV_SSN_RETIRED, and at least\none concrete program; hedges anything beyond the held docs (e.g. scheduling/frequency\n\
    claims). The payment-blocking behavior the brief describes (\"prior to any payment\") is\nNOT explicitly
    documented as a payment-gate in the held BRE — asserting it is an\ninference fail."
  partial_credit:
  after:
  checks:
    required_all: ["VERIS", "00000110"]
    required_any: []
    forbidden: []
    expect_citations: ["UIMV_SSN_RETIRED", "UIMB0004"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
