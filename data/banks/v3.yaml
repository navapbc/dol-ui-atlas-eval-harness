- id: v3-Q6
  text: How does LOOPS determine whether a weekly certification was submitted by phone (IVR), on the
    web, or entered by staff?
  type: retrieval
  type_note: retrieval (active workstream)
  provenance:
  expected_stance: answer
  ground_truth: "Source brief: \"IVR Migration to Amazon Connect Strategy\" (weekly certification is one\n\
    of the four functionalities being migrated; the team needs to know how LOOPS marks\ncert provenance).\n\
    \nVerified in space (DXCBD49S, DXCBDA2R BRE docs):\n\n- Terminal ID '7777' + Operator ID 9000 → SIM
    (Self-service Interactive Module)\n  automated telephone submission; phone indicator set to '2'.\n\
    - Terminal ID '7777' + Operator ID ≠ 9000 → PHONE/IVR self-service submission.\n- Terminal ID ≠ '7777'
    → Manual P100 (staff-entered) submission.\n- WEB is a distinct transaction source (e.g. \"_WEB Certification:
    Customer submitted\n  via Web Self-Service Portal_\"); the same classification rules apply to both
    PAYVSAM\n  and NOPAY certification records.\n\nFull credit: reports the terminal/operator rules with
    citations. Related in-KB fact\n(fine to include): direct deposit records use IDN_CONVERSATION='WEB
    ' for web-sourced\nchanges (see Q9). Cross-run note: v2-Q2 established that the UIMB-vs-UIMI (IMS
    vs DB2\nversion) caveat applies to cert-processing programs; an answer that adds that hedge is\nexceeding
    expectations, its absence is not a ding."
  partial_credit:
  after:
  checks:
    required_all: ["7777", "9000", "Manual P100"]
    required_any: []
    forbidden: []
    expect_citations: ["DXCBDA2R"]
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
