- id: v1-Q6
  text: What does the CWC process do and which programs are involved?
  type: cross_space
  type_note: cross-space
  provenance:
  expected_stance: answer
  ground_truth: "Combined Wage Claim: multi-state wages combined for monetary eligibility with NJ as\n\
    paying state. Program codes PC-40 (CWC w/ NJ employer), PC-41 (UCFE), PC-42 (UCX),\nPC-43 (both).
    CICS monetary chain: DXCD034S controller (D055 CWC Monetary\nRedetermination routes 036S then 037S
    unconditionally), DXCD036S wage retrieval\n(CMIB), DXCD037S monetary determination + CWC overlap detection
    (normal/lag/current\nbase year, WS-CWC-OVERLAP* flags, 1250-CWC-CLAIM), DXCD038S base-year employer\n\
    insertion. Batch: DXCBD33S file splitter (10 parallel outputs by SSN range),\nUIMB0031/DXCP802U transfer
    charge generation, UIMR0030 post-1986 employer charging,\nDXCBP500 pre-1986 charging. JCL: L217ML
    (cleanup + split + audit print), L218MV\n(consolidate 10 regions via DXEBM07R). Data stores: CMIB,
    UIMV_CLMNT_MON_SUM (DB2),\nCODELOOP Table 118 (state names), IB4 form.\n\n**UIMR0030 is grounded**
    (v3 key erratum, 2026-08-03): UIMR0030-cbl.json/.html exist\nin the CWC BRE output and full source
    is in the CWC Transform S3 inputs. Do not treat\na UIMR0030 citation as invention. Full credit: the
    inventory above, labeled as\nsynthesized across spaces, with the shared-module note (DXCD03xS serve
    both CWC and\ngeneral monetary flows)."
