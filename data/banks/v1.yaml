questions:
- id: v1-Q1
  text: How does the weekly certification batch process flow from start to finish?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "The pay/no-pay and amount decisions are made in **real time** at certification\n(IVR/CICS);
    by the time batch runs, LOOPPAY/PAYVSAM (paid, 323B) and NOPAY (unpaid,\n281B) already hold outcomes.
    The batch layer extracts, audits, and reports — it does\nnot decide eligibility. Flow: L2DCLNUP nightly
    housekeeping (trigger-dataset reset) →\nnightly VSAM snapshot to dated GDGs → **DXCBDA2R** core extract/classification\n\
    (run-type PARM DAILY/WEEKLY + SYSIN date card; voids → VOIDIND1; zero-CWE bypasses →\nBYPASS; entry-source,
    week-coverage, earnings, and benefit-category classification;\naudit files ADTWEARN/ADTNEARN/ADTONEWK/ADTTWOWK/ADTPRVWK/ADTLPAYS/ADTCWE14
    etc.) →\nAUDITREP summary reports (Combined / WEB-only / PHONE-only; emailed to DOL staff, IT,\nKyndryl)
    → companion **DXCBDA3S** email extract (UI-only codes 0–99 →\nEMAILFLP/EMAILFLN). Cadence tiers: L2DC*
    daily, L2WC* weekly, L2MCERTS monthly. The\nmodule is a flat family of ~20 independently JCL-invoked
    programs (DXCBDA* + BC*\nreconciliation), not a call tree.\n\nFull credit: the flow above WITH the
    scope statement (extract/report layer; upstream\nreal-time capture and downstream ETA-539/WFD consumers
    documented separately). The\nbaseline fail (7/10): describing DXCBDA2R alone as \"the process\" with
    no scope note.\n\nBenefit-category ranges (used across Q1/Q2/Q3): UI 0–99, EB 100–199, TUC1 200–299,\n\
    TUCX 300–399, WFD 500–599, TUCY 600–699, TUCZ 700–799. Channel rule per DXCBDA2R BRE:\nOperator 9000
    + Terminal '7777' → WEB; Terminal '7777' alone → PHONE/IVR; else Manual\nP100. **Carry the v3-Q6 erratum:**
    UIMB0440's BRE calls 9000+'7777' SIM 926 automated\n*phone* (indicator '2'), so the KB self-conflicts;
    either reading is KB-consistent on\nv1, no dock — a perfect answer surfaces the conflict."
  partial_credit:
