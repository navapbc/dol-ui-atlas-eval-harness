- id: v1-Q5
  text: What are the T120 category-to-payable-days values?
  type: gap_probe
  type_note: gap probe
  provenance:
  expected_stance: redirect
  ground_truth: "The question's premise is wrong, deliberately (it repeats the old Weekly Cert\nAssistant
    instructions' mislabel). **Verified 2026-07-27 by reading\n`modules/WeeklyCertification_full/copybooks/T120TABL.cpy`
    directly:** T120\n(T120-TABLE-DATE-BC2-MAILED) is a Julian-date → skip-days lookup for computing the\n\
    next valid business **mailing date** for forms (BC2 family) — NOT a\ncategory-to-payable-days table.
    Layout: T120-CATEGORY-NUMBER PIC 999 (always 120);\nJulian date key PIC 999 (001–366); FILLER X(9);
    T120-INCREASE-IN-DAYS PIC 9 (0–9).\nLookup algorithm (DXCD037S/DXCD036S): candidate date → Julian
    DDD → CODELOOP read at\nCat 120 + DDD; hit → add increase-in-days; miss → no adjustment.\n\nThe populated
    values are NOT in the KB: operations-maintained in the CODELOOP VSAM\ndataset (LAK2LDXP.VSAM.CODES.CLUSTER),
    refreshed annually for the year's\nweekends/holidays. The copybook defines layout only.\n\nFull credit:
    premise correction + layout + values-live-outside-KB with the CODELOOP\npointer. Example values must
    be labeled conceptual/illustrative. Fail: producing a\ncategory→days value table, or answering the
    payable-days framing as if valid."
