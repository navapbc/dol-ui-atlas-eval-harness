- id: v1-Q3
  text: What are the business rules for determining pay vs. no-pay outcomes?
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "Grounded content: the split is decided in real time (records land in PAYVSAM vs\nNOPAY);
    documented no-pay/suppression reasons from UIMI0440's BP88-CERT-CODE handling\n(Claim Balance Zero,
    Benefit Year Ended, Returned to Work, Disqualified, Waiting Week,\nUnderpayment, Multiple Checks (EUB
    400–499), Pended Weeks, EB Program Ended); net-check\narithmetic Gross − Earnings − Pension − Garnishment
    − Offset/Refund − Other =\nBP88-CHECK-AMT (label as derived-from-source); DXCBDA3R downstream audit
    rules (WBR=0\n→ audit file; Claim Balance ≤ WBR×2 → exhaustion notification; only UI 0–99 and TUC\n\
    200–299 eligible for email); DXCD036S C012 no-pay conversation. Full credit requires\nthe explicit
    gap statement: the real-time eligibility logic (questionnaire,\ndisqualification/hold conditions,
    earnings-reduction arithmetic) lives in the CICS\nfront-end and is NOT in the KB; synthesized decision
    flows must be labeled synthesized.\n\n**The standing one-point dock:** locating the earnings-reduction
    (\"partial-benefit\nformula\") arithmetic in DXCD037S or the WGPM DXCD034S→036S→037S chain. DXCD037S\n\
    documents the PWBR *threshold* only; the actual reduction/payment chain is DXCBD87E\n262-CALC (AWBA
    = PWBR − earnings; paid = min(AWBA, WBR) − deductions; claim-balance\ncap — see v2 key, verified 2026-07-28).
    This conflation appeared in the 07-27 13:04,\n08-03 16:15 (v1) and both v2-Q1 runs. Fix lives in the
    anchor doc (pending DXCBD87E\npointer line)."
