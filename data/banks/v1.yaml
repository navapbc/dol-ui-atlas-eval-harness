- id: v1-Q2
  text: Explain the role of program DXCBDA2R and its input/output files.
  type: retrieval
  type_note: retrieval
  provenance:
  expected_stance: answer
  ground_truth: "Batch COBOL main/driver (NJ DOL UI/DI, author Bert Rogado, July 2013), extract/audit\n\
    driver for the Weekly Certification module; classifies and counts, does not decide.\nInputs: PAYVSAM
    (DD LOOPPFLE, 323 bytes), NOPAY (DD NOPAYFLE, 281 bytes), SYSIN date\ncontrol card, JCL PARM (DAILY/WEEKLY).
    Outputs (350 bytes each): ADTPRVWK/AUDPRVWK,\nADTD0629, ADTD0928, ADTONEWK, ADTTWOWK, ADTCWE14, ADTNEARN,
    ADTWEARN, ADTLPAYS,\nVOIDIND1/VOIDI1FL, BYPASS/BYPASSFL, plus report file AUDITREP. Processing: 1000-HSKP\n\
    init; previous-weekend calc (month/year/leap boundaries); PAYVSAM loop (void → VOIDIND1,\nboth CWE
    dates zero → BYPASS); NOPAY loop (CWE Date 1 zero → BYPASS); classification on\nBP88 fields (VOID-IND,
    OPERATOR-ID-CERT/TERMINAL-ID-CERT, CWE-DATE1/2,\nEARNINGS-AMOUNT1/2, TRANS-UI-PAY1/2); aged check
    >28 days → ADTCWE14; reports at\n4000/4100/4200; 5000 wrap-up control totals. Routing is non-exclusive
    (one record can\nhit multiple audit files) — stating this is part of a top answer. Calls DXCBD00R
    for\n$ABENDB error display. Citations: DXCBDA2R.cbl.md (+ .cbl.txt), Weekly Cert space."
  partial_credit:
