- id: v1-Q4
  text: What is the exact partial-benefit earnings offset formula?
  type: gap_probe
  type_note: gap probe
  provenance:
  expected_stance: hedge
  ground_truth: "**Source-verified 2026-07-27** against `source_deduped/LIBRMASTRALL/DXCD037S`\n(lines
    17927–17934):\n\n- PWBR = MAX(WBR × 1.2, WBR + $5.00); PWBR = 0 when WBR = 0. Stored in\n  UIMV_CLMNT_MON_SUM.AMT_BENFT_WK_PARTL.
    Floor branch only matters when WBR < $25.\n- WBR = (total base wages ÷ base weeks) × 0.6, truncated
    to WHOLE dollars (PIC S9(5)\n  hold field), base weeks capped at 52; alternative divisor when base
    weeks < 20 and a\n  prior monetary determination exists (1430/1440-*-WBR-CALC).\n- Cross-check: dol-ui-claimant-api
    `monetary_calculator_service.py` matches (0.6×AWW,\n  52-week cap, whole-$ floor) EXCEPT its PWBR
    = floor(WBR×1.2) has no +$5 branch —\n  flagged to the team as likely-unreachable, not asserted as
    a bug.\n\nFull credit: states the PWBR (and optionally WBR) formula as confirmed WITH citation\n(the
    anchor doc's verified-formula exception), AND hedges what is genuinely not in the\nKB — how reported
    earnings convert to the BP88-EARNINGS-AMOUNT deduction (the\ndisregard/reduction arithmetic, which
    lives in DXCBD87E; see Q3). The baseline fail\n(5/10): presenting formulas + worked examples as \"\
    exact\" with no hedging, before the\nverification existed. Post-verification, the fail flips: the
    dock is now for hedging\nthe *verified* formulas (over-hedging) or for presenting the *deduction*
    arithmetic as\nexact."
  partial_credit:
