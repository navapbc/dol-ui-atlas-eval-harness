questions:
- id: v4-Q1
  text: Our new-hire crossmatch spec says the replacement system's SG01 pipeline can only pull data 
    forward based on DB2 RSA_NONMON entries. What do the SG01 and RSA_NONMON DB2 tables contain in 
    LOOPS, and which batch jobs read or write them?
  type: retrieval
  type_note: retrieval (data architecture)
  provenance:
  expected_stance: hedge
  ground_truth: "Source spec: New Hire Crossmatch — \"the SG01 pipeline is only capable of pulling data\n\
    forward based on DB2 RSA_NONMON entries,\" which is why the spec adds a Glue job\nagainst DB2 for
    RTW dates. The DB2 Segments spike (\"Explore Downloading All Segments\nfrom DB2 to AWS\") confirms
    the frame: nightly IMS export data lands in DB2 \"SG tables.\"\n\nVerified in space:\n\n- **OTDUIMP.UIMT_RSA_NONMON**:
    L2UDB020's BRE describes it as the \"RSA Non-Monetary\n  UI transaction table\" and documents the
    extract: key non-monetary UIB claim fields\n  — SSN, program code, claim date, proofing date, logon
    ID, username, record\n  load/update timestamps — read with an uncommitted read (UR) and written as
    a\n  tilde-delimited CSV (LAK2LDXP.L2UDB020.NONMON.CSV). The JCL comment calls the\n  output \"flat
    file copy of DB2 table UIMT_RSA_NONMON.\" L2FTPRS2 also references the\n  table (transfer job).\n\
    - **OTDUIMP.UIMT_SG01_CLAIMANT**: labeled \"Core Claimant and Claim Data\" in\n  L2PUA003's BRE (read:
    claimant SSN, program code); also referenced in D2PAD140 and\n  D2FNDVSM JCL.\n- Related segment vocabulary:
    \"Segment 01 pay adjustments\" VSAM cluster\n  LAK2LPAP.VSAM.DABSSG01.CLUSTER in the DABS suite (DABI0069
    etc.) — same \"SG01\"\n  token, different object; a careful answer keeps the DB2 table and the VSAM
    cluster\n  distinct. Other OTDUIMP.UIMT_* tables are pervasive in the KB\n  (UIMT_UNIQUE_CLAIMANT_ID,
    UIMT_DIR_DEP_INFO, UIMT_SAVE_DETAIL,\n  UIMT_DOR_REFUND_PAYMENTS, ...), supporting the general IMS→DB2
    architecture frame.\n\nHonest gap (part of full credit): no in-KB job WRITES UIMT_RSA_NONMON or\n\
    UIMT_SG01_CLAIMANT — the population side (the IMS-to-DB2 replication itself) is not\ndocumented in
    the linked spaces. Claiming a specific populator is invention."
  partial_credit:
  after:
  checks:
    required_all:
    - UIMT_SG01_CLAIMANT
    required_any: []
    forbidden: []
    expect_citations:
    - UIMT_RSA_NONMON
    - L2UDB020
  verification:
    status: unverified
    verified_by:
    verified_on:
