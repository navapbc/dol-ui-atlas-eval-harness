- id: v4-Q8
  text: The MUNC replication spec shows each municipality row carries a local_office_id. On the 
    LOOPS side, how are local offices represented and used in claims processing, and is the 
    municipality-to-local-office assignment documented there?
  type: scope_boundary
  type_note: retrieval + system boundary
  provenance:
  expected_stance: answer
  ground_truth: "Source spec: MUNC & Zipcodes Postgres Replication — Oracle RCC.MUNC rows carry\nmunc_code,
    munc_fips, munc_zip, county, **local_office_id**, sda, tax_ui; RCC.ZIPCODES\ncarries zipcode → local_office_id.
    The question tests whether the agent describes\nLOOPS's own local-office machinery and draws the boundary
    at the assignment mapping.\n\nVerified in space:\n\n- **Table 112** is the local-office reference
    table: office number → name, street,\n  city/state/ZIP (+4), district name and code; loaded in-memory
    up to 85 entries\n  (DXCBD65R) and used for letter return addresses (DXCBD26B, UIMB0441: check return\n\
    \  address via Table 112 lookup).\n- Claims carry a **Responsible Local Office** (RLO) field; special
    values are\n  documented: **991** = Central Office / disability (DXCBW39R is the \"weekly claims\n\
    \  activity for Central Office 991\" report; DXCBD06E: if program code is 60 or 61\n  (Disability),
    set local office to 991), **999/997** = out-of-area/interstate\n  handling in classification rules.\n\
    - Statistical claim-type classification combines RLO and municipality code: type 4\n  interstate (PC
    11/12), type 3 for RLO 999/997, type 1 for municipality 05500-07599,\n  type 2 default (DXCBW30E family
    — the same range logic v3-Q8 graded).\n- Per-office output distribution: LOWBRSTA writes the Daily
    WFD Reopen Claims Report\n  to up to 110 per-local-office files via a predefined office table.\n\n\
    NOT in KB: how a claim GETS its local office from an address — the\nzip/municipality → local_office_id
    mapping is the RCC MUNC/ZIPCODES table the spec is\nreplicating, and RCC has no presence in the batch
    corpus. Full credit describes the\nin-KB machinery and places the assignment mapping outside the linked
    spaces;\ndescribing RCC.MUNC columns or the sync as if documented in LOOPS is the fail."
  partial_credit:
  after:
  checks:
    required_all:
    - Table 112
    - '991'
    required_any: []
    forbidden: []
    expect_citations: []
  verification:
    status: unverified
    verified_by:
    verified_on:
    notes:
